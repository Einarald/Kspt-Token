<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>Paper.io</title>
<style>
html,body{padding-bottom:env(safe-area-inset-bottom,0);padding-top:env(safe-area-inset-top,0);box-sizing:border-box;}
.kspt-safe-bottom{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);}
:root{--accent:#00bcd4;--accent2:#00e676;--panel:#0b0b0b;--danger:#ff4081;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
body{margin:0;padding:0;background:#000;color:#fff;font-family:Arial,sans-serif;overflow:hidden;touch-action:manipulation;}
.game-container{display:flex;flex-direction:column;align-items:center;height:100vh;padding:10px;background:linear-gradient(135deg,var(--panel) 0%,#1a1a1a 100%);position:relative;}
.game-header{display:flex;justify-content:space-between;width:100%;margin-bottom:10px;padding:10px;background:rgba(0,0,0,0.45);border-radius:10px;border:1px solid var(--accent);}
.game-title{color:var(--accent2);font-weight:bold;font-size:18px;}
.game-stats{display:flex;gap:15px;font-size:14px;}
canvas{background:#1a2a1a;border:2px solid var(--accent);border-radius:10px;display:block;}
.leaderboard{position:absolute;top:70px;left:10px;width:148px;padding:6px;background:rgba(0,0,0,0.45);backdrop-filter:blur(4px);border-radius:10px;border:1px solid rgba(0,188,212,0.5);z-index:10;pointer-events:none;opacity:0.65;transition:opacity .2s;}
.leaderboard:hover{opacity:0.92;}
.leaderboard h3{margin:0 0 8px 0;color:var(--accent2);font-size:12px;text-align:center;}
.lb-entry{display:flex;justify-content:space-between;padding:2px 4px;border-radius:4px;margin-bottom:2px;font-size:11px;}
.lb-entry.you{background:rgba(0,188,212,0.2);border-left:3px solid var(--accent);}
.lb-entry .lbr{width:20px;font-weight:bold;}
.lb-entry .lbn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lb-entry .lbs{width:42px;text-align:right;}
.minimap-wrap{position:absolute;bottom:80px;left:10px;width:110px;height:110px;background:rgba(0,0,0,0.35);backdrop-filter:blur(3px);border-radius:8px;border:2px solid rgba(0,188,212,0.5);z-index:10;pointer-events:auto;overflow:hidden;cursor:pointer;transition:transform .1s;}
.minimap-wrap:active{transform:scale(0.95);}
.minimap-canvas{width:110px;height:110px;display:block;}
#mm-overlay{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.88);align-items:center;justify-content:center;flex-direction:column;}
#mm-overlay.show{display:flex;}
#mm-overlay-canvas{border-radius:10px;border:2px solid rgba(0,188,212,0.8);image-rendering:pixelated;max-width:90vw;max-height:90vw;}
#mm-overlay-label{color:rgba(255,255,255,0.6);font-size:13px;margin-top:10px;}
.controls-container{display:flex;flex-direction:column;align-items:center;width:100%;margin-top:10px;gap:10px;}
.control-buttons-row{display:flex;gap:10px;}
.control-button{padding:12px 22px;background:linear-gradient(135deg,#00e5ff,#00bcd4);color:#000;border:none;border-radius:12px;cursor:pointer;font-weight:bold;font-size:15px;letter-spacing:.5px;box-shadow:0 0 10px rgba(0,188,212,0.6),inset 0 0 6px rgba(255,255,255,0.3);transition:transform .12s,box-shadow .12s,filter .12s;touch-action:manipulation;}
.control-button:hover{filter:brightness(1.12);}
.control-button:active{transform:scale(.95);}
.joystick-container{position:relative;width:150px;height:150px;margin-top:10px;}
.joystick-bg{width:100%;height:100%;background:rgba(0,188,212,0.08);border-radius:50%;position:relative;border:2px solid var(--accent);}
.joystick-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;background:var(--accent);border-radius:50%;box-shadow:0 0 10px rgba(0,188,212,0.5);}
.game-over{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.93);padding:30px;border-radius:15px;border:2px solid var(--accent2);text-align:center;z-index:100;width:80%;max-width:320px;backdrop-filter:blur(6px);}
.game-over h2{color:#ff4081;margin-top:0;}
.earned{color:var(--accent2);font-weight:bold;font-size:22px;margin:12px 0;}
.stat-row{display:flex;justify-content:space-between;margin:8px 0;font-size:14px;}
.stat-value{color:var(--accent2);}
#toast{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:200;white-space:nowrap;}
#toast.show{opacity:1;}
#boost-notif{
  position:absolute;top:230px;left:10px;z-index:20;pointer-events:none;
  display:flex;flex-direction:column;gap:4px;width:148px;
}
.boost-entry{
  background:rgba(0,0,0,0.72);color:#fff;font-size:11px;
  padding:5px 8px;border-radius:8px;border-left:3px solid #00e676;
  animation:kfin .2s ease;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:5px;
}
.float-text{position:absolute;pointer-events:none;z-index:20;font-weight:bold;font-size:17px;color:#00e676;text-shadow:0 1px 4px rgba(0,0,0,0.8);white-space:nowrap;transform:translateX(-50%);animation:floatUp 0.9s ease-out forwards;}
@keyframes floatUp{0%{opacity:1;transform:translateX(-50%) translateY(0) scale(0.6)}15%{opacity:1;transform:translateX(-50%) translateY(-4px) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-52px) scale(1)}}
.kf-entry{background:rgba(0,0,0,0.72);color:#fff;font-size:11px;padding:4px 7px;border-radius:6px;margin-bottom:4px;border-left:3px solid #ff4081;animation:kfin .2s ease;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
@keyframes kfin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
#killFlash{position:absolute;inset:0;border-radius:10px;background:rgba(255,64,129,0.18);pointer-events:none;z-index:5;opacity:0;transition:opacity .15s;}
</style>
</head>
<body>
<div class="game-container" id="gc">
  <div class="game-header">
    <div class="game-title">📄 Paper.io</div>
    <div class="game-stats">
      <div>Territory: <span id="territory">0%</span></div>
      <div>Kills: <span id="kills">0</span></div>
      <div>Rank: <span id="rank">#1</span></div>
    </div>
  </div>
  <canvas id="gameCanvas" width="360" height="360"></canvas>
  <div id="killFlash"></div>
  <div id="killfeed" style="position:absolute;top:70px;right:10px;z-index:20;pointer-events:none;width:160px;"></div>
  <div id="boost-notif"></div>
  <div class="leaderboard">
    <h3>🏆 Leaderboard</h3>
    <div id="lbEntries"></div>
  </div>
  <div class="minimap-wrap">
    <canvas class="minimap-canvas" id="mm" width="110" height="110"></canvas>
  </div>
  <div class="joystick-container" id="joyArea">
    <div class="joystick-bg"><div class="joystick-center" id="joyKnob"></div></div>
  </div>
  <div class="controls-container">
    <div class="control-buttons-row">
      <button class="control-button" id="pauseBtn">Pause</button>
      <button class="control-button" id="restartBtn">Restart</button>
      <button class="control-button" id="exitBtn">Exit</button>
    </div>
  </div>
</div>

<div class="game-over" id="gos">
  <h2>☠️ Game Over!</h2>
  <div class="stat-row">Territory: <span class="stat-value" id="fTer">0%</span></div>
  <div class="stat-row">Kills: <span class="stat-value" id="fKill">0</span></div>
  <div class="stat-row">Time: <span class="stat-value" id="fTime">0s</span></div>
  <div class="stat-row">Rank: <span class="stat-value" id="fRank">#?</span></div>
  <div class="earned">+<span id="eKSPT">0.00</span> KSPT</div>
  <div class="earned">+<span id="eEK">0</span> EK</div>
  <button id="playAgainBtn" style="background:#00e676;margin-bottom:10px;width:100%;padding:12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:15px;">Play Again</button>
  <button id="exitMenuBtn" style="background:#ff4081;width:100%;padding:12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:15px;">Exit to Menu</button>
</div>

<div class="game-over" id="winScreen" style="border-color:gold;display:none;">
  <h2 style="color:gold;font-size:22px;">🏆 You Win MAX!</h2>
  <div style="color:#fff;font-size:13px;margin-bottom:10px;">You conquered the entire map!</div>
  <div class="earned">+<span id="winKSPT">0.00</span> KSPT</div>
  <div class="earned">+<span id="winEK">3</span> EK</div>
  <button id="winPlayAgainBtn" style="background:#00e676;margin-bottom:10px;width:100%;padding:12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:15px;">Play Again</button>
  <button id="winExitBtn" style="background:#ff4081;width:100%;padding:12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:15px;">Exit to Menu</button>
</div>
<div id="toast"></div>
<div id="mm-overlay">
  <canvas id="mm-overlay-canvas" width="520" height="520"></canvas>
  <div id="mm-overlay-label">Нажмите чтобы закрыть</div>
</div>

function isSameOrigin(w){try{void w.location.href;return true;}catch(e){return false;}}
window.addEventListener('message',ev=>{
  const m=ev.data; if(!m||typeof m!=='object')return;
  if(m.type==='kspt_init'||m.type==='kspt_hourly_update') window.__kspt_hourly=Number(m.hourly)||0;
  if(m.type==='kspt_no_tickets'){G.running=false;showToast('Not enough tickets!');document.getElementById('gos').style.display='block';}
  if(m.type==='kspt_do_restart'){document.getElementById('gos').style.display='none';document.getElementById('winScreen').style.display='none';initGame();}
  if(m.type==='kspt_parent_viewport') setTimeout(fitUI,50);
  if(m.type==='kspt_parent_set_game_over'&&m.blockButtons)['pauseBtn','exitBtn'].forEach(id=>document.getElementById(id)?.setAttribute('disabled','true'));
});
function pmsg(data){try{(window.parent||window.top).postMessage(data,'*');}catch(e){}}
function awardKSPT(v,x=0,y=0){

function offlinePct(pct){
  if(typeof window.__kspt_hourly==='number')return Math.round(window.__kspt_hourly*(pct/100)*100)/100;
  try{const r=localStorage.getItem('kspt_data');if(r){const p=JSON.parse(r);if(p&&typeof p.offlineHourly==='number')return Math.round(p.offlineHourly*(pct/100)*100)/100;}}catch(e){}
  return 0;
}

/* ── AUDIO ─────────────────────────────────────────── */
let _ac=null, _ui=false;
function ac(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();return _ac;}
function markUI(){_ui=true;try{const a=ac();if(a.state==='suspended')a.resume();}catch(e){}}
function snd(type){
  if(!_ui)return;
  try{
    const a=ac();if(a.state==='suspended')return;
    const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);
    let f=440,d=0.1,v=0.07,w='sine';
    if(type==='capture'){f=660;d=0.12;v=0.09;w='square';}
    else if(type==='kill'){f=880;d=0.18;v=0.1;w='sawtooth';}
    else if(type==='die'){f=180;d=0.4;v=0.12;}
    else if(type==='ek'){f=1100;d=0.28;v=0.13;w='triangle';}
    o.type=w;o.frequency.value=f;
    g.gain.setValueAtTime(v,a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);
    o.start();o.stop(a.currentTime+d);
  }catch(e){}
}
function vib(p){if(!_ui||!('vibrate' in navigator))return;try{navigator.vibrate(p);}catch(e){}}
function showToast(msg,ms=2200){
  const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),ms);
}

function spawnFloatText(worldX,worldY,worldZ,text,color='#00e676'){
  // Project 3D world position to 2D screen coords
  const v=new THREE.Vector3(worldX,worldY,worldZ);
  v.project(cam);
  // Map NDC to canvas element pixels
  const rect=cvs.getBoundingClientRect();
  const gcRect=document.getElementById('gc').getBoundingClientRect();
  const sx=rect.left-gcRect.left + (v.x*0.5+0.5)*rect.width;
  const sy=rect.top -gcRect.top  + (-v.y*0.5+0.5)*rect.height;
  const el=document.createElement('div');
  el.className='float-text';
  el.textContent=text;
  el.style.left=sx+'px';
  el.style.top=sy+'px';
  el.style.color=color;
  document.getElementById('gc').appendChild(el);
  el.addEventListener('animationend',()=>el.remove());
}

/* ── CONSTANTS ──────────────────────────────────────── */
const SZ=130;         // grid size (cells) — ~58% larger than original 80
const CL=1.0;         // cell size in world units
const LIM=(SZ/2-0.8)*CL;  // movement boundary in world units

const SPD=0.1496;     // player speed — 2× original, −15%
const N_BOTS=9;
const EK_CAP=2;

const CI=[0x00bcd4,0xe91e63,0x4caf50,0xff9800,0x9c27b0,0xf44336,0x2196f3,0xffeb3b,0xff5722,0x00e676];
const CC=['#00bcd4','#e91e63','#4caf50','#ff9800','#9c27b0','#f44336','#2196f3','#ffeb3b','#ff5722','#00e676'];
const BN=['Player 2','Player 3','Player 4','Player 5','Player 6','Player 7','Player 8','Player 9','Player 10'];

/* ── MAP DATA ───────────────────────────────────────── */
const ownerMap  = new Int8Array(SZ*SZ).fill(-1);   // -1=neutral, 0=player, 1-9=bots
const shape     = new Uint8Array(SZ*SZ).fill(0);   // 1=playable

function mi(gx,gy){return gy*SZ+gx;}
function g2w(gx,gy){return{wx:(gx-SZ/2+0.5)*CL, wz:(gy-SZ/2+0.5)*CL};}
function w2g(wx,wz){return{gx:Math.floor(wx/CL+SZ/2), gy:Math.floor(wz/CL+SZ/2)};}
function ok(gx,gy){return gx>=0&&gy>=0&&gx<SZ&&gy<SZ;}
function play(gx,gy){return ok(gx,gy)&&shape[mi(gx,gy)]===1;}

function genMap(){
  // Full square map — every cell is playable, photo covers the whole grid
  shape.fill(1);
}

function randCell(agx,agy,minD=0){
  for(let t=0;t<800;t++){
    const gx=3+Math.floor(Math.random()*(SZ-6)),gy=3+Math.floor(Math.random()*(SZ-6));
    if(!play(gx,gy))continue;
    // Don't spawn inside any existing territory
    if(ownerMap[mi(gx,gy)]>=0)continue;
    if(minD>0){const dx=gx-(agx||SZ/2),dy=gy-(agy||SZ/2);if(Math.sqrt(dx*dx+dy*dy)<minD)continue;}
    return{gx,gy};
  }
  // Fallback: find any neutral playable cell
  for(let gy=3;gy<SZ-3;gy++)for(let gx=3;gx<SZ-3;gx++){
    if(play(gx,gy)&&ownerMap[mi(gx,gy)]<0)return{gx,gy};
  }
  return{gx:Math.floor(SZ/2),gy:Math.floor(SZ/2)};
}

/* ── PHOTO-PIXEL TILE SYSTEM ────────────────────────── */
// The map is a square grid. Each cell's color comes from the corresponding
// pixel of the embedded photo. Capturing a cell reveals that pixel.
// Neutral cells are shown dark. One shared InstancedMesh with instanceColor.
//
// Y-levels:
//   ground plane : y = -0.07
//   neutral tiles: y =  0.00  (dark, via instanceColor)
//   owned tiles  : y =  0.18  (photo color, via instanceColor)
//   trail        : y =  0.55

const NEUT_Y  = 0.00;
const OWNED_Y = 0.18;

const neutGeo = new THREE.BoxGeometry(CL*0.985, 0.07, CL*0.985);
const tileGeo = new THREE.BoxGeometry(CL*0.93,  0.20, CL*0.93);
const neutMat = new THREE.MeshLambertMaterial({color:0x1a1a1a});

// Photo pixel colors per cell — populated after image loads
const _cellColor = new Uint32Array(SZ*SZ); // packed 0xRRGGBB
let _photoReady = false;

// Use the embedded photo source
const _PHOTO_URL = typeof PHOTO_SRC !== 'undefined' ? PHOTO_SRC : '';

function _loadPhotoColors(cb){
  const img = new Image();
  img.onload = ()=>{
    const canvas = document.createElement('canvas');
    canvas.width = SZ; canvas.height = SZ;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, SZ, SZ);
    const px = ctx.getImageData(0,0,SZ,SZ).data;
    for(let i=0;i<SZ*SZ;i++){
      const r=px[i*4], g=px[i*4+1], b=px[i*4+2];
      _cellColor[i]=(r<<16)|(g<<8)|b;
    }
    _photoReady=true;
    cb();
  };
  img.onerror = ()=>{ _photoReady=false; cb(); };
  img.src = _PHOTO_URL;
}

const entColorMap={};
const matCache={};
function getMat(owner){ return null; } // unused — we use instanceColor now

// Single shared InstancedMesh for ALL owned tiles (instanceColor per cell)
let _tileInst = null;       // THREE.InstancedMesh
let _neutInst  = null;      // THREE.InstancedMesh for neutral tiles

// cell index -> slot index in _tileInst (-1 = not allocated)
const _cellSlot   = new Int32Array(SZ*SZ).fill(-1);
const _neutSlot   = new Int32Array(SZ*SZ).fill(-1);
const _dummy      = new THREE.Object3D();
const _HIDDEN_MAT = new THREE.Matrix4().makeScale(0,0,0);

// Dirty flags for batched GPU upload
const _neutDirty={v:false};
const _tileDirty={v:false};
// Legacy compat
const _ownedInst={};
const _ownedDirty={};
const _cellInstIdx=new Int32Array(SZ*SZ).fill(-1);
const _neutCellInstIdx=new Int32Array(SZ*SZ).fill(-1);

function _flushTileUpdates(){
  if(_neutDirty.v&&_neutInst){_neutInst.instanceMatrix.needsUpdate=true;_neutDirty.v=false;}
  if(_tileDirty.v&&_tileInst){
    _tileInst.instanceMatrix.needsUpdate=true;
    _tileInst.instanceColor.needsUpdate=true;
    _tileDirty.v=false;
  }
  // legacy compat flush (no-op for old owners)
  for(const o of Object.keys(_ownedDirty)) delete _ownedDirty[o];
}

function _disposeOwnedInst(owner){ delete _ownedInst[owner]; }

function _buildTileInst(){
  if(_tileInst){_tileInst.geometry.dispose();_tileInst.material.dispose();scene.remove(_tileInst);_tileInst=null;}
  const mat = new THREE.MeshLambertMaterial({vertexColors:false});
  _tileInst = new THREE.InstancedMesh(tileGeo, mat, SZ*SZ);
  _tileInst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  _tileInst.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(SZ*SZ*3), 3);
  _tileInst.instanceColor.setUsage(THREE.DynamicDrawUsage);
  _tileInst.frustumCulled = false;
  _tileInst.count = 0;
  scene.add(_tileInst);
  _cellSlot.fill(-1);
}

function _buildNeutInst(){
  if(_neutInst){_neutInst.geometry.dispose();_neutInst.material.dispose();scene.remove(_neutInst);_neutInst=null;}
  let cnt=0;
  for(let i=0;i<SZ*SZ;i++) if(shape[i]) cnt++;
  const mat = new THREE.MeshLambertMaterial({color:0x111111});
  _neutInst = new THREE.InstancedMesh(neutGeo, mat, cnt);
  _neutInst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  _neutInst.frustumCulled = false;
  let idx=0;
  for(let gy=0;gy<SZ;gy++) for(let gx=0;gx<SZ;gx++){
    if(!shape[mi(gx,gy)])continue;
    _neutCellInstIdx[mi(gx,gy)]=idx;
    const{wx,wz}=g2w(gx,gy);
    _dummy.position.set(wx,NEUT_Y,wz);_dummy.scale.setScalar(1);_dummy.updateMatrix();
    _neutInst.setMatrixAt(idx,_dummy.matrix);
    idx++;
  }
  _neutInst.instanceMatrix.needsUpdate=true;
  scene.add(_neutInst);
}

function _hideNeutCell(gx,gy){
  if(!_neutInst)return;
  const idx=_neutCellInstIdx[mi(gx,gy)];
  if(idx<0)return;
  _neutInst.setMatrixAt(idx,_HIDDEN_MAT);
  _neutDirty.v=true;
}
function _showNeutCell(gx,gy){
  if(!_neutInst)return;
  const idx=_neutCellInstIdx[mi(gx,gy)];
  if(idx<0)return;
  const{wx,wz}=g2w(gx,gy);
  _dummy.position.set(wx,NEUT_Y,wz);_dummy.scale.setScalar(1);_dummy.updateMatrix();
  _neutInst.setMatrixAt(idx,_dummy.matrix);
  _neutDirty.v=true;
}
function _getOrCreateOwnedInst(owner){ return null; } // unused

function paintCell(gx,gy,owner){
  if(!ok(gx,gy)||!shape[mi(gx,gy)])return;
  const i=mi(gx,gy);
  const prev=ownerMap[i];
  if(prev===owner)return;
  ownerMap[i]=owner;

  // Sync prev owner's ter set
  if(prev>=0){
    // intentionally NOT removing from ter — bots reclaim via honest capture
  }

  _hideNeutCell(gx,gy);

  // Allocate slot in shared tileInst if needed
  let slot=_cellSlot[i];
  if(slot<0){
    slot=_tileInst.count++;
    _cellSlot[i]=slot;
  }

  // Position
  const{wx,wz}=g2w(gx,gy);
  _dummy.position.set(wx,OWNED_Y,wz);_dummy.scale.setScalar(1);_dummy.updateMatrix();
  _tileInst.setMatrixAt(slot,_dummy.matrix);

  // Color = photo pixel
  const packed=_cellColor[i];
  const r=((packed>>16)&0xff)/255;
  const g2=((packed>>8)&0xff)/255;
  const b=(packed&0xff)/255;
  _tileInst.instanceColor.setXYZ(slot, r, g2, b);

  _tileDirty.v=true;
}

function eraseCell(gx,gy){
  if(!ok(gx,gy))return;
  const i=mi(gx,gy);
  const prev=ownerMap[i];
  if(prev<0)return;
  ownerMap[i]=-1;

  // Hide tile slot
  const slot=_cellSlot[i];
  if(slot>=0){
    _tileInst.setMatrixAt(slot,_HIDDEN_MAT);
    _tileDirty.v=true;
  }

  _showNeutCell(gx,gy);
}

// Legacy stubs
const tileMesh=new Array(SZ*SZ).fill(null);
const neutMeshMap=new Array(SZ*SZ).fill(null);
let neutMeshes=[];

function buildNeutral(){
  for(const m of neutMeshes)scene.remove(m);
  neutMeshes=[];neutMeshMap.fill(null);tileMesh.fill(null);
  for(const owner of Object.keys(_ownedInst)) _disposeOwnedInst(Number(owner));
  _cellSlot.fill(-1);
  _buildTileInst();
  _buildNeutInst();
  _neutCellInstIdx.fill(-1);
  // rebuild neutCellInstIdx
  let idx=0;
  for(let gy=0;gy<SZ;gy++) for(let gx=0;gx<SZ;gx++){
    if(!shape[mi(gx,gy)])continue;
    _neutCellInstIdx[mi(gx,gy)]=idx++;
  }
}

}

function spawnCube(e){
  if(e.cube){scene.remove(e.cube);e.cube=null;}
  entColorMap[e.id]=e.clr;
  if(matCache[e.id]){matCache[e.id].dispose();delete matCache[e.id];}

  const mat =new THREE.MeshLambertMaterial({color:e.clr,emissive:e.clr,emissiveIntensity:0.20});
  const dark=new THREE.MeshLambertMaterial({color:e.clr,emissive:e.clr,emissiveIntensity:0.06});
  const cockpitMat=new THREE.MeshLambertMaterial({color:0x88ddff,emissive:0x44aacc,emissiveIntensity:0.5,transparent:true,opacity:0.75});
  const engineMat=new THREE.MeshLambertMaterial({color:0xff6600,emissive:0xff3300,emissiveIntensity:0.9,transparent:true,opacity:0.85});

  const g=new THREE.Group();
  const sc=e.id===0?1.0:0.78;

  // Fuselage
  const body=new THREE.Mesh(new THREE.CylinderGeometry(0.13*sc,0.13*sc,0.72*sc,10),mat);
  body.rotation.z=Math.PI/2;
  g.add(body);
  // Nose cone
  const nose=new THREE.Mesh(new THREE.ConeGeometry(0.13*sc,0.28*sc,10),mat);
  nose.rotation.z=-Math.PI/2; nose.position.x=0.50*sc;
  g.add(nose);
  // Tail cone
  const tail=new THREE.Mesh(new THREE.ConeGeometry(0.11*sc,0.22*sc,10),dark);
  tail.rotation.z=Math.PI/2; tail.position.x=-0.47*sc;
  g.add(tail);
  // Cockpit bubble
  const cockpit=new THREE.Mesh(new THREE.SphereGeometry(0.115*sc,8,6,0,Math.PI*2,0,Math.PI*0.6),cockpitMat);
  cockpit.position.set(0.12*sc,0.13*sc,0);
  g.add(cockpit);
  // Main wings
  const wL=new THREE.Mesh(new THREE.BoxGeometry(0.45*sc,0.04*sc,0.55*sc),mat);
  wL.position.set(-0.04*sc,0,0.32*sc); wL.rotation.y=-0.18;
  g.add(wL);
  const wR=new THREE.Mesh(new THREE.BoxGeometry(0.45*sc,0.04*sc,0.55*sc),mat);
  wR.position.set(-0.04*sc,0,-0.32*sc); wR.rotation.y=0.18;
  g.add(wR);
  // Vertical tail fin
  const finV=new THREE.Mesh(new THREE.BoxGeometry(0.28*sc,0.18*sc,0.04*sc),dark);
  finV.position.set(-0.38*sc,0.12*sc,0); finV.rotation.z=0.15;
  g.add(finV);
  // Horizontal tail fins
  const finHL=new THREE.Mesh(new THREE.BoxGeometry(0.26*sc,0.03*sc,0.22*sc),dark);
  finHL.position.set(-0.38*sc,0,0.14*sc); g.add(finHL);
  const finHR=finHL.clone(); finHR.position.set(-0.38*sc,0,-0.14*sc); g.add(finHR);
  // Engine glow
  const eng=new THREE.Mesh(new THREE.CylinderGeometry(0.065*sc,0.09*sc,0.1*sc,8),engineMat);
  eng.rotation.z=Math.PI/2; eng.position.x=-0.44*sc;
  g.add(eng);
  // Player: wing-tip lights
  if(e.id===0){
    const tipMat=new THREE.MeshLambertMaterial({color:0xffffff,emissive:0xffffff,emissiveIntensity:1.0});
    const tipL=new THREE.Mesh(new THREE.SphereGeometry(0.04,6,4),tipMat);
    tipL.position.set(-0.04,0.02,0.60); g.add(tipL);
    const tipR=tipL.clone(); tipR.position.set(-0.04,0.02,-0.60); g.add(tipR);
  }

  g.position.set(e.wx,0.35,e.wz);
  scene.add(g); e.cube=g;
}

// Crown: proper crown shape — golden ring with 5 spikes
function spawnCrown(e){
  if(e.crown){scene.remove(e.crown);e.crown=null;}
  const g=new THREE.Group();
  const goldMat=new THREE.MeshLambertMaterial({color:0xffd700,emissive:0xcc8800,emissiveIntensity:0.4});
  // Base ring (torus)
  const ring=new THREE.Mesh(new THREE.TorusGeometry(0.28,0.055,8,20),goldMat);
  ring.rotation.x=Math.PI/2;
  g.add(ring);
  // 5 spikes around the ring
  const nSpikes=5;
  for(let i=0;i<nSpikes;i++){
    const a=(i/nSpikes)*Math.PI*2;
    const spike=new THREE.Mesh(new THREE.ConeGeometry(0.055,0.22,6),goldMat);
    spike.position.set(Math.cos(a)*0.28,0.11,Math.sin(a)*0.28);
    g.add(spike);
    // Small gem on alternate spikes
    if(i%2===0){
      const gemMat=new THREE.MeshLambertMaterial({color:0xff2244,emissive:0xff0022,emissiveIntensity:0.6});
      const gem=new THREE.Mesh(new THREE.OctahedronGeometry(0.045),gemMat);
      gem.position.set(Math.cos(a)*0.28,0.22,Math.sin(a)*0.28);
      g.add(gem);
    }
  }
  g.position.set(e.wx,1.3,e.wz);
  scene.add(g);e.crown=g;
}
function updateCrowns(){
  // Crown follows the cube with leading bot (highest territory)
  // First just keep crown bot's crown synced; remove if dead
  for(const b of bots){
    if(b.crown){
      if(b.isDead){scene.remove(b.crown);b.crown=null;}
      else{ b.crown.position.set(b.wx,1.3,b.wz); b.crown.rotation.y+=0.03; }
    }
  }
}
const TRAIL_MAX=600; // max points in trail path buffer
const TRAIL_Y=0.55;  // Y-level for trail — above owned tiles (0.18)
const TRAIL_WIDTH=0.28; // half-width of the ribbon strip

// Each entity gets a ribbon mesh (PlaneGeometry quads built from path segments)
function spawnLine(e){
  if(e.line){
    scene.remove(e.line);
    if(e.line.geometry)e.line.geometry.dispose();
    if(e.line.material)e.line.material.dispose();
    e.line=null;
  }
  // We store the raw path points; the ribbon geometry is rebuilt when path changes
  e.pts=[];
  e._lineBuf=null;   // not used for ribbon but kept for API compat
  e._lineCount=0;
  e._trailPts=[];    // [{x,z}] world positions along the path
  // Create the mesh with a placeholder geometry
  const geo=new THREE.BufferGeometry();
  const mat=new THREE.MeshBasicMaterial({color:e.clr,side:THREE.DoubleSide,transparent:true,opacity:0.45,depthWrite:false});
  const mesh=new THREE.Mesh(geo,mat);
  mesh.frustumCulled=false;
  scene.add(mesh);
  e.line=mesh;
}

function _rebuildRibbon(e){
  if(!e.line)return;
  const pts=e._trailPts;
  const n=pts.length;
  if(n<2){
    e.line.geometry.dispose();
    e.line.geometry=new THREE.BufferGeometry();
    return;
  }
  // Build a ribbon: for each segment between pts[i] and pts[i+1],
  // extrude TRAIL_WIDTH perpendicular to the segment direction
  const verts=[];
  const idx=[];
  for(let i=0;i<n;i++){
    const prev=pts[Math.max(0,i-1)];
    const next=pts[Math.min(n-1,i+1)];
    // Tangent along path
    const tx=next.x-prev.x, tz=next.z-prev.z;
    const len=Math.sqrt(tx*tx+tz*tz)||1;
    // Perpendicular (normal in XZ plane)
    const nx=-tz/len, nz=tx/len;
    verts.push(
      pts[i].x+nx*TRAIL_WIDTH, TRAIL_Y, pts[i].z+nz*TRAIL_WIDTH,
      pts[i].x-nx*TRAIL_WIDTH, TRAIL_Y, pts[i].z-nz*TRAIL_WIDTH
    );
    if(i>0){
      const b=(i-1)*2;
      idx.push(b,b+1,b+2, b+1,b+3,b+2);
    }
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
  geo.setIndex(idx);
  e.line.geometry.dispose();
  e.line.geometry=geo;
}

function pushTrailPoint(e){
  if(!e.line)return;
  if(!e._trailPts)e._trailPts=[];
  e._trailPts.push({x:e.wx,z:e.wz});
  if(e._trailPts.length>TRAIL_MAX)e._trailPts.shift();
  e._lineCount=e._trailPts.length;
  _rebuildRibbon(e);
}
function refreshLine(e){
  if(!e.line||!e._trailPts||e._trailPts.length<1)return;
  // Update last point to current position (smooth tip)
  e._trailPts[e._trailPts.length-1]={x:e.wx,z:e.wz};
  _rebuildRibbon(e);
}
function clearTrail(e){
  e.trail=[];e.trSet.clear();
  e._wasHome=true;
  e._trailPts=[];
  e._lineCount=0;
  if(e.line){
    e.line.geometry.dispose();
    e.line.geometry=new THREE.BufferGeometry();
  }
}
function giveZone(e,r){
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    const gx=e.sgx+dx,gy=e.sgy+dy;
    if(!play(gx,gy))continue;
    const k=`${gx},${gy}`;sharedTer.add(k);paintCell(gx,gy,0);
  }
  _flushTileUpdates();
}
// Organic territory: flood-fill outward from center with random walk weighting
function giveZoneFill(e,r){
  const target=Math.round(Math.PI*r*r*0.82); // ~82% of circle area
  const visited=new Set();
  const q=[{gx:e.sgx,gy:e.sgy,w:1}];
  visited.add(`${e.sgx},${e.sgy}`);
  let filled=0;
  // weighted BFS: neighbors get random priority to create organic shape
  while(q.length>0&&filled<target){
    // sort randomly to create jagged edges
    const idx=Math.floor(Math.pow(Math.random(),1.5)*q.length);
    const {gx,gy}=q.splice(idx,1)[0];
    if(!play(gx,gy))continue;
    const dx=gx-e.sgx,dy=gy-e.sgy;
    if(Math.sqrt(dx*dx+dy*dy)>r+2)continue;
    const k=`${gx},${gy}`;sharedTer.add(k);paintCell(gx,gy,0);filled++;
    for(const[nx,ny]of[[gx-1,gy],[gx+1,gy],[gx,gy-1],[gx,gy+1],[gx-1,gy-1],[gx+1,gy+1],[gx-1,gy+1],[gx+1,gy-1]]){
      const k=`${nx},${ny}`;
      if(!visited.has(k)&&play(nx,ny)){visited.add(k);q.push({gx:nx,gy:ny});}
    }
  }
  _flushTileUpdates();
}

/* ── FLOOD FILL CAPTURE ─────────────────────────────── */
function captureLoop(e){
  if(e.trSet.size<3)return 0;

  // barrier = trail + shared territory
  const barrier=new Set([...e.trSet,...sharedTer]);
  const outside=new Set(),q=[];
  function seed(gx,gy){const k=`${gx},${gy}`;if(!barrier.has(k)&&!outside.has(k)){outside.add(k);q.push(gx,gy);}}
  for(let g=0;g<SZ;g++){seed(g,0);seed(g,SZ-1);seed(0,g);seed(SZ-1,g);}
  let h=0;
  while(h<q.length){
    const cx=q[h++],cy=q[h++];
    for(const[nx,ny]of[[cx-1,cy],[cx+1,cy],[cx,cy-1],[cx,cy+1]]){
      if(!ok(nx,ny))continue;const k=`${nx},${ny}`;
      if(barrier.has(k)||outside.has(k))continue;outside.add(k);q.push(nx,ny);
    }
  }
  let cap=0;
  for(let gy=0;gy<SZ;gy++)for(let gx=0;gx<SZ;gx++){
    if(!shape[mi(gx,gy)])continue;
    const k=`${gx},${gy}`;
    if(outside.has(k))continue;
    if(ownerMap[mi(gx,gy)]<0){
      sharedTer.add(k);
      paintCell(gx,gy,0); // all territory is "team 0"
      cap++;
    }
  }
  _flushTileUpdates();
  clearTrail(e);
  invalidateMinimapTer();
  return cap;
}

/* ── KILL ───────────────────────────────────────────── */
function killEnt(e,killer){
  // No deaths — just clear trail
  clearTrail(e);
}

/* ── STEP ───────────────────────────────────────────── */
function stepEnt(e, dt){
  if(e.isDead)return;

  const s=dt*60;

  // Candidate next position (clamped to world bounds)
  const nx=Math.max(-LIM,Math.min(LIM, e.wx+Math.cos(e.angle)*e.spd*s));
  const nz=Math.max(-LIM,Math.min(LIM, e.wz+Math.sin(e.angle)*e.spd*s));

  // Soft redirect on world-boundary wall hit
  if(nx<=- LIM||nx>=LIM||nz<=-LIM||nz>=LIM){
    const toC=Math.atan2(-e.wz,-e.wx);
    let df=toC-e.angle;while(df>Math.PI)df-=Math.PI*2;while(df<-Math.PI)df+=Math.PI*2;
    e.angle+=df*0.25;
  }

  // ── WATER / SHORE COLLISION ──────────────────────────
  const{gx:ngx,gy:ngy}=w2g(nx,nz);
  if(!play(ngx,ngy)){
    // Full move is into water — try axis-separated sliding
    const{gx:gxX,gy:gyX}=w2g(nx, e.wz);
    const{gx:gxZ,gy:gyZ}=w2g(e.wx, nz);
    const canX=play(gxX,gyX);
    const canZ=play(gxZ,gyZ);
    if(canX)     { e.wx=nx; }
    else if(canZ){ e.wz=nz; }
    else {
      // Fully cornered — reverse direction so entity escapes immediately
      e.angle+=Math.PI+(Math.random()-0.5)*0.5;
    }
    // Nudge angle toward map centre
    const toCenter=Math.atan2(-e.wz,-e.wx);
    let df=toCenter-e.angle;while(df>Math.PI)df-=Math.PI*2;while(df<-Math.PI)df+=Math.PI*2;
    e.angle+=df*0.15;
    if(e.cube){e.cube.position.set(e.wx,0.35,e.wz);e.cube.rotation.y=-e.angle;}
    return;
  }

  // Move is valid — apply
  e.wx=nx; e.wz=nz;

  if(e.cube){
    e.cube.position.set(e.wx,0.35,e.wz);
    e.cube.rotation.y=-e.angle;
  }

  const{gx,gy}=w2g(e.wx,e.wz);
  const ck=`${gx},${gy}`;
  const home=e.ter.has(ck);

  // Vibrate when player enters enemy territory
  if(e.id===0&&!home){
    const cellOwner=ownerMap[mi(gx,gy)];
    if(cellOwner>0&&(gx!==e.lgx||gy!==e.lgy)) vib(8);
  }

  if(home){
    e._wasHome=true;
    if(e.trSet.size>0){
      const cap=captureLoop(e);
      if(cap>0){
        snd('capture');
        if(e.id===0){chkTerReward();showCapturePopup(cap);}
      } else {
        clearTrail(e);
      }
    }
    e.lgx=gx;e.lgy=gy;
  } else {
    // Outside territory — build trail

    // First frame outside: init _trailPts
    if(e._wasHome){
      e._wasHome=false;
      if(!e._trailPts)e._trailPts=[];
      e._trailPts=[];
      e._lastTrailWx=e.wx; e._lastTrailWz=e.wz;
    }

    // Add world-position point every frame (not grid-locked) for smooth ribbon
    if(!e._trailPts)e._trailPts=[];
    const MIN_DIST=0.05; // minimum distance between ribbon points
    const lastPt=e._trailPts[e._trailPts.length-1];
    if(!lastPt||Math.hypot(e.wx-lastPt.x,e.wz-lastPt.z)>=MIN_DIST){
      e._trailPts.push({x:e.wx,z:e.wz});
      if(e._trailPts.length>TRAIL_MAX)e._trailPts.shift();
      _rebuildRibbon(e);
    }

    // Grid-based trail tracking for collision/capture logic
    if(gx!==e.lgx||gy!==e.lgy){
      e.lgx=gx;e.lgy=gy;
      if(e.trSet.has(ck)){
        // No death — just clear trail and keep moving
        clearTrail(e);return;
      }
      e.trail.push({gx,gy});e.trSet.add(ck);
    }
  }
}

// also always update trailing tip while outside territory (smooth movement)
function updateTrailTip(e){
  if(!e.isDead&&e.line&&e._lineCount>0){
    const{gx,gy}=w2g(e.wx,e.wz);
    if(!e.ter.has(`${gx},${gy}`)) refreshLine(e);
  }
}

function reviveBot(b){
  // Self-trail collision: clear trail, don't wipe territory
  clearTrail(b);

  const{gx,gy}=w2g(b.wx,b.wz);

  // Find a safe interior cell of own territory to retreat toward
  // Prefer cells well away from the map edge
  const SAFE_MARGIN=18; // cells from map edge considered safe
  const cx=SZ/2, cy=SZ/2;
  let bestCell=null, bestScore=-1;
  let sampled=0;
  for(const k of b.ter){
    const[tx,ty]=k.split(',').map(Number);
    // Distance from map edge (lower = more dangerous)
    const edgeDist=Math.min(tx,ty,SZ-1-tx,SZ-1-ty);
    if(edgeDist<4) continue; // skip cells right on edge
    // Prefer cells closer to map centre and away from current position
    const distFromCurrent=Math.abs(tx-gx)+Math.abs(ty-gy);
    const score=edgeDist*2+distFromCurrent*0.5;
    if(score>bestScore){bestScore=score;bestCell={gx:tx,gy:ty};}
    if(++sampled>80)break;
  }

  if(bestCell){
    // Steer toward safe interior cell
    const{wx:tx,wz:tz}=g2w(bestCell.gx,bestCell.gy);
    b.angle=Math.atan2(tz-b.wz,tx-b.wx)+(Math.random()-0.5)*0.3;
    b.sgx=bestCell.gx; b.sgy=bestCell.gy;
  } else {
    // No territory: steer toward map centre, away from edge
    const toCenter=Math.atan2(cy*CL-b.wz-SZ/2*CL, cx*CL-b.wx-SZ/2*CL);
    b.angle=toCenter+(Math.random()-0.5)*0.4;
    if(play(gx,gy)){b.sgx=gx;b.sgy=gy;}
  }

  // Enter cautious expand mode — bot will develop territory gradually, not hug walls
  b.ais='retreat'; b.ait=2.0+Math.random()*1.5;
}

/* ── COLLISIONS ─────────────────────────────────────── */
// Sub-stepping: interpolate entity positions between last and current frame
// to prevent fast-moving entities tunneling through thin trails
const _prevPos=new Map(); // entity id -> {wx,wz}

function checkCollisions(){
  // No killing — everyone is immortal, trails just pass through each other
  const all=[player,...bots];
  for(const e of all){
    _prevPos.set(e.id,{wx:e.wx,wz:e.wz});
  }
}

/* ── BOT AI ─────────────────────────────────────────── */
function updateBot(b,dt){
  if(b.isDead)return;
  b.ait-=dt;

  const{gx,gy}=w2g(b.wx,b.wz);
  const home=b.ter.has(`${gx},${gy}`);
  const tl=b.trSet.size;

  // Player proximity vars — computed once, used in both state transitions and steering
  const pdx=player.isDead?0:player.wx-b.wx;
  const pdz=player.isDead?0:player.wz-b.wz;
  const playerDist=player.isDead?9999:Math.sqrt(pdx*pdx+pdz*pdz);

  // ── STATE TRANSITIONS ──────────────────────────────
  if(b.ait<=0||b.ais==='idle'){
    // Aggressive bots tolerate much longer trails
    const maxTrail = b.type==='aggressive'
      ? 18 + Math.floor(b.agg*20)   // 18–38 cells before retreat
      : 12 + Math.floor(b.agg*16);  // 12–28 cells

    if(!home&&tl===0){
      b.ais='retreat'; b.ait=1.5;
    } else if(tl>maxTrail){
      b.ais='retreat'; b.ait=1+Math.random()*0.8;
    } else if(home&&tl===0){
      // Safe at home — expand. In calm state, pick bigger expansion loops
      const calm = playerDist > b.vis*CL*1.5; // no threats in vision
      b.ais='expand';
      b.ait = calm ? 2.5+Math.random()*3.5 : 1.5+Math.random()*2;
      b._pickExpandTarget(calm);
    } else if(!home&&tl>0){
      // Rarely abort expansion unless cautious
      if(Math.random()<0.008*b.cau){ b.ais='retreat'; b.ait=0.8; }
      else { b.ait=0.4+Math.random()*0.6; }
    } else {
      b.ais='expand'; b.ait=1+Math.random()*1.5;
      b._pickExpandTarget();
    }
  }

  // ── COMPUTE DESIRED ANGLE ──────────────────────────
  let des=b.angle;
  let hunting=false;
  let fleeing=false;

  // ── DANGER ASSESSMENT — am I exposed with a long trail? ──────────────
  // The longer my trail, the more scared I should be of nearby threats
  const myTrailLen=b.trSet.size;
  const inDanger=myTrailLen>4; // exposed outside territory
  const veryExposed=myTrailLen>14; // very long trail = high risk

  // Find closest threat to ME (any entity heading toward my trail base)
  let closestThreatDist=9999, closestThreatAngle=0;
  if(inDanger){
    const all2=[player,...bots];
    for(const o of all2){
      if(o.id===b.id||o.isDead)continue;
      const dx=o.wx-b.wx,dz=o.wz-b.wz;
      const dist=Math.sqrt(dx*dx+dz*dz);
      if(dist<closestThreatDist){closestThreatDist=dist;closestThreatAngle=Math.atan2(dz,dx);}
    }
  }

  // ── FEAR: if exposed and threatened — prioritise retreat sharply ──────
  if(inDanger&&closestThreatDist<b.vis*CL*(veryExposed?1.4:0.9)){
    // Steer away from threat AND toward nearest territory edge
    const fleeAngle=closestThreatAngle+Math.PI;
    // Find nearest own territory cell to retreat into
    const nb=nearestTerCell(b,Math.round(b.wx/CL+SZ/2),Math.round(b.wz/CL+SZ/2));
    if(nb){
      const{wx:hx,wz:hz}=g2w(nb.gx,nb.gy);
      const homeAngle=Math.atan2(hz-b.wz,hx-b.wx);
      // Blend flee + home: more weight on home the longer the trail
      const homeBias=Math.min(0.85,0.4+myTrailLen*0.025);
      des=fleeAngle*(1-homeBias)+homeAngle*homeBias;
    } else {
      des=fleeAngle;
    }
    b.ais='retreat';
    b.ait=veryExposed ? 2.0+Math.random() : 0.8+Math.random()*0.6;
    fleeing=true;
  }

  // ── AGGRESSIVE: tactically hunt by intercepting trails — never head-on ram ───
  if(!fleeing&&b.type==='aggressive'&&!player.isDead){
    if(playerDist<b.vis*CL){
      if(player.trSet.size>2){
        const cutIdx=Math.max(0,Math.floor(player.trail.length*0.15));
        const tgt=player.trail[cutIdx];
        if(tgt){
          const p=g2w(tgt.gx,tgt.gy);
          const headDist=Math.sqrt((player.wx-b.wx)**2+(player.wz-b.wz)**2);
          if(headDist>2.5){
            des=Math.atan2(p.wz-b.wz,p.wx-b.wx);
            hunting=true; b.ais='hunt'; b.ait=0.4;
          } else {
            des=Math.atan2(pdz,pdx)+Math.PI*0.6;
            hunting=true; b.ais='hunt'; b.ait=0.3;
          }
        }
      } else if(player.trSet.size===0){
        hunting=false;
      } else {
        if(playerDist<b.vis*CL*0.5){
          des=Math.atan2(pdz,pdx)+Math.PI*0.5*(Math.random()<0.5?1:-1);
          hunting=true; b.ais='hunt'; b.ait=0.5;
        }
      }
    }
    // Hunt bots with exposed trails — the longer their trail the more attractive the target
    if(!hunting){
      let bestScore=-1, bestDes=null;
      for(const o of bots){
        if(o.id===b.id||o.isDead||o.trSet.size<3)continue;
        const dx=o.wx-b.wx,dz=o.wz-b.wz,dist=Math.sqrt(dx*dx+dz*dz);
        if(dist>b.vis*CL)continue;
        // Score: longer trail + closer = more attractive
        const score=o.trSet.size/Math.max(1,dist);
        if(score>bestScore){
          const cutIdx=Math.max(0,Math.floor(o.trail.length*0.15));
          const tgt=o.trail[cutIdx]||o.trail[0];
          if(tgt){
            const cubeDist=Math.sqrt((o.wx-b.wx)**2+(o.wz-b.wz)**2);
            if(cubeDist>2.0){
              const p=g2w(tgt.gx,tgt.gy);
              bestScore=score;
              bestDes=Math.atan2(p.wz-b.wz,p.wx-b.wx);
            }
          }
        }
      }
      if(bestDes!==null){des=bestDes;hunting=true;b.ait=0.3;}
    }
  }

  // ── NORMAL: flee from nearby threats, opportunistically attack when enemy is very exposed ───
  if(!fleeing&&b.type==='normal'&&!player.isDead&&!hunting){
    if(playerDist<b.vis*CL){
      // Attack only when player trail is long AND we're not ourselves exposed
      if(player.trSet.size>8&&playerDist<b.vis*CL*0.6&&!inDanger){
        const tidx=Math.floor(player.trail.length*0.3);
        const tgt=player.trail[tidx]||player.trail[0];
        if(tgt){const p=g2w(tgt.gx,tgt.gy);des=Math.atan2(p.wz-b.wz,p.wx-b.wx);hunting=true;b.ait=0.5;}
      } else if(playerDist<b.vis*CL*0.55){
        des=Math.atan2(-pdz,-pdx)+(Math.random()-0.5)*0.4;
        b.ais='retreat'; b.ait=1.2;
        fleeing=true;
      }
    }
    // Normal bots also opportunistically strike at very exposed other bots
    if(!hunting&&!fleeing){
      for(const o of bots){
        if(o.id===b.id||o.isDead||o.trSet.size<10)continue; // only very long trails
        const dx=o.wx-b.wx,dz=o.wz-b.wz,dist=Math.sqrt(dx*dx+dz*dz);
        if(dist<b.vis*CL*0.5&&!inDanger){
          const cutIdx=Math.max(0,Math.floor(o.trail.length*0.2));
          const tgt=o.trail[cutIdx]||o.trail[0];
          if(tgt){
            const p=g2w(tgt.gx,tgt.gy);
            des=Math.atan2(p.wz-b.wz,p.wx-b.wx);
            hunting=true; b.ait=0.6;
          }
          break;
        }
      }
    }
  }

  if(!hunting&&!fleeing){
    if(b.ais==='retreat'){
      const{wx:hx,wz:hz}=g2w(b.sgx,b.sgy);
      des=Math.atan2(hz-b.wz,hx-b.wx);
      if(b.trail.length>0){
        const nb=nearestTerCell(b,b.trail[0].gx,b.trail[0].gy);
        if(nb){const p=g2w(nb.gx,nb.gy);des=Math.atan2(p.wz-b.wz,p.wx-b.wx);}
      }
    } else {
      des=Math.atan2(b.twz-b.wz,b.twx-b.wx);
      const tdx=b.twx-b.wx,tdz=b.twz-b.wz;
      if(Math.sqrt(tdx*tdx+tdz*tdz)<1.5){
        b._pickExpandTarget();
        des=Math.atan2(b.twz-b.wz,b.twx-b.wx);
      }
    }
  }

  // ── TRAIL SELF-AVOIDANCE (skip for aggressive while hunting, skip when fleeing) ──
  if((!hunting||b.type!=='aggressive')&&!fleeing){
    const checkLen=Math.min(b.trail.length,8);
    for(let i=b.trail.length-checkLen;i<b.trail.length-2;i++){
      const{gx:tgx,gy:tgy}=b.trail[i];
      const p=g2w(tgx,tgy),dx=p.wx-b.wx,dz=p.wz-b.wz;
      const d=Math.sqrt(dx*dx+dz*dz);
      if(d<3&&d>0.01){
        let av=Math.atan2(dz,dx)+Math.PI;
        let df=av-des;while(df>Math.PI)df-=Math.PI*2;while(df<-Math.PI)df+=Math.PI*2;
        des+=df*0.5*b.cau;
      }
    }
  }

  // ── EDGE AVOIDANCE — soft push well before the water boundary ────
  const edge=(SZ/2-14)*CL;  // 14-cell soft buffer from edge
  if(Math.abs(b.wx)>edge||Math.abs(b.wz)>edge){
    const toC=Math.atan2(-b.wz,-b.wx);
    let df=toC-des;while(df>Math.PI)df-=Math.PI*2;while(df<-Math.PI)df+=Math.PI*2;
    // Proportional push — stronger the closer to edge, but never hard flip
    const edgePush=Math.min(1,(Math.max(Math.abs(b.wx),Math.abs(b.wz))-edge)/((LIM-edge)+0.001));
    des+=df*edgePush*0.55;
  }

  // ── APPLY STEERING ────────────────────────────────
  let df=des-b.angle;
  while(df>Math.PI)df-=Math.PI*2;while(df<-Math.PI)df+=Math.PI*2;
  b.angle+=Math.max(-0.18,Math.min(0.18,df))*dt*60;
}

// Find the nearest territory cell to a given grid position (search radius)
function nearestTerCell(b,tgx,tgy){
  let best=null,bestD=999;
  // Sample up to 30 territory cells
  let sampled=0;
  for(const k of b.ter){
    const[cx,cy]=k.split(',').map(Number);
    const d=Math.abs(cx-tgx)+Math.abs(cy-tgy);
    if(d<bestD){bestD=d;best={gx:cx,gy:cy};}
    if(++sampled>60)break;
  }
  return best;
}

// Attach target picker to bot prototype pattern
function attachBotMethods(b){
  b._pickExpandTarget=function(calm=false){
    // Choose a point just outside territory in a semi-random outward direction
    // Strategy: pick a random border cell of territory, go slightly beyond it
    const terArr=[...b.ter];
    if(terArr.length===0){
      const a=Math.random()*Math.PI*2,d=(6+Math.random()*8)*CL;
      b.twx=b.wx+Math.cos(a)*d; b.twz=b.wz+Math.sin(a)*d; return;
    }
    // Pick random territory cell as anchor
    const anchor=terArr[Math.floor(Math.random()*Math.min(terArr.length,20))];
    const[agx,agy]=anchor.split(',').map(Number);
    const{wx:ax,wz:az}=g2w(agx,agy);
    // Direction: slightly outward from territory centroid, with randomness
    const outAngle=Math.atan2(az-b.wz,ax-b.wx)+(Math.random()-0.5)*Math.PI*0.8;
    const dist=calm ? (10+Math.random()*16)*CL : (5+Math.random()*10)*CL;
    b.twx=ax+Math.cos(outAngle)*dist;
    b.twz=az+Math.sin(outAngle)*dist;
    // Clamp to map
    const lim=(SZ/2-3)*CL;
    b.twx=Math.max(-lim,Math.min(lim,b.twx));
    b.twz=Math.max(-lim,Math.min(lim,b.twz));
  };
}

/* ── POWER-UPS ──────────────────────────────────────── */
// Types: 'speed' = +20% speed 5s, 'shield' = invincible 7s
let powerups=[];
const PU_SPAWN_INTERVAL=18; // seconds between spawns
const PU_MAX=4;
let puTimer=8; // first one appears after 8s

function spawnPowerup(){
  if(powerups.length>=PU_MAX)return;
  const type=Math.random()<0.5?'speed':'shield';
  const cell=randCell();
  const{wx,wz}=g2w(cell.gx,cell.gy);
  const pu={type,wx,wz,gx:cell.gx,gy:cell.gy,mesh:null,ring:null,age:0};
  // Build 3D visual
  const g=new THREE.Group();
  if(type==='speed'){
    // Bright yellow/green diamond core
    const core=new THREE.Mesh(
      new THREE.OctahedronGeometry(0.32),
      new THREE.MeshLambertMaterial({color:0xffee00,emissive:0xddaa00,emissiveIntensity:0.7})
    );
    g.add(core);
    // Spinning ring around it
    const ring=new THREE.Mesh(
      new THREE.TorusGeometry(0.5,0.045,8,32),
      new THREE.MeshLambertMaterial({color:0x00ff88,emissive:0x00cc44,emissiveIntensity:0.8})
    );
    ring.rotation.x=Math.PI/2;
    g.add(ring);
  } else {
    // Shield: blue sphere
    const core=new THREE.Mesh(
      new THREE.SphereGeometry(0.28,12,8),
      new THREE.MeshLambertMaterial({color:0x00aaff,emissive:0x0055cc,emissiveIntensity:0.7})
    );
    g.add(core);
    // Outer translucent shell
    const shell=new THREE.Mesh(
      new THREE.SphereGeometry(0.46,12,8),
      new THREE.MeshLambertMaterial({color:0x44ccff,emissive:0x0099ee,emissiveIntensity:0.5,transparent:true,opacity:0.32})
    );
    g.add(shell);
  }
  g.position.set(wx,0.55,wz);
  scene.add(g);
  pu.mesh=g;
  powerups.push(pu);
}

function updatePowerups(dt){
  puTimer-=dt;
  if(puTimer<=0){puTimer=PU_SPAWN_INTERVAL+(Math.random()*6-3);spawnPowerup();}

  for(let i=powerups.length-1;i>=0;i--){
    const pu=powerups[i];
    pu.age+=dt;
    // Float + spin animation
    if(pu.mesh){
      pu.mesh.position.y=0.55+Math.sin(pu.age*2.5)*0.12;
      pu.mesh.rotation.y+=0.04;
    }
    // Check player pickup
    if(!player.isDead){
      const dx=player.wx-pu.wx,dz=player.wz-pu.wz;
      if(Math.sqrt(dx*dx+dz*dz)<0.8){
        collectPowerup(player,pu);
        pu.mesh.traverse(c=>{if(c.isMesh){if(c.geometry)c.geometry.dispose();if(c.material)c.material.dispose();}});
        scene.remove(pu.mesh);
        powerups.splice(i,1);
        continue;
      }
    }
    // Check bot pickup
    for(const b of bots){
      if(b.isDead)continue;
      const dx=b.wx-pu.wx,dz=b.wz-pu.wz;
      if(Math.sqrt(dx*dx+dz*dz)<0.8){
        collectPowerup(b,pu);
        pu.mesh.traverse(c=>{if(c.isMesh){if(c.geometry)c.geometry.dispose();if(c.material)c.material.dispose();}});
        scene.remove(pu.mesh);
        powerups.splice(i,1);
        break;
      }
    }
    // Expire after 30s
    if(pu.age>30){
      pu.mesh.traverse(c=>{if(c.isMesh){if(c.geometry)c.geometry.dispose();if(c.material)c.material.dispose();}});
      scene.remove(pu.mesh);powerups.splice(i,1);
    }
  }

  // Tick active effects on player
  if(player.speedBoost>0){
    player.speedBoost-=dt;
    if(player.speedBoost<=0){player.spd=SPD;player.speedBoost=0;showBoostNotif('⚡','Speed boost ended','#ffee00',1500);}
  }
  if(player.shield>0){
    player.shield-=dt;
    if(player.shield<=0){
      player.shield=0;
      if(player.shieldMesh){
        player.shieldMesh.traverse(c=>{if(c.isMesh){if(c.geometry)c.geometry.dispose();if(c.material)c.material.dispose();}});
        scene.remove(player.shieldMesh);player.shieldMesh=null;
      }
      showBoostNotif('🛡️','Shield gone','#44ccff',1500);
    } else if(player.shieldMesh){
      player.shieldMesh.position.set(player.wx,0.35,player.wz);
      // Pulse scale
      const pulse=1+0.06*Math.sin(Date.now()*0.006);
      player.shieldMesh.scale.setScalar(pulse);
      // Flash warning when < 2s left
      if(player.shield<2){
        const flicker=Math.sin(Date.now()*0.02)>0;
        player.shieldMesh.visible=flicker;
      }
    }
  }
  // Bots too (simplified)
  for(const b of bots){
    if(b.speedBoost>0){b.speedBoost-=dt;if(b.speedBoost<=0){b.spd=b._basespd||SPD;b.speedBoost=0;}}
    if(b.shield>0){
      b.shield-=dt;
      if(b.shield<=0){b.shield=0;if(b.shieldMesh){
        b.shieldMesh.traverse(c=>{if(c.isMesh){if(c.geometry)c.geometry.dispose();if(c.material)c.material.dispose();}});
        scene.remove(b.shieldMesh);b.shieldMesh=null;
      }}
      else if(b.shieldMesh){
        b.shieldMesh.position.set(b.wx,0.35,b.wz);
        b.shieldMesh.scale.setScalar(1+0.06*Math.sin(Date.now()*0.006));
      }
    }
  }
}

function collectPowerup(e,pu){
  if(pu.type==='speed'){
    e._basespd=e._basespd||e.spd;
    e.spd=e._basespd*1.2;
    e.speedBoost=5;
    if(e.id===0){showBoostNotif('⚡','Speed Boost! 5s','#ffee00');snd('ek');vib([40,20,40]);}
  } else {
    e.shield=7;
    if(e.shieldMesh) scene.remove(e.shieldMesh);
    // Beautiful shield: group with inner solid ring + outer pulsing shell
    const sg=new THREE.Group();
    // Inner glow sphere — solid-ish, deep blue
    const inner=new THREE.Mesh(
      new THREE.SphereGeometry(0.68,20,14),
      new THREE.MeshLambertMaterial({color:0x00aaff,emissive:0x0066cc,emissiveIntensity:0.8,transparent:true,opacity:0.18,depthWrite:false})
    );
    sg.add(inner);
    // Outer shell — lighter, larger, more transparent
    const outer=new THREE.Mesh(
      new THREE.SphereGeometry(0.88,20,14),
      new THREE.MeshLambertMaterial({color:0x55ddff,emissive:0x0099dd,emissiveIntensity:0.6,transparent:true,opacity:0.10,depthWrite:false})
    );
    sg.add(outer);
    // Equatorial ring
    const ring=new THREE.Mesh(
      new THREE.TorusGeometry(0.78,0.04,8,36),
      new THREE.MeshLambertMaterial({color:0x88eeff,emissive:0x44ccff,emissiveIntensity:1.0,transparent:true,opacity:0.7,depthWrite:false})
    );
    ring.rotation.x=Math.PI/2;
    sg.add(ring);
    sg.position.set(e.wx,0.35,e.wz);
    sg._inner=inner;sg._outer=outer;
    scene.add(sg);e.shieldMesh=sg;
    if(e.id===0){showBoostNotif('🛡️','Shield active! 7s','#44ccff');snd('capture');vib([60,20,60]);}
  }
}

function clearPowerups(){
  for(const pu of powerups) if(pu.mesh) scene.remove(pu.mesh);
  powerups=[];puTimer=8;
  // clear active effects
  if(player){
    player.speedBoost=0;player.shield=0;
    if(player.shieldMesh){scene.remove(player.shieldMesh);player.shieldMesh=null;}
  }
}

/* ── TERRITORY REWARD ───────────────────────────────── */
function terPct(e){const t=shape.reduce((a,v)=>a+v,0);return t>0?sharedTer.size/t*100:0;}
function chkTerReward(){
  const p=terPct(player),c=Math.floor(p);
  if(c>G.lastPct){const r=offlinePct((c-G.lastPct)*0.4);if(r>0){G.kspt+=r;awardKSPT(r,0,0);}G.lastPct=c;}
  // Win condition
  if(p>=97.5) showWin();
}

function showWin(){
  if(!G.running)return; G.running=false;
  snd('ek'); vib([100,50,100,50,300]);
  const winR=offlinePct(20); G.kspt+=winR; awardKSPT(winR,0,0);
  const winEK=3;
  for(let i=0;i<winEK;i++) awardEK(1,0,0);
  document.getElementById('winKSPT').textContent=(G.kspt).toFixed(2);
  document.getElementById('winEK').textContent=winEK;
  document.getElementById('winScreen').style.display='block';
}

/* ── GAME OVER ──────────────────────────────────────── */
function doGameOver(){
  if(!G.running)return;G.running=false;
  snd('die');vib([100,50,100,50,200]);
  const sec=Math.floor((Date.now()-G.startTime)/1000);
  const pct=terPct(player).toFixed(1);
  awardKSPT(G.kspt,0,0);
  document.getElementById('fTer').textContent=pct+'%';
  document.getElementById('fKill').textContent=player.kills;
  document.getElementById('fTime').textContent=sec+'s';
  const all=[player,...bots.filter(b=>!b.isDead)];all.sort((a,b)=>terPct(b)-terPct(a));
  document.getElementById('fRank').textContent='#'+(all.findIndex(e=>e.id===0)+1);
  document.getElementById('eKSPT').textContent=G.kspt.toFixed(2);
  document.getElementById('eEK').textContent=G.ek;
  // Send best territory % as game record
  try{(window.parent||window.top).postMessage({type:'kspt_game_record',game:'paper',value:parseFloat(pct)},'*');}catch(e){}
  document.getElementById('gos').style.display='block';
}

/* ── MINIMAP ────────────────────────────────────────── */
const mmcvs=document.getElementById('mm'),mmx=mmcvs.getContext('2d');
// Off-screen canvas caches the territory layer — redrawn only on capture
const _mmOff=document.createElement('canvas');_mmOff.width=110;_mmOff.height=110;
const _mmOffCtx=_mmOff.getContext('2d');
let _mmTerDirty=true;

function invalidateMinimapTer(){_mmTerDirty=true;}

function _redrawMinimapTer(){
  const W=110,H=110,sx=W/SZ,sy=H/SZ;
  _mmOffCtx.clearRect(0,0,W,H);
  // Dark background for uncaptured cells
  _mmOffCtx.fillStyle='#0a0a0a';_mmOffCtx.fillRect(0,0,W,H);
  // Draw captured cells using their photo pixel color
  for(let gy=0;gy<SZ;gy++)for(let gx=0;gx<SZ;gx++){
    if(ownerMap[mi(gx,gy)]<0)continue; // uncaptured = dark
    const packed=_cellColor[mi(gx,gy)];
    const r=(packed>>16)&0xff, g2=(packed>>8)&0xff, b=packed&0xff;
    _mmOffCtx.fillStyle=`rgb(${r},${g2},${b})`;
    _mmOffCtx.fillRect(gx*sx,gy*sy,sx+0.5,sy+0.5);
  }
  _mmTerDirty=false;
}

function drawMinimap(){
  const W=110,H=110,sx=W/SZ,sy=H/SZ;
  if(_mmTerDirty) _redrawMinimapTer();
  mmx.drawImage(_mmOff,0,0);
  // Entity dots on top
  for(const e of[player,...bots]){
    if(e.isDead)continue;const{gx,gy}=w2g(e.wx,e.wz);
    mmx.beginPath();mmx.arc(gx*sx+sx/2,gy*sy+sy/2,e.id===0?3.5:2.2,0,Math.PI*2);
    mmx.fillStyle=e.css;mmx.fill();
    if(e.id===0){mmx.strokeStyle='#fff';mmx.lineWidth=1.2;mmx.stroke();}
  }
  mmx.strokeStyle='rgba(0,188,212,0.35)';mmx.lineWidth=1;mmx.strokeRect(0.5,0.5,W-1,H-1);
}

/* ── THREE RENDER ───────────────────────────────────── */
let camTx=0,camTz=0,lookTx=0,lookTz=0;
function render3(dt){
  if(player&&!player.isDead){camTx=player.wx;camTz=player.wz;}
  // dt-scaled lerp: same feel at any FPS
  const lp=1-Math.pow(0.04,dt);  // ~0.18 at 60fps, ~0.35 at 120fps — always smooth
  cam.position.x+=(camTx-cam.position.x)*lp;
  cam.position.z+=(camTz+14-cam.position.z)*lp;
  cam.position.y=16;
  lookTx+=(camTx-lookTx)*lp;
  lookTz+=(camTz-lookTz)*lp;
  cam.lookAt(lookTx,0,lookTz);
  rndr.render(scene,cam);
}

/* ── GAME LOOP ──────────────────────────────────────── */
let _lts=0;
function loop(ts){
  const dt=Math.min((ts-_lts)/1000,0.05);_lts=ts;
  if(G.running&&!G.paused){
    if(!player.isDead){
      // Player always moves — joystick/keys only change direction
      if(joyActive){
        let d=joyAngle-player.angle;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;
        const turnRate=0.16*(1-Math.abs(d)/Math.PI*0.3)*dt*60;
        player.angle+=Math.max(-turnRate,Math.min(turnRate,d));
      }
      stepEnt(player,dt);
    }
    for(const b of bots){if(!b.isDead){updateBot(b,dt);stepEnt(b,dt);}}
    checkCollisions();
    updatePowerups(dt);
    for(const b of bots){
      if(b.isDead){b._dt+=dt;if(b._dt>5){
        b._dt=0;b.isDead=false;b.kills=0;
        // Respawn at new random location
        const s=randCell();const{wx,wz}=g2w(s.gx,s.gy);
        b.wx=wx;b.wz=wz;b.sgx=s.gx;b.sgy=s.gy;b.lgx=s.gx;b.lgy=s.gy;
        b.angle=Math.random()*Math.PI*2;
        b.ais='expand';b.ait=0;
        spawnCube(b);spawnLine(b);
        giveZone(b,3);
        if(!b._pickExpandTarget)attachBotMethods(b);
        b._pickExpandTarget();
      }}
    }
    uiT+=dt;lbT+=dt;
    if(uiT>0.4){uiT=0;updateHUD();chkTerReward();}
    if(lbT>1.2){lbT=0;updateLB();}
  }
  render3(dt);drawMinimap();updateCrowns();updateFloatTexts(dt);
  G.animId=requestAnimationFrame(loop);
}

/* ── INIT ───────────────────────────────────────────── */
function _doInitGame(){
  if(G.animId){cancelAnimationFrame(G.animId);G.animId=null;}
  const keep=new Set([aml,drl,fill,ptl,gnd]);
  scene.children.slice().forEach(o=>{if(!keep.has(o))scene.remove(o);});
  tileMesh.fill(null);neutMeshes=[];neutMeshMap.fill(null);
  // Dispose instanced meshes from previous run
  if(_tileInst){_tileInst.geometry.dispose();_tileInst.material.dispose();scene.remove(_tileInst);_tileInst=null;}
  if(_neutInst){_neutInst.geometry.dispose();_neutInst.material.dispose();scene.remove(_neutInst);_neutInst=null;}
  Object.keys(matCache).forEach(k=>{matCache[k].dispose&&matCache[k].dispose();delete matCache[k];});
  Object.keys(entColorMap).forEach(k=>delete entColorMap[k]);
  ownerMap.fill(-1);
  sharedTer=new Set(); // reset shared territory
  clearPowerups();

  genMap();buildNeutral();buildWalls();

  G.running=true;G.paused=false;G.startTime=Date.now();G.kspt=0;G.ek=0;G.lastPct=0;
  joyActive=false;joyAngle=0;
  document.getElementById('gos').style.display='none';
  document.getElementById('winScreen').style.display='none';
  document.getElementById('pauseBtn').textContent='Pause';

  // Pick player color randomly, then assign bots the remaining colors in order
  G.pci=Math.floor(Math.random()*CI.length);
  const availCI=CI.map((_,i)=>i).filter(i=>i!==G.pci);
  // shuffle availCI
  for(let i=availCI.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[availCI[i],availCI[j]]=[availCI[j],availCI[i]];}
  const ps=randCell();
  player=mkEnt(0,'Player 1 (You)',G.pci,ps.gx,ps.gy);
  spawnCube(player);spawnLine(player);giveZone(player,3);

  bots=[];
  for(let i=0;i<N_BOTS;i++){
    const bs=randCell(ps.gx,ps.gy,12);
    const ci=availCI[i%availCI.length];
    const b=mkEnt(i+1,BN[i],ci,bs.gx,bs.gy);
    // 30% aggressive, 70% normal
    const isAggressive = i < Math.round(N_BOTS*0.3);
    if(isAggressive){
      b.agg  = 0.75 + Math.random()*0.25;
      b.cau  = 0.1  + Math.random()*0.2;
      b.vis  = 14   + Math.random()*8;
      b.spd  = SPD  * (1.05 + Math.random()*0.2);
      b.type = 'aggressive';
    } else {
      b.agg  = 0.35 + Math.random()*0.4;
      b.cau  = 0.4  + Math.random()*0.35;
      b.vis  = 8    + Math.random()*8;
      b.spd  = SPD  * (0.92 + Math.random()*0.18);
      b.type = 'normal';
    }
    attachBotMethods(b);
    b._pickExpandTarget();
    spawnCube(b);spawnLine(b);
    // Graduated start territories: bot 0 = ~7%, bots 1-4 = decreasing sizes, rest small
    const startR=[14,10,8,6,5,4,4,4,4][i]||4;
    if(i===0){
      giveZoneFill(b,startR);
      b.isCrown=true;
      spawnCrown(b);
    } else {
      giveZoneFill(b,startR);
    }
    bots.push(b);
  }

  updateHUD();updateLB();
  _lts=performance.now();G.animId=requestAnimationFrame(loop);
}

function initGame(){
  // Load photo pixel colors once, then start game
  if(_photoReady){
    _doInitGame();
  } else {
    _loadPhotoColors(()=>{ _doInitGame(); });
  }
}

/* ── JOYSTICK ───────────────────────────────────────── */
function setupJoystick(){
  const joy=document.getElementById('joyArea'),knob=document.getElementById('joyKnob');
  const maxR=45;let active=false,sx=0,sy=0;
  function reset(){knob.style.transition='transform 0.15s ease';knob.style.transform='translate(-50%,-50%)';setTimeout(()=>knob.style.transition='',150);joyActive=false;}
  function move(cx,cy){let dx=cx-sx,dy=cy-sy;const d=Math.hypot(dx,dy);if(d>maxR){dx=dx/d*maxR;dy=dy/d*maxR;}knob.style.transform=`translate(-50%,-50%) translate(${dx}px,${dy}px)`;joyAngle=Math.atan2(dy,dx);joyActive=d/maxR>0.1;}
  joy.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];sx=t.clientX;sy=t.clientY;active=true;markUI();});
  joy.addEventListener('touchmove',e=>{if(!active)return;e.preventDefault();move(e.touches[0].clientX,e.touches[0].clientY);});
  joy.addEventListener('touchend',()=>{active=false;reset();});
  joy.addEventListener('mousedown',e=>{sx=e.clientX;sy=e.clientY;active=true;markUI();});
  window.addEventListener('mousemove',e=>{if(!active)return;move(e.clientX,e.clientY);});
  window.addEventListener('mouseup',()=>{if(!active)return;active=false;reset();});
  // ── CANVAS TOUCH: full Paper.io style steering ──────────────────
  // Tap = lock direction toward tap point from cube screen position
  // Hold+drag = steer continuously, direction updates as finger moves
  // Release = keep last direction (don't stop)
  let cvsTouchId=null, cvsTouchActive=false;

  function canvasTouchAngle(clientX, clientY){
    // Direction from player cube screen pos toward finger
    const rect=cvs.getBoundingClientRect();
    // Project player 3D pos to screen
    if(!player||player.isDead) return null;
    const v=new THREE.Vector3(player.wx,1.0,player.wz);
    v.project(cam);
    const cubeScreenX = rect.left + (v.x*0.5+0.5)*rect.width;
    const cubeScreenY = rect.top  + (-v.y*0.5+0.5)*rect.height;
    const dx=clientX-cubeScreenX, dy=clientY-cubeScreenY;
    if(Math.hypot(dx,dy)<6) return null; // too close to cube, ignore
    return Math.atan2(dy,dx);
  }

  cvs.addEventListener('touchstart',e=>{
    e.preventDefault();
    markUI();
    const t=e.changedTouches[0];
    cvsTouchId=t.identifier;
    cvsTouchActive=true;
    const ang=canvasTouchAngle(t.clientX,t.clientY);
    if(ang!==null){joyAngle=ang;joyActive=true;}
  },{passive:false});

  cvs.addEventListener('touchmove',e=>{
    e.preventDefault();
    for(const t of e.changedTouches){
      if(t.identifier!==cvsTouchId) continue;
      const ang=canvasTouchAngle(t.clientX,t.clientY);
      if(ang!==null){joyAngle=ang;joyActive=true;}
    }
  },{passive:false});

  cvs.addEventListener('touchend',e=>{
    e.preventDefault();
    for(const t of e.changedTouches){
      if(t.identifier===cvsTouchId){cvsTouchId=null;cvsTouchActive=false;}
    }
    // Keep joyActive=true and last joyAngle — player keeps moving in last direction
  },{passive:false});

  cvs.addEventListener('touchcancel',e=>{
    e.preventDefault();
    cvsTouchId=null;cvsTouchActive=false;
  },{passive:false});
  cvs.addEventListener('mousemove',e=>{if(!G.running||G.paused)return;const r=cvs.getBoundingClientRect();joyAngle=Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2));joyActive=true;markUI();});
  cvs.addEventListener('mouseleave',()=>{joyActive=false;});
}

/* ── KEYBOARD ───────────────────────────────────────── */
document.addEventListener('keydown',e=>{
  markUI();if(!G.running)return;
  switch(e.key){
    case'ArrowLeft':case'a':case'A':joyAngle=Math.PI;joyActive=true;break;
    case'ArrowRight':case'd':case'D':joyAngle=0;joyActive=true;break;
    case'ArrowUp':case'w':case'W':joyAngle=-Math.PI/2;joyActive=true;break;
    case'ArrowDown':case's':case'S':joyAngle=Math.PI/2;joyActive=true;break;
    case'p':case'P':G.paused=!G.paused;document.getElementById('pauseBtn').textContent=G.paused?'Resume':'Pause';break;
    case'r':case'R':initGame();break;
  }
});
document.addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','a','d','w','s','A','D','W','S'].includes(e.key))joyActive=false;});

/* ── BUTTONS ────────────────────────────────────────── */
document.getElementById('pauseBtn').addEventListener('click',function(){
  if(!G.running)return;markUI();
  G.paused=!G.paused;
  this.textContent=G.paused?'Resume':'Pause';
  if(!G.paused) _lts=performance.now();
});
document.getElementById('restartBtn').addEventListener('click',()=>{
  markUI();
  try{(window.parent||window.top).postMessage({type:'kspt_new_round'},'*');}catch(e){}
  document.getElementById('gos').style.display='none';document.getElementById('winScreen').style.display='none';initGame();
});
document.getElementById('exitBtn').addEventListener('click',()=>{markUI();G.running=false;exitGame();});
document.getElementById('playAgainBtn').addEventListener('click',()=>{
  markUI();
  try{(window.parent||window.top).postMessage({type:'kspt_new_round'},'*');}catch(e){}
  document.getElementById('gos').style.display='none';initGame();
});
document.getElementById('exitMenuBtn').addEventListener('click',()=>{markUI();G.running=false;exitGame();});
document.getElementById('winPlayAgainBtn').addEventListener('click',()=>{
  markUI();
  try{(window.parent||window.top).postMessage({type:'kspt_new_round'},'*');}catch(e){}
  document.getElementById('winScreen').style.display='none';initGame();
});
document.getElementById('winExitBtn').addEventListener('click',()=>{markUI();G.running=false;exitGame();});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&G.running){G.paused=true;document.getElementById('pauseBtn').textContent='Resume';}
  else if(!document.hidden&&G.paused){_lts=performance.now();}
});
document.addEventListener('touchmove',e=>{const el=e.target;if(el.closest&&(el.closest('.joystick-bg')||el.closest('canvas')))return;e.preventDefault();},{passive:false});
window.addEventListener('blur',()=>{joyActive=false;});

/* ── MINIMAP FULLSCREEN EXPAND ──────────────────────── */
(function(){
  const wrap=document.querySelector('.minimap-wrap');
  const overlay=document.getElementById('mm-overlay');
  const bigCvs=document.getElementById('mm-overlay-canvas');
  const bigCtx=bigCvs.getContext('2d');

  function drawBig(){
    const W=520,H=520,sx=W/SZ,sy=H/SZ;
    bigCtx.fillStyle='#0a0a0a';bigCtx.fillRect(0,0,W,H);
    // Draw photo pixels for captured cells
    for(let gy=0;gy<SZ;gy++)for(let gx=0;gx<SZ;gx++){
      if(ownerMap[mi(gx,gy)]<0)continue;
      const packed=_cellColor[mi(gx,gy)];
      const r=(packed>>16)&0xff,g2=(packed>>8)&0xff,b=packed&0xff;
      bigCtx.fillStyle=`rgb(${r},${g2},${b})`;
      bigCtx.fillRect(gx*sx,gy*sy,sx+0.5,sy+0.5);
    }
    // Entity dots
    if(player&&!player.isDead){
      const{gx,gy}=w2g(player.wx,player.wz);
      bigCtx.beginPath();bigCtx.arc(gx*sx+sx/2,gy*sy+sy/2,5,0,Math.PI*2);
      bigCtx.fillStyle=player.css;bigCtx.fill();
      bigCtx.strokeStyle='#fff';bigCtx.lineWidth=1.5;bigCtx.stroke();
    }
    if(bots)for(const b of bots){
      if(b.isDead)continue;
      const{gx,gy}=w2g(b.wx,b.wz);
      bigCtx.beginPath();bigCtx.arc(gx*sx+sx/2,gy*sy+sy/2,3.5,0,Math.PI*2);
      bigCtx.fillStyle=b.css;bigCtx.fill();
    }
    // Border
    bigCtx.strokeStyle='rgba(0,188,212,0.5)';bigCtx.lineWidth=2;bigCtx.strokeRect(1,1,W-2,H-2);
    // Progress label
    const total=SZ*SZ,captured=sharedTer?sharedTer.size:0;
    const pct=(captured/total*100).toFixed(1);
    bigCtx.fillStyle='rgba(0,0,0,0.55)';bigCtx.fillRect(0,W-24,W,24);
    bigCtx.fillStyle='#00e676';bigCtx.font='bold 14px Arial';bigCtx.textAlign='center';
    bigCtx.fillText(`Раскрыто: ${pct}%`,W/2,W-7);
  }

  function open(){
    markUI();
    drawBig();
    overlay.classList.add('show');
  }
  function close(){overlay.classList.remove('show');}

  wrap.addEventListener('click',e=>{e.stopPropagation();open();});
  wrap.addEventListener('touchend',e=>{e.preventDefault();e.stopPropagation();open();},{passive:false});
  overlay.addEventListener('click',close);
  overlay.addEventListener('touchend',e=>{e.preventDefault();close();},{passive:false});
})();
function fitUI(){
  const cont=document.getElementById('gc'),hdr=document.querySelector('.game-header');
  const hh=hdr?hdr.getBoundingClientRect().height:0;
  const sc=Math.min(window.innerWidth/360,(window.innerHeight-hh-12)/560);
  const cw=Math.round(360*sc), ch=Math.round(360*sc);
  cvs.style.width=cw+'px';cvs.style.height=ch+'px';
  rndr.setSize(360,360,false);cam.aspect=1;cam.updateProjectionMatrix();
  const joy=document.getElementById('joyArea');if(joy){const sz=Math.max(50,Math.round(150*sc));joy.style.width=sz+'px';joy.style.height=sz+'px';joy.style.margin='8px auto';}
  if(cont){cont.style.width=Math.round(360*sc)+'px';cont.style.margin='0 auto';cont.classList.add('kspt-safe-bottom');}
}
window.addEventListener('resize',fitUI);
window.addEventListener('orientationchange',()=>setTimeout(fitUI,120));

/* ── START ──────────────────────────────────────────── */
window.addEventListener('load',()=>{setTimeout(fitUI,80);setupJoystick();initGame();});
</script>
