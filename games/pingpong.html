/* ===== helper: проверка билетов (localStorage) ===== */
function getLocalTicketCount() {
  try {
    const raw = localStorage.getItem('kspt_tickets');
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (data && typeof data.current === 'number') return data.current;
    // иногда структура была { current: N } или { current: "N" }
    if (data && data.current != null) return Number(data.current) || 0;
  } catch (e) {
    // если iframe cross-origin — не можем прочитать, вернём null (не мешаем)
    return null;
  }
  return null;
}

function ensureHasTicketOrWarn() {
  const c = getLocalTicketCount();
  if (c === null) {
    // не можем проверить — разрешаем рестарт (родитель может контролировать)
    return true;
  }
  if (c <= 0) {
    // если есть postMessage handler — сообщим родителю
    try { (window.parent || window.top).postMessage({ type: 'kspt_no_tickets' }, '*'); } catch(e){}
    // локальное сообщение / тост
    try { showToast && showToast("Not enough tickets!"); } catch(e){ alert("Not enough tickets!"); }
    return false;
  }
  return true;
}

        // ================= SAFE HOST HELPERS =================
function isSameOrigin(win) {
  try { void win.location.href; return true; } catch (e) { return false; }
}

function safeAwardGameReward(amount, x = 0, y = 0) {
  try {
    if (window.top && window.top !== window && isSameOrigin(window.top) && typeof window.top.awardGameReward === 'function') {
      window.top.awardGameReward(Number(amount) || 0, x, y);
      return;
    }
  } catch (e) { console.warn('safeAwardGameReward direct call failed', e); }

  try {
    (window.parent || window.top).postMessage({ type: 'kspt_award_reward', reward: Number(amount) || 0, x, y }, '*');
    return;
  } catch (e) { console.warn('safeAwardGameReward postMessage failed', e); }

  console.log('Local reward fallback', amount, x, y);
}

function safeAwardGameEK(amount, x = 0, y = 0) {
  try {
    if (window.top && window.top !== window && isSameOrigin(window.top) && typeof window.top.awardGameEK === 'function') {
      window.top.awardGameEK(Number(amount) || 0, x, y); return;
    }
  } catch(e) {}
  try {
    (window.parent || window.top).postMessage({ type: 'ek_award', amount: Number(amount)||0, x, y }, '*'); return;
  } catch(e){}
  console.log('Local EK fallback', amount, x, y);
}

function safeConsumeTicket() {
  try {
    if (window.top && window.top !== window && isSameOrigin(window.top) && typeof window.top.consumeTicketForCurrentGame === 'function') {
      window.top.consumeTicketForCurrentGame();
      return;
    }
  } catch (e) { console.warn('safeConsumeTicket direct call failed', e); }

  try { (window.parent || window.top).postMessage({ type: 'kspt_consume_ticket' }, '*'); return; } catch (e) { console.warn('consumeTicket postMessage failed', e); }

  console.log('consumeTicket fallback (no parent handler)');
}

// Запрос выхода/закрытия игры к хосту
function safeExitGame() {
  try {
    if (window.top && window.top !== window && isSameOrigin(window.top) && typeof window.top.exitGame === 'function') {
      window.top.exitGame();
      return;
    }
  } catch (e) { console.warn('safeExitGame direct call failed', e); }

  try { (window.parent || window.top).postMessage({ type: 'kspt_exit_game' }, '*'); return; } catch (e) { console.warn('safeExitGame postMessage failed', e); }

  console.log('exitGame fallback (no parent handler)');
}

// внутри игры (snake.html / pingpong.html)
window.__kspt_hourly = window.__kspt_hourly || 0;

window.addEventListener('message', (ev) => {
  const msg = ev.data;
  if (!msg || typeof msg !== 'object') return;

  if (msg.type === 'kspt_init' || msg.type === 'kspt_hourly_update') {
    const h = Number(msg.hourly) || 0;
    window.__kspt_hourly = h;
  }

  if (msg.type === 'kspt_no_tickets') {
  gameRunning = false;
  gamePaused = true;

  // показываем Game Over экран
  const gos = document.getElementById('gameOverScreen');
  if (gos) gos.style.display = 'block';

  alert("Not enough tickets!");
}

  if (msg.type === 'kspt_parent_set_game_over' && msg.blockButtons) {
    document.getElementById('pauseBtn')?.setAttribute('disabled','true');
    document.getElementById('restartBtn')?.setAttribute('disabled','true');
    document.getElementById('exitBtn')?.setAttribute('disabled','true');
  }
});

// обновим safeGetOfflinePercent внутри игры (fallback на received hourly)
function safeGetOfflinePercent(percent) {
  try {
    // сначала попробовать верхний HOST (same-origin)
    if (typeof HOST !== 'undefined' && HOST !== window && typeof HOST.getOfflinePercent === 'function') {
      return Number(HOST.getOfflinePercent(percent)) || 0;
    }
  } catch (e) { /* ignore */ }

  // fallback: если получили hourly через postMessage
  if (typeof window.__kspt_hourly === 'number') {
    return Math.round((window.__kspt_hourly * (percent/100)) * 100) / 100;
  }

  // последний fallback: читать localStorage (если в iframe доступен)
  try {
    const raw = localStorage.getItem('kspt_data') || localStorage.getItem('d') || null;
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed.offlineHourly === 'number') {
        return Math.round((parsed.offlineHourly * (percent/100)) * 100) / 100;
      }
    }
  } catch(e) {}

  return 0;
}

// Управление пальцем по канвасу — тап (верх/низ) + перетаскивание
(function(){
    let activeTouch = null;
    let lastTouchY = null;
    let dragMode = false;

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const t = e.changedTouches[0];
        activeTouch = t.identifier;
        lastTouchY = t.clientY;
        dragMode = false;
        // По умолчанию — верх/низ
        const rect = canvas.getBoundingClientRect();
        const touchY = t.clientY - rect.top;
        joystickDirection = touchY < rect.height / 2 ? -1 : 1;
    }, {passive: false});

    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        for(const t of e.changedTouches) {
            if(t.identifier !== activeTouch) continue;
            const dy = t.clientY - lastTouchY;
            if(Math.abs(dy) > 5) dragMode = true;
            if(dragMode) {
                // Перетаскивание — двигаем платформу напрямую
                const rect = canvas.getBoundingClientRect();
                const scaleY = canvas.height / rect.height;
                const newY = (t.clientY - rect.top) * scaleY - playerPaddle.height / 2;
                playerPaddle.y = Math.max(0, Math.min(canvas.height - playerPaddle.height, newY));
                joystickDirection = 0;
            } else {
                const rect = canvas.getBoundingClientRect();
                const touchY = t.clientY - rect.top;
                joystickDirection = touchY < rect.height / 2 ? -1 : 1;
            }
            lastTouchY = t.clientY;
        }
    }, {passive: false});

    canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        for(const t of e.changedTouches) {
            if(t.identifier === activeTouch) {
                activeTouch = null;
                lastTouchY = null;
                dragMode = false;
                joystickDirection = 0;
            }
        }
    }, {passive: false});
})();

document.addEventListener('pointerup', ()=>{
  joystickDirection = 0;
});

                const _hitMult = window.__ppOnlineMode ? 0.7 : 1.0;
                const reward = safeGetOfflinePercent(0.8 * _hitMult);
                earnedKSPT += reward;
                spawnFloatingText(`+${reward.toFixed(2)}`, canvas.width / 2, canvas.height / 2, '#00e5ff');
                safeAwardGameReward(reward, ball.x, ball.y);
                
                // EK disabled in online mode
                if (!window.__ppOnlineMode && Math.random() < 0.013) { // 1.3%
                  sessionEK++;
                  safeAwardGameEK(1, ball.x, ball.y);
                  spawnFloatingText('+1 EK', ball.x - 10, ball.y - 10, '#ffd54f');
                }
                
                playSound('apple');
                gameVibrate([30]);
            }        
            // Ball collision with AI paddle
            if (ball.x + ball.radius > aiPaddle.x &&
                ball.x - ball.radius < aiPaddle.x + aiPaddle.width &&
                ball.y > aiPaddle.y &&
                ball.y < aiPaddle.y + aiPaddle.height) {
                
                const hitPos = (ball.y - (aiPaddle.y + aiPaddle.height / 2)) / (aiPaddle.height / 2);
                
                ball.speedX = -Math.abs(ball.speedX) * 1.05;
                ball.speedY = hitPos * 5;
                
                ball.x = aiPaddle.x - ball.radius;
                
                ballHits++;
                if (ballHits % 5 === 0) {
                    gameSpeed = Math.min(gameSpeed + 0.03, 2.0);
                    speedEl.textContent = Math.round(gameSpeed * 100) + '%';
                }
                
                playSound('apple');
                gameVibrate([30]);
            }
            
            // Ball out of bounds (scoring)
            if (ball.x - ball.radius < 0) {
                // AI scores
                aiScore++;
                aiScoreEl.textContent = aiScore;
                playSound('ai_goal');
                gameVibrate([100, 50, 100]);
                
                const _ppWin = window.__ppOnlineWinScore || 5;
                if (aiScore >= _ppWin) {
                    endGame();
                } else {
                    resetBall();
                }
            } else if (ball.x + ball.radius > canvas.width) {
                // Player scores
                playerScore++;
                playerScoreEl.textContent = playerScore;
                
                // Award KSPT for scoring (30% less in online mode)
                const _ppScoreMult = window.__ppOnlineMode ? 0.7 : 1.0;
                const reward = safeGetOfflinePercent(5.0 * _ppScoreMult);
                earnedKSPT += reward;
                spawnFloatingText(`+${reward.toFixed(2)}`, canvas.width / 2, canvas.height / 2, '#00e5ff');
                safeAwardGameReward(reward, ball.x, ball.y);
                playSound('player_goal');
                gameVibrate([200, 100, 200]);
                
                const _ppWin2 = window.__ppOnlineWinScore || 100;
                if (playerScore >= _ppWin2) {
                    endGame();
                } else {
                    resetBall();
                }
            }
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw center line
            ctx.strokeStyle = '#444';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Draw paddles
            ctx.fillStyle = '#00bcd4';
            ctx.fillRect(playerPaddle.x, playerPaddle.y, playerPaddle.width, playerPaddle.height);
            
            ctx.fillStyle = '#ff4081';
            ctx.fillRect(aiPaddle.x, aiPaddle.y, aiPaddle.width, aiPaddle.height);

            // Online mode labels
            if (window.__ppOnlineMode) {
                ctx.font = 'bold 10px Arial';
                ctx.fillStyle = '#00bcd4';
                ctx.textAlign = 'left';
                ctx.fillText(window.__ppIsLeftSide ? 'You' : 'Opponent', playerPaddle.x + 12, playerPaddle.y - 4);
                ctx.fillStyle = '#ff4081';
                ctx.textAlign = 'right';
                ctx.fillText(window.__ppIsLeftSide ? 'Opponent' : 'You', aiPaddle.x - 2, aiPaddle.y - 4);
            }
            
            // Draw ball
            ctx.fillStyle = ball.color;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw score markers
            ctx.fillStyle = '#00bcd4';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(playerScore.toString(), canvas.width / 4, 30);
            
            ctx.fillStyle = '#ff4081';
            ctx.fillText(aiScore.toString(), canvas.width * 3 / 4, 30);
            
            // Draw speed indicator
            ctx.fillStyle = '#888';
            ctx.font = '12px Arial';
            ctx.fillText(`Speed: ${Math.round(gameSpeed * 100)}%`, canvas.width / 2, 30);
            
            // Draw ball hits
            ctx.fillStyle = '#ff9800';
            ctx.font = '10px Arial';
            ctx.fillText(`Hits: ${ballHits}`, canvas.width / 2, canvas.height - 10);

            // Floating rewards animation
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const f = floatingTexts[i];

                ctx.globalAlpha = f.alpha;
                ctx.fillStyle = f.color;
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(f.text, f.x, f.y - f.rise);

                f.rise += 0.5;
                f.alpha -= 0.02;

                if (f.alpha <= 0) {
                    floatingTexts.splice(i, 1);
                }
            }
            ctx.globalAlpha = 1;
        }

        function endGame() {
  if (window.__kspt_gameOverHandled) return;
  window.__kspt_gameOverHandled = true;

  gameRunning = false;

  // НЕ ДОБАВЛЯЕМ финальную награду, если награды уже начислялись по ходу игры.
  // earnedKSPT += safeGetOfflinePercent(playerScore > aiScore ? 5 : 2);

  finalPlayerScoreEl.textContent = playerScore;
  finalAiScoreEl.textContent = aiScore;
  earnedKSPTEl.textContent = earnedKSPT.toFixed(2);
  
  // Показываем количество EK
  earnedEKElem.textContent = sessionEK;

  // НЕ ВЫЗЫВАЕМ safeConsumeTicket() — билет уже списан при старте (games.js)
  // safeConsumeTicket();

  try { (window.parent||window.top).postMessage({ type:'kspt_game_record', game:'pingpong', value: playerScore }, '*'); } catch(e){}
  gameOverScreen.style.display = 'block';

  if (playerScore > aiScore) {
    playSound('win');
    gameVibrate([200,100,200,100,200]);
  } else {
    playSound('lose');
    gameVibrate([300,200,300]);
  }

  try { if (animationId) cancelAnimationFrame(animationId); } catch(e){}
}

let __lastTS = 0;

function gameLoop(ts) {
    if (!__lastTS) __lastTS = ts || performance.now();

    let dt = (ts || performance.now()) - __lastTS;
    if (dt > 100) dt = 100;

    __lastTS = ts || performance.now();

    const frameScale = dt / 16.6667; // база 60 FPS

    if (!gamePaused && gameRunning) {
        // Online interpolation tick (overrides AI paddle / ball for guest)
        if (window.ppInterpolateTick) ppInterpolateTick();
        updatePaddles(frameScale);
        // In online mode as guest — ball is driven by host, skip local physics
        if (!window.__ppOnlineMode || window.__ppIsLeftSide) {
            updateBall(frameScale);
        }
        draw();
    }

    animationId = requestAnimationFrame(gameLoop);
}

        // Initialize game
        function initGame() {
            resetBall();
            playerScore = 0;
            aiScore = 0;
            ballHits = 0;
            gameSpeed = 1.0;
            earnedKSPT = 0;
            sessionEK = 0; // Сбрасываем счетчик EK
            
            playerScoreEl.textContent = '0';
            aiScoreEl.textContent = '0';
            speedEl.textContent = '100%';
            
            gameOverScreen.style.display = 'none';
            gameRunning = true;
            window.__kspt_gameOverHandled = false;
            
            // Reset paddle positions
            playerPaddle.y = canvas.height / 2 - PADDLE_HEIGHT / 2;
            aiPaddle.y = canvas.height / 2 - PADDLE_HEIGHT / 2;
            
            if (animationId) cancelAnimationFrame(animationId);
            requestAnimationFrame(gameLoop);
        }

        // Button event listeners
        document.getElementById('pauseBtn').addEventListener('click', function() {
            gamePaused = !gamePaused;
            this.textContent = gamePaused ? 'Resume' : 'Pause';
            playSound('bounce');
        });

        document.getElementById('restartBtn').addEventListener('click', function() {
  // Проверяем билеты локально
  if (!ensureHasTicketOrWarn()) return;
  
  // Вместо прямого списания билета, запрашиваем новый раунд
  // Родитель сам проверит билеты и спишет если нужно
  try {
    (window.parent || window.top).postMessage({ 
      type: 'kspt_new_round'
    }, '*');
  } catch(e) {
    console.warn('Failed to send new round message', e);
  }
  
  // Запускаем игру
  initGame();
});

document.getElementById('exitBtn').addEventListener('click', function() {
    safeExitGame();
});

document.getElementById('playAgainBtn').addEventListener('click', function() {
    gameOverScreen.style.display = 'none';

    // сказать родителю: начинается новый раунд → нужен билет
    try {
        (window.parent || window.top).postMessage({ type: 'kspt_new_round' }, '*');
    } catch(e){}

    initGame();
});

document.getElementById('exitToMenuBtn').addEventListener('click', function() {
    safeExitGame();
});

        // Заглушки для звуков и вибрации (если нет родительского окна)
        function playSound(soundName) {
            console.log('Sound:', soundName);
        }

        let userInteracted = false;

// отмечаем первое взаимодействие (один раз)
function markUserInteracted() {
  userInteracted = true;
}
document.addEventListener('touchstart', markUserInteracted, { once: true, passive: true });
document.addEventListener('mousedown', markUserInteracted, { once: true });

function gameVibrate(pattern) {
  if (!userInteracted) return; // браузер заблокирует вибрацию в неактивном фрейме
  if (!('vibrate' in navigator)) return;
  try {
    navigator.vibrate(pattern);
  } catch (e) {
    // некоторые браузеры/сборки могут бросать интервенцию — просто игнорируем
    console.warn('vibrate failed or blocked', e);
  }
}
        // Локальная заглушка, НЕ обращаемся к window.top напрямую
        window._local_awardGameReward = window._local_awardGameReward || function (reward, x, y) {
          const r = Number(reward);
          console.log('Reward awarded (local):', isNaN(r) ? reward : r.toFixed(2), 'KSPT at', x, y);
        };

        // Start the game — defer so online scripts load first
        window.__ppStartMode = new URLSearchParams(location.search).get('mode');
        if (window.__ppStartMode !== 'online') {
            initGame();
        }
        // online mode: ppOpenLobby called at bottom of page after all scripts

        // Handle visibility change — only pause if running inside iframe
        document.addEventListener('visibilitychange', function() {
            if (document.hidden && window.self === window.top) {
                gamePaused = true;
                const pb = document.getElementById('pauseBtn');
                if (pb) pb.textContent = 'Resume';
            }
        });

<script>
(function(){
  const BASE_W = 360;   // дизайн игры (тот, что у тебя в canvas width)
  const BASE_H = 360;   // высота игрового поля — подправь если у тебя другое значение

  function fitGameUI() {
    const container = document.querySelector('.game-container') || document.body;
    const header = document.querySelector('.game-header');
    const headerH = header ? header.getBoundingClientRect().height : 0;

    const availW = window.innerWidth;
    const availH = window.innerHeight - headerH - 12; // немного запаса

    // Вычисляем масштаб — чтобы всё поместилось: джойстик + кнопки + канвас
    const scale = Math.min(availW / BASE_W, availH / (BASE_H + 160)); 
    // (160 — пример зоны под джойстик+кнопки; если у тебя меньше/больше — поменяй)

    // Применяем через CSS transform OR (лучше) масштабируем canvas и элементы напрямую:
    // 1) если у тебя canvas с id gameCanvas — меняем его размеры пропорционально
    const canvas = document.getElementById('gameCanvas');
    if (canvas) {
      canvas.style.width = Math.round(BASE_W * scale) + 'px';
      canvas.style.height = Math.round(BASE_H * scale) + 'px';
      // если внутри игры используются canvas.width/canvas.height — обнови их тоже
      if (!canvas.dataset.kspt_scaled) {
        // если внутренняя логика использует canvas.width (pixel buffer),
        // оставь canvas.width = BASE_W * devicePixelRatio, но визуально меняем style
        canvas.dataset.kspt_scaled = '1';
      }
    }

    // 2) джойстик и кнопки — масштабируем wrapper
    const joystick = document.getElementById('joystickArea');
if (joystick) {
  const BASE_JOYSTICK = 150;
  const size = Math.max(50, Math.round(BASE_JOYSTICK * scale));

  joystick.style.width = size + 'px';
  joystick.style.height = size + 'px';
  joystick.style.margin = '8px auto';

  joystick.style.transform = '';
}

    const btnRow = document.querySelector('.game-buttons') || document.querySelector('.game-buttons-row');
    if (btnRow) {
      btnRow.style.transformOrigin = 'top center';
      btnRow.style.transform = `scale(${scale})`;
      btnRow.style.marginTop = '10px';
    }

    // 3) центрируем контейнер
    if (container) {
      container.style.width = Math.round(BASE_W * scale) + 'px';
      container.style.margin = '0 auto';
      container.classList.add('kspt-safe-bottom');
    }
  }

  // listen parent message to force recalculation (parent посылает размеры)
  window.addEventListener('message', (ev) => {
    const d = ev.data || {};
    if (d && d.type === 'kspt_parent_viewport') {
      // для точности — делаем fit через 50ms (после отрисовки)
      setTimeout(fitGameUI, 50);
    }
  });

  // resize on orientation / window resize
  window.addEventListener('resize', fitGameUI);
  window.addEventListener('orientationchange', () => setTimeout(fitGameUI, 120));
  window.addEventListener('load', () => setTimeout(fitGameUI, 80));

  // additionally: prevent overscroll inside iframe (iOS)
  document.addEventListener('touchmove', function(e){
    // allow touch for game controls (they are inside this iframe) — не отменяем,
    // но предотвращаем внутреннюю "резину" страницы, если цель — не элемент управления.
    // Если нужно сделать более тонко — можно разрешить touchmove для .joystick-bg:
    const el = e.target;
    if (el.closest && (el.closest('.joystick-bg') || el.closest('.game-buttons') || el.closest('canvas'))) {
      // allow normal game interaction
      return;
    }
    // otherwise prevent page overscroll
    e.preventDefault();
  }, { passive: false });
})();
</script>

<script>
// ================================================================
// PING PONG ONLINE SYSTEM
// ================================================================

(function() {

// ---- Player identity ----
function ppGetUid() {
  return String(window.Telegram?.WebApp?.initDataUnsafe?.user?.id || localStorage.getItem('_kspt_uid') || 'pp_' + Date.now());
}
function ppGetMeta() {
  const u = window.__tgUser || window.Telegram?.WebApp?.initDataUnsafe?.user;
  let fallbackName = 'Player';
  try {
    const raw = localStorage.getItem('kspt_data') || localStorage.getItem('d');
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && (parsed.name || parsed.username)) fallbackName = parsed.name || parsed.username;
    }
  } catch(e) {}
  return {
    name: u ? (u.first_name + (u.last_name ? ' ' + u.last_name : '')) : fallbackName,
    uid: ppGetUid()
  };
}

// ---- State ----
let ppOnlineMode = false;
let ppMyRoomId = null;
let ppMyPlayerId = null;
let ppMyPlayerName = 'Player';
let ppIsHost = false;
let ppIsLeftSide = false; // host=left, guest=right
let ppWinScore = 3;
let ppRoomListener = null;
let ppRoomsListener = null;
let ppSendInterval = null;
let ppSelfLeaving = false;

// Remote player interpolation
let ppRemote = {
  paddleY: 180,       // target
  paddleYPrev: 180,   // previous
  paddleYCurrent: 180,// interpolated (shown)
  ballX: 180, ballY: 180,
  ballXPrev: 180, ballYPrev: 180,
  ballXCurrent: 180, ballYCurrent: 180,
  lastUpdateTime: 0
};

// ---- Init ----
const ppMeta = ppGetMeta();
ppMyPlayerId = ppMeta.uid;
ppMyPlayerName = ppMeta.name;

// ---- Escape HTML helper ----
function ppEsc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---- Open / Close lobby ----
function ppOpenLobby() {
  document.getElementById('ppOnlineLobby').style.display = 'block';
  document.getElementById('ppLobbyMain').style.display = 'block';
  document.getElementById('ppWaitingRoom').style.display = 'none';
  ppLoadRoomList();
}

function ppCloseLobby() {
  document.getElementById('ppOnlineLobby').style.display = 'none';
  if (ppRoomsListener) {
    window._ppDB.ref('pp_rooms').off('value', ppRoomsListener);
    ppRoomsListener = null;
  }
}

function ppCloseLobbyAndCancel() {
  ppCloseLobby();
  ppCleanup();
  safeExitGame();
}

// ---- Room list ----
function ppLoadRoomList() {
  const listEl = document.getElementById('ppRoomList');
  if (ppRoomsListener) window._ppDB.ref('pp_rooms').off('value', ppRoomsListener);
  ppRoomsListener = function(snap) {
    const rooms = snap.val();
    if (!rooms) {
      listEl.innerHTML = '<div style="color:#555;text-align:center;padding:20px;">No rooms yet. Create one!</div>';
      return;
    }
    listEl.innerHTML = '';
    Object.entries(rooms).forEach(([rid, room]) => {
      if (!room || !room.players) return;
      const count = Object.keys(room.players).length;
      if (count >= 2 || room.started) return;
      const card = document.createElement('div');
      card.className = 'pp-room-card';
      card.innerHTML = `<div class="pp-room-card-info">
        <div class="pp-room-card-name">${ppEsc(room.name || 'Room')}</div>
        <div class="pp-room-card-count">1/2 players • Host: ${ppEsc(room.hostName || '?')} • First to ${room.winScore || 3}</div>
      </div>
      <button class="pp-room-join-btn" data-rid="${rid}">Join</button>`;
      card.querySelector('.pp-room-join-btn').addEventListener('click', () => ppJoinRoom(rid));
      listEl.appendChild(card);
    });
    if (!listEl.children.length) {
      listEl.innerHTML = '<div style="color:#555;text-align:center;padding:20px;">No open rooms. Create one!</div>';
    }
  };
  window._ppDB.ref('pp_rooms').on('value', ppRoomsListener);
}

// ---- Create room ----
function ppCreateRoom() {
  const name = document.getElementById('ppRoomNameInput').value.trim() || 'Pong Room';
  ppWinScore = parseInt(document.getElementById('ppWinScoreSelect').value) || 3;
  const rid = 'pp_room_' + Date.now() + '_' + ppMyPlayerId;
  ppMyRoomId = rid;
  ppIsHost = true;
  ppIsLeftSide = true;
  const myEntry = { uid: ppMyPlayerId, name: ppMyPlayerName, joinedAt: Date.now(), side: 'left' };
  const roomData = {
    name: name,
    hostUid: ppMyPlayerId,
    hostName: ppMyPlayerName,
    winScore: ppWinScore,
    started: false,
    createdAt: Date.now(),
    players: { [ppMyPlayerId]: myEntry }
  };
  window._ppDB.ref('pp_rooms/' + rid).set(roomData).then(() => {
    window._ppDB.ref('pp_rooms/' + rid).onDisconnect().remove();
    ppOpenWaitingRoom(rid);
  });
}

// ---- Join room ----
function ppJoinRoom(rid) {
  ppMyRoomId = rid;
  ppIsHost = false;
  ppIsLeftSide = false;
  const myEntry = { uid: ppMyPlayerId, name: ppMyPlayerName, joinedAt: Date.now(), side: 'right' };
  window._ppDB.ref('pp_rooms/' + rid + '/players/' + ppMyPlayerId).set(myEntry);
  window._ppDB.ref('pp_rooms/' + rid + '/players/' + ppMyPlayerId).onDisconnect().remove();
  ppOpenWaitingRoom(rid);
}

// ---- Waiting room ----
function ppOpenWaitingRoom(rid) {
  document.getElementById('ppLobbyMain').style.display = 'none';
  document.getElementById('ppWaitingRoom').style.display = 'block';
  if (ppRoomsListener) { window._ppDB.ref('pp_rooms').off('value', ppRoomsListener); ppRoomsListener = null; }
  if (ppRoomListener) window._ppDB.ref('pp_rooms/' + rid).off('value', ppRoomListener);

  ppRoomListener = function(snap) {
    const room = snap.val();
    if (!room) { ppLeaveRoom(); return; }
    const players = room.players ? Object.values(room.players) : [];
    document.getElementById('ppWaitingRoomName').textContent = room.name || 'Room';
    document.getElementById('ppWaitingWinScore').textContent = room.winScore || 3;
    document.getElementById('ppWaitingCount').textContent = players.length;

    // Render player slots
    const slotList = document.getElementById('ppPlayerSlotList');
    slotList.innerHTML = '';
    players.forEach(p => {
      const slot = document.createElement('div');
      slot.className = 'pp-player-slot';
      const isMe = p.uid === ppMyPlayerId;
      const side = p.side === 'left' ? '🟦 Left' : '🟥 Right';
      slot.innerHTML = `<span style="font-size:18px;">${p.side === 'left' ? '🟦' : '🟥'}</span>
        <div>
          <div class="pp-player-slot-name">${ppEsc(p.name || 'Player')}</div>
          ${isMe ? '<div class="pp-player-slot-you">← You</div>' : ''}
        </div>
        <div style="margin-left:auto;color:#aaa;font-size:12px;">${p.side === 'left' ? 'Left paddle' : 'Right paddle'}</div>`;
      slotList.appendChild(slot);
    });

    // Show start button only for host
    const startBtn = document.getElementById('ppStartOnlineBtn');
    startBtn.style.display = ppIsHost ? 'block' : 'none';

    const statusMsg = document.getElementById('ppWaitingStatusMsg');
    if (players.length < 2) {
      statusMsg.style.display = 'block';
      statusMsg.style.color = '#aaa';
      statusMsg.textContent = ppIsHost ? 'Waiting for opponent...' : 'Waiting for host to start...';
    } else {
      statusMsg.style.display = ppIsHost ? 'none' : 'block';
      statusMsg.textContent = 'Waiting for host to start...';
    }

    // Check if kicked
    const stillIn = players.some(p2 => p2.uid === ppMyPlayerId);
    if (!stillIn && !ppSelfLeaving) {
      ppLeaveRoom(); ppCloseLobby();
      alert('You have been removed from the room.');
      safeExitGame();
    }
    ppSelfLeaving = false;

    // Start when host pressed start
    if (room.started && !ppOnlineMode) {
      ppWinScore = room.winScore || 3;
      ppStartOnlineGame(room);
    }
  };
  window._ppDB.ref('pp_rooms/' + rid).on('value', ppRoomListener);
}

// ---- Leave room ----
function ppLeaveRoom() {
  if (!ppMyRoomId) return;
  ppSelfLeaving = true;
  window._ppDB.ref('pp_rooms/' + ppMyRoomId + '/players/' + ppMyPlayerId).remove();
  if (ppIsHost) window._ppDB.ref('pp_rooms/' + ppMyRoomId).remove();
  if (ppRoomListener) {
    window._ppDB.ref('pp_rooms/' + ppMyRoomId).off('value', ppRoomListener);
    ppRoomListener = null;
  }
  ppMyRoomId = null; ppIsHost = false;
  document.getElementById('ppWaitingRoom').style.display = 'none';
  document.getElementById('ppLobbyMain').style.display = 'block';
  ppLoadRoomList();
}

// ---- Host presses Start ----
function ppHostStart() {
  if (!ppIsHost || !ppMyRoomId) return;
  window._ppDB.ref('pp_rooms/' + ppMyRoomId + '/players').once('value', snap => {
    const count = snap.val() ? Object.keys(snap.val()).length : 0;
    if (count < 2) {
      const msg = document.getElementById('ppWaitingStatusMsg');
      msg.style.display = 'block';
      msg.style.color = '#ff4081';
      msg.textContent = '⚠️ Need 2 players to start!';
      setTimeout(() => { msg.style.color = '#aaa'; msg.textContent = 'Waiting for opponent...'; }, 2500);
      return;
    }
    // Consume ticket only now
    safeConsumeTicket();
    window._ppDB.ref('pp_rooms/' + ppMyRoomId).update({ started: true, startedAt: Date.now() });
  });
}

// ---- Start online game (called on all clients) ----
function ppStartOnlineGame(room) {
  ppOnlineMode = true;
  // Guest also consumes ticket
  if (!ppIsHost) safeConsumeTicket();
  ppCloseLobby();

  // Determine win score
  ppWinScore = room.winScore || 3;

  // Hide normal buttons, show only Exit
  document.getElementById('pauseBtn').style.display = 'none';
  document.getElementById('restartBtn').style.display = 'none';
  document.getElementById('exitBtn').style.background = 'linear-gradient(135deg,#ff4081,#f50057)';
  document.getElementById('exitBtn').style.color = '#fff';
  document.getElementById('exitBtn').onclick = () => { ppCleanup(); safeExitGame(); };

  // Remap controls: host=left paddle (player), guest=right paddle (was AI)
  // Host controls playerPaddle (left), guest controls aiPaddle (right)
  // The game already runs — we just need to override AI and sync

  // Show countdown
  const overlay = document.createElement('div');
  overlay.id = 'ppCountdown';
  overlay.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:80px;font-weight:bold;color:#00e676;text-shadow:0 0 20px #000;z-index:300;pointer-events:none;';
  document.body.appendChild(overlay);

  let cd = 3;
  overlay.textContent = cd;
  const cdInterval = setInterval(() => {
    cd--;
    if (cd > 0) { overlay.textContent = cd; }
    else if (cd === 0) { overlay.textContent = 'GO!'; }
    else { clearInterval(cdInterval); overlay.remove(); }
  }, 1000);

  // Start send loop (5 times/sec = 200ms)
  ppSendInterval = setInterval(ppSendState, 200);

  // Listen to remote state
  window._ppDB.ref('pp_states/' + ppMyRoomId).on('child_changed', snap => ppApplyRemote(snap.key, snap.val()));
  window._ppDB.ref('pp_states/' + ppMyRoomId).on('child_added',   snap => ppApplyRemote(snap.key, snap.val()));

  // Override game end condition to use ppWinScore
  window.__ppOnlineWinScore = ppWinScore;
  window.__ppOnlineMode = true;
  window.__ppIsLeftSide = ppIsLeftSide;

  // Start game loop (was never running in online mode)
  window.__kspt_gameOverHandled = false;
  gameRunning = true;
  gamePaused = true;
  if (animationId) cancelAnimationFrame(animationId);
  animationId = requestAnimationFrame(gameLoop);
  setTimeout(() => { gamePaused = false; }, 3500);
}

// ---- Send my state ----
function ppSendState() {
  if (!ppOnlineMode || !ppMyRoomId) return;
  const state = {
    t: Date.now(),
    name: ppMyPlayerName
  };
  // Host sends ball + left paddle; guest sends right paddle only
  if (ppIsLeftSide) {
    state.ballX = Math.round(ball.x * 10) / 10;
    state.ballY = Math.round(ball.y * 10) / 10;
    state.paddleY = Math.round(playerPaddle.y * 10) / 10;
  } else {
    state.paddleY = Math.round(aiPaddle.y * 10) / 10;
  }
  window._ppDB.ref('pp_states/' + ppMyRoomId + '/' + ppMyPlayerId).set(state);
}

// ---- Apply remote state with interpolation ----
function ppApplyRemote(uid, data) {
  if (!data || uid === ppMyPlayerId) return;
  const now = Date.now();
  // Save previous for interpolation
  ppRemote.paddleYPrev = ppRemote.paddleYCurrent;
  ppRemote.lastUpdateTime = now;

  if (data.paddleY !== undefined) {
    ppRemote.paddleYPrev = (ppRemote.lastUpdateTime === 0) ? data.paddleY : (ppRemote.paddleYCurrent ?? data.paddleY);
    ppRemote.paddleY = data.paddleY;
  }
  if (data.ballX !== undefined) {
    ppRemote.ballXPrev = (ppRemote.lastUpdateTime === 0) ? data.ballX : (ppRemote.ballXCurrent ?? data.ballX);
    ppRemote.ballX = data.ballX;
  }
  if (data.ballY !== undefined) {
    ppRemote.ballYPrev = (ppRemote.lastUpdateTime === 0) ? data.ballY : (ppRemote.ballYCurrent ?? data.ballY);
    ppRemote.ballY = data.ballY;
  }
}

// ---- Interpolation tick (called from game loop) ----
window.ppInterpolateTick = function() {
  if (!ppOnlineMode) return;
  const now = Date.now();
  const interval = 200; // matches send interval
  const elapsed = now - ppRemote.lastUpdateTime;
  const alpha = Math.min(1.0, elapsed / interval);

  // Interpolate remote paddle
  ppRemote.paddleYCurrent = ppRemote.paddleYPrev + (ppRemote.paddleY - ppRemote.paddleYPrev) * alpha;
  ppRemote.ballXCurrent   = ppRemote.ballXPrev   + (ppRemote.ballX   - ppRemote.ballXPrev)   * alpha;
  ppRemote.ballYCurrent   = ppRemote.ballYPrev   + (ppRemote.ballY   - ppRemote.ballYPrev)   * alpha;

  if (ppIsLeftSide) {
    // I am host/left — I control playerPaddle, remote controls aiPaddle (right)
    // Override AI paddle with interpolated remote value
    aiPaddle.y = ppRemote.paddleYCurrent;
  } else {
    // I am guest/right — I control aiPaddle, remote (host) controls playerPaddle and ball
    playerPaddle.y = ppRemote.paddleYCurrent;
    ball.x = ppRemote.ballXCurrent;
    ball.y = ppRemote.ballYCurrent;
  }
};

// ---- Cleanup ----
function ppCleanup() {
  if (ppSendInterval) { clearInterval(ppSendInterval); ppSendInterval = null; }
  if (ppMyRoomId) {
    window._ppDB.ref('pp_states/' + ppMyRoomId).off();
    window._ppDB.ref('pp_rooms/' + ppMyRoomId + '/players/' + ppMyPlayerId).remove();
    if (ppIsHost) window._ppDB.ref('pp_rooms/' + ppMyRoomId).remove();
    window._ppDB.ref('pp_states/' + ppMyRoomId + '/' + ppMyPlayerId).remove();
  }
  if (ppRoomListener) { window._ppDB.ref('pp_rooms/' + ppMyRoomId).off('value', ppRoomListener); ppRoomListener = null; }
  ppOnlineMode = false; ppMyRoomId = null;
  window.__ppOnlineMode = false;
  document.getElementById('pauseBtn').style.display = '';
  document.getElementById('restartBtn').style.display = '';
  document.getElementById('exitBtn').style.background = '';
  document.getElementById('exitBtn').style.color = '';
  document.getElementById('exitBtn').onclick = null;
}

// ---- Wire up lobby buttons ----
const _ppOnlineBtn = document.getElementById('ppOnlineBtn');
if (_ppOnlineBtn) _ppOnlineBtn.addEventListener('click', ppOpenLobby);
document.getElementById('ppLobbyBackBtn').addEventListener('click', ppCloseLobbyAndCancel);
document.getElementById('ppCreateRoomBtn').addEventListener('click', ppCreateRoom);
document.getElementById('ppLeaveRoomBtn').addEventListener('click', () => { ppLeaveRoom(); });
document.getElementById('ppStartOnlineBtn').addEventListener('click', ppHostStart);

// Expose remote object so game loop can read it
window._ppRemote = ppRemote;
window._ppIsLeftSide = () => ppIsLeftSide;
window.ppOpenLobby = ppOpenLobby;
window.ppCloseLobby = ppCloseLobby;
window.ppHostStart = ppHostStart;
window.ppCleanup = ppCleanup;

})();
</script>

<script>
if (window.__ppStartMode === 'online') {
    window.addEventListener('load', () => {
        if (window.ppOpenLobby) {
            window.ppOpenLobby();
        } else {
            console.error('ppOpenLobby not found');
        }
    });
}
</script>
