            const groundMat = new THREE.MeshStandardMaterial({ map: grassTex, roughness: 1.0 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.05;
            ground.receiveShadow = true;
            scene.add(ground);
        }

        // ========== ГЕНЕРАЦИЯ ТРАССЫ ==========
        function generateTrack() {
            const points = [];
            // Проверенная основа — эллипс по часовой стрелке
            // с chicanes (шиканами) для левых и правых поворотов
            const R = 110;
            const segments = 16;
            for (let i = 0; i < segments; i++) {
                const angle = (i / segments) * Math.PI * 2;
                // Базовая эллиптическая форма
                let x = Math.cos(angle) * R * 1.2;
                let z = Math.sin(angle) * R;
                // Добавляем шиканы: каждые ~3 сегмента смещаем точку внутрь/наружу
                // Это создаёт чередующиеся левые и правые повороты
                const chicanePhase = Math.floor(i / 2) % 2 === 0 ? 1 : -1;
                if (i % 2 === 1) {
                    // Смещаем точку перпендикулярно направлению
                    const nx = -Math.sin(angle); // нормаль (внутрь/наружу)
                    const nz =  Math.cos(angle);
                    const offset = chicanePhase * 22;
                    x += nx * offset;
                    z += nz * offset;
                }
                points.push(new THREE.Vector3(x, 0, z));
            }
            roadCurve = new THREE.CatmullRomCurve3(points, true); // closed=true без дубля точки
            roadCurve.closed = true;

            const divisions = 400; // Больше сегментов для гладкости огромной трассы
            const roadWidth = 7.0;
            
            const asphaltTex = createNoiseTexture('#3a3a3a', '#2a2a2a', 128, 128);
            const roadMaterial = new THREE.MeshStandardMaterial({ map: asphaltTex, roughness: 0.9, metalness: 0.1 });
            const lineMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });

            // Road Segments
            for (let i = 0; i < divisions; i++) {
                const t1 = i / divisions;
                const t2 = (i + 1) / divisions;
                const p1 = roadCurve.getPointAt(t1);
                const p2 = roadCurve.getPointAt(t2);
                const dir = new THREE.Vector3().subVectors(p2, p1).normalize();

                const segmentLength = p1.distanceTo(p2) * 1.05; // slight overlap
                const boxGeo = new THREE.BoxGeometry(roadWidth, 0.1, segmentLength);
                const boxMesh = new THREE.Mesh(boxGeo, roadMaterial);
                boxMesh.position.copy(p1.clone().add(p2).multiplyScalar(0.5));
                boxMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir);
                boxMesh.receiveShadow = true;
                scene.add(boxMesh);

                // Center dashed lines
                if (i % 6 === 0) {
                    const lineGeo = new THREE.BoxGeometry(0.15, 0.12, 1.2);
                    const lineMesh = new THREE.Mesh(lineGeo, lineMaterial);
                    lineMesh.position.copy(p1.clone().add(p2).multiplyScalar(0.5));
                    lineMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir);
                    scene.add(lineMesh);
                }
            }

            // Строим lookup из точек трассы для быстрой проверки
            const trackSamples = [];
            for (let i = 0; i < 200; i++) {
                trackSamples.push(roadCurve.getPointAt(i / 200));
            }
            function distToTrack(pos) {
                let minD = Infinity;
                for (const s of trackSamples) {
                    const d = Math.sqrt((pos.x-s.x)**2 + (pos.z-s.z)**2);
                    if (d < minD) minD = d;
                }
                return minD;
            }
            function tryPlaceTree(x, z) {
                const pos = new THREE.Vector3(x, 0, z);
                if (distToTrack(pos) > 9.0) createTree(pos); // только если далеко от дороги
            }

            // Деревья вдоль трассы — строго снаружи
            for (let i = 0; i < divisions; i += 6) {
                const t = i / divisions;
                const p = roadCurve.getPointAt(t);
                const dir = roadCurve.getTangentAt(t);
                const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0,1,0)).normalize();
                // Ставим деревья на достаточном расстоянии по обе стороны
                [10, 14, 18].forEach(d => {
                    tryPlaceTree(p.x + right.x * d + (Math.random()-0.5)*2,
                                 p.z + right.z * d + (Math.random()-0.5)*2);
                    tryPlaceTree(p.x - right.x * d + (Math.random()-0.5)*2,
                                 p.z - right.z * d + (Math.random()-0.5)*2);
                });
            }
            // Фоновые деревья
            for (let a = 0; a < Math.PI * 2; a += 0.12) {
                const r = 175 + Math.random() * 40;
                tryPlaceTree(Math.cos(a) * r, Math.sin(a) * r);
            }

            // Finish Line — шашечная полоса + два флага по бокам
            const finishPos = roadCurve.getPointAt(0);
            const finishDir = roadCurve.getTangentAt(0).normalize();
            const finishRight = new THREE.Vector3().crossVectors(finishDir, new THREE.Vector3(0,1,0)).normalize();
            const finishAngle = Math.atan2(finishDir.x, finishDir.z);
            const finishMatW = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const finishMatB = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const roadW = 7.0;
            const tileSize = roadW / 8;
            const cols = 8;
            const rows = 2;
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const isWhite = (row + col) % 2 === 0;
                    const mat = isWhite ? finishMatW : finishMatB;
                    const tile = new THREE.Mesh(new THREE.PlaneGeometry(tileSize, tileSize * 1.2), mat);
                    const lateralOffset = (col - cols / 2 + 0.5) * tileSize;
                    const forwardOffset = (row - rows / 2 + 0.5) * tileSize * 1.2;
                    const pos = finishPos.clone()
                        .addScaledVector(finishRight, lateralOffset)
                        .addScaledVector(finishDir, forwardOffset);
                    pos.y = 0.02;
                    tile.position.copy(pos);
                    tile.rotation.x = -Math.PI / 2;
                    tile.rotateOnWorldAxis(new THREE.Vector3(0,1,0), finishAngle);
                    scene.add(tile);
                }
            }
            // Два флагштока — по обеим сторонам дороги
            const poleMat = new THREE.MeshStandardMaterial({ color: 0xcccccc });
            const flagMat = new THREE.MeshStandardMaterial({ color: 0xff2222, side: THREE.DoubleSide });
            [-1, 1].forEach(side => {
                const polePos = finishPos.clone().addScaledVector(finishRight, side * (roadW / 2 + 0.5));
                polePos.y = 2.5;
                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 5, 8), poleMat);
                pole.position.copy(polePos);
                scene.add(pole);
                // Флаг прикреплён к верхушке
                const flag = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.9), flagMat);
                flag.position.copy(polePos.clone().add(new THREE.Vector3(
                    finishRight.x * side * 0.7,
                    2.2,
                    finishRight.z * side * 0.7
                )));
                flag.rotation.y = finishAngle;
                scene.add(flag);
            });
        }

        function createTree(pos) {
            const type = Math.floor(Math.random() * 4);
            const scale = 0.8 + Math.random() * 0.8;
            const trunkColors = [0x6e4225, 0x5a3a1a, 0x7a5030, 0x4a3020];
            const leafColors  = [0x246332, 0x1a5c28, 0x2d7a3a, 0x3a8c2a, 0x1e6b1e, 0x4a9a30];
            const trunkCol = trunkColors[Math.floor(Math.random() * trunkColors.length)];
            const leafCol  = leafColors [Math.floor(Math.random() * leafColors.length)];
            const trunkMat = new THREE.MeshStandardMaterial({ color: trunkCol });
            const leafMat  = new THREE.MeshStandardMaterial({ color: leafCol, roughness: 0.9 });

            if (type === 0) {
                // Классическая ёлка — 3 яруса конусов
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 1.2 * scale), trunkMat);
                trunk.position.set(pos.x, 0.6 * scale, pos.z);
                trunk.castShadow = true; scene.add(trunk);
                [0, 1, 2].forEach(tier => {
                    const r = (1.6 - tier * 0.35) * scale;
                    const h = (1.6 - tier * 0.2) * scale;
                    const cone = new THREE.Mesh(new THREE.ConeGeometry(r, h, 8), leafMat);
                    cone.position.set(pos.x, (1.2 + tier * 1.1) * scale, pos.z);
                    cone.castShadow = true; scene.add(cone);
                });
            } else if (type === 1) {
                // Круглое лиственное дерево
                const h = (1.4 + Math.random() * 0.6) * scale;
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.35, h), trunkMat);
                trunk.position.set(pos.x, h / 2, pos.z);
                trunk.castShadow = true; scene.add(trunk);
                const r = (1.2 + Math.random() * 0.6) * scale;
                const crown = new THREE.Mesh(new THREE.SphereGeometry(r, 8, 6), leafMat);
                crown.position.set(pos.x, h + r * 0.6, pos.z);
                crown.castShadow = true; scene.add(crown);
            } else if (type === 2) {
                // Высокая тонкая сосна
                const h = (2.5 + Math.random()) * scale;
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.25, h * 0.5), trunkMat);
                trunk.position.set(pos.x, h * 0.25, pos.z);
                trunk.castShadow = true; scene.add(trunk);
                const cone = new THREE.Mesh(new THREE.ConeGeometry(0.9 * scale, h * 0.75, 7), leafMat);
                cone.position.set(pos.x, h * 0.5 + h * 0.375, pos.z);
                cone.castShadow = true; scene.add(cone);
            } else {
                // Куст — несколько сфер
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 0.7 * scale), trunkMat);
                trunk.position.set(pos.x, 0.35 * scale, pos.z);
                trunk.castShadow = true; scene.add(trunk);
                const offsets = [[0,0],[0.5,0.3],[-0.5,0.2],[0.2,-0.5]];
                offsets.forEach(([ox, oz]) => {
                    const r = (0.6 + Math.random() * 0.4) * scale;
                    const b = new THREE.Mesh(new THREE.SphereGeometry(r, 7, 5), leafMat);
                    b.position.set(pos.x + ox * scale, (0.7 + r * 0.7) * scale, pos.z + oz * scale);
                    b.castShadow = true; scene.add(b);
                });
            }
        }

        // ========== СОЗДАНИЕ МАШИН ==========
        function createCar(color, pos, isPlayer = false) {
            const group = new THREE.Group();

            // Основной кузов (более длинный и плоский)
            const bodyGeo = new THREE.BoxGeometry(1.3, 0.3, 2.4);
            const bodyMat = new THREE.MeshStandardMaterial({ color, roughness: 0.2, metalness: 0.8 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.25;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            // Кабина (сдвинута назад для спортивного вида)
            const cabinGeo = new THREE.BoxGeometry(0.9, 0.3, 1.0);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, metalness: 0.9 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 0.55, -0.2);
            cabin.castShadow = true;
            group.add(cabin);

            // Спойлер
            const spoilerGeo = new THREE.BoxGeometry(1.2, 0.05, 0.3);
            const spoilerMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const spoiler = new THREE.Mesh(spoilerGeo, spoilerMat);
            spoiler.position.set(0, 0.6, -1.05);
            spoiler.castShadow = true;
            group.add(spoiler);
            
            const p1 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.2, 0.1), spoilerMat);
            p1.position.set(0.4, 0.45, -1.05); group.add(p1);
            const p2 = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.2, 0.1), spoilerMat);
            p2.position.set(-0.4, 0.45, -1.05); group.add(p2);

            // Headlights & Taillights
            const hlMat = new THREE.MeshStandardMaterial({ color: 0xffffee, emissive: 0xffffee });
            const tlMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000 });
            const lGeo = new THREE.BoxGeometry(0.3, 0.1, 0.05);
            
            const hl1 = new THREE.Mesh(lGeo, hlMat); hl1.position.set(0.4, 0.3, 1.2); group.add(hl1);
            const hl2 = new THREE.Mesh(lGeo, hlMat); hl2.position.set(-0.4, 0.3, 1.2); group.add(hl2);
            
            const tl1 = new THREE.Mesh(lGeo, tlMat); tl1.position.set(0.4, 0.3, -1.2); group.add(tl1);
            const tl2 = new THREE.Mesh(lGeo, tlMat); tl2.position.set(-0.4, 0.3, -1.2); group.add(tl2);

            // Wheels
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
            const positions = [[-0.75, 0.2, 0.8], [0.75, 0.2, 0.8], [-0.75, 0.2, -0.8], [0.75, 0.2, -0.8]];
            positions.forEach(pos => {
                const wheelGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 16);
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI/2;
                wheel.position.set(pos[0], pos[1], pos[2]);
                wheel.castShadow = true;
                group.add(wheel);
            });

            group.position.copy(pos);
            group.userData = { 
                speed: 0, 
                maxSpeed: maxSpeed * (0.83 + Math.random() * 0.15), // -2% от предыдущего
                offset: undefined,
                lap: 1, 
                lastParam: 0, 
                isPlayer, 
                color, 
                ai: !isPlayer,
                aggressive: Math.random() < 0.4, // 40% ботов агрессивны
                pushVelX: 0, // импульс толчка X
                pushVelZ: 0  // импульс толчка Z
            };
            return group;
        }

        const carColors = [0xff4136, 0x2ecc40, 0x0074d9, 0xff851b, 0xb10dc9, 0xffdc00];
                // смещения полос чуть уже — безопаснее по центру трассы
        const botLaneOffsets = [-2.2, 0.0, 2.2, -2.2, 0.0, 2.2];

        function initCars() {
            // Стартовое направление трассы — по нему ориентируем всех
            const startDir = roadCurve.getTangentAt(0).normalize();
            const startRight = new THREE.Vector3().crossVectors(startDir, new THREE.Vector3(0,1,0)).normalize();
            const startBack = startDir.clone().negate();
            // Стартовая позиция чуть впереди от t=0 чтобы не триггерить финиш сразу
            const startBase = roadCurve.getPointAt(0.02);

            const playerSlot = Math.floor(Math.random() * 6);

            for (let slot = 0; slot < 6; slot++) {
    const row = Math.floor(slot / 3);

    // полоса для этого слота
    const laneIndex = slot % botLaneOffsets.length;

    // небольшой разброс внутри полосы
    const lateralOffset = botLaneOffsets[laneIndex];

    const pos = startBase.clone()
        .addScaledVector(startRight, lateralOffset)
        // небольшой разброс вперёд/назад (±0.6)
        .addScaledVector(startBack, row * 5.5);

                const isPlayer = (slot === playerSlot);
                const car = createCar(carColors[slot], pos, isPlayer);
                // полоса для этого стартового слота
const laneOffsetForSlot = botLaneOffsets[slot % botLaneOffsets.length];

// назначаем базовую полосу машине
if (!isPlayer) {
    car.userData.offset = laneOffsetForSlot;
    car.userData.baseOffset = laneOffsetForSlot;
} else {
    car.userData.baseOffset = laneOffsetForSlot;
}

car.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), startDir);
car.userData.lastParam = 0.02 - row * 0.003;
car.userData.lap = 1;

if (isPlayer) {
    playerCar = car;
    lastCheckpointParam = car.userData.lastParam;
} else {
    botCars.push(car);
}
scene.add(car);
            }
        }

        // ========== МОНЕТЫ ==========
        let sharedCoinMaterial = null;

        function createCoinTexture() {
            const c = document.createElement('canvas'); 
            c.width = 128; 
            c.height = 128;
            const ctx = c.getContext('2d');
            // Круглый тёмно-серый фон
            ctx.clearRect(0, 0, 128, 128);
            ctx.beginPath();
            ctx.arc(64, 64, 62, 0, Math.PI * 2);
            ctx.fillStyle = '#333333';
            ctx.fill();
            // Обводка
            ctx.strokeStyle = '#00bcd4';
            ctx.lineWidth = 4;
            ctx.stroke();
            // Буква K белая
            ctx.fillStyle = '#ffffff'; 
            ctx.font = 'bold 76px Arial';
            ctx.textAlign = 'center'; 
            ctx.textBaseline = 'middle';
            ctx.fillText('K', 64, 64);
            return new THREE.CanvasTexture(c);
        }

        function createCoin(pos) {
            const group = new THREE.Group();
            // Передняя сторона (K смотрит вперёд)
            if (!sharedCoinMaterial) {
                sharedCoinMaterial = new THREE.MeshStandardMaterial({ 
                    map: createCoinTexture(),
                    side: THREE.DoubleSide,
                    transparent: true,
                    alphaTest: 0.1,
                    metalness: 0.3, 
                    roughness: 0.6
                });
            }
            const geo = new THREE.CircleGeometry(0.55, 32);
            const plane = new THREE.Mesh(geo, sharedCoinMaterial);
            plane.castShadow = false;
            group.add(plane);

            group.position.copy(pos);
            group.position.y = 0.9;
            group.userData = { collected: false };
            scene.add(group);
            return group;
        }

        function spawnCoins() {
            for (let i = 0; i < 56; i++) { // Уменьшено кол-во примерно на 30% (было 80)
                const t = i / 56;
                const p = roadCurve.getPointAt(t);
                const dir = roadCurve.getTangentAt(t);
                const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0,1,0)).normalize();
                const offset = (Math.random() - 0.5) * 3.5;
                const coinPos = p.clone().add(right.clone().multiplyScalar(offset));
                coins.push(createCoin(coinPos));
            }
        }

        // ========== УПРАВЛЕНИЕ ==========
        function setupControls() {
            const joystickArea = document.getElementById('joystickArea');
            const knob = document.getElementById('joystickKnob');
            const gasPedal = document.getElementById('gasPedal');

            window.joystickActive = false;
            window.keys = { w: false, a: false, s: false, d: false };

            let startX = 0, startY = 0;
            let activeTouchId = null;
            const maxDist = 45;

            function handleMove(x, y) {
                const dx = x - startX;
                const dy = y - startY;
                const dist = Math.min(maxDist, Math.hypot(dx, dy));
                const angle = Math.atan2(dy, dx);
                const limitedDx = Math.cos(angle) * dist;
                const limitedDy = Math.sin(angle) * dist;
                knob.style.transform = `translate(calc(-50% + ${limitedDx}px), calc(-50% + ${limitedDy}px))`;
                // iOS и Android — одинаковый знак для джойстика (dx вправо = поворот вправо)
                const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
                const joySign = isIOS ? 1 : -1;
                const raw = (limitedDx / maxDist) * joySign;
                steering = Math.sign(raw) * Math.pow(Math.abs(raw), 0.8);
            }

            function resetKnob() {
                knob.style.transform = 'translate(-50%, -50%)';
                steering = 0;
            }

            // Сенсорное управление — отслеживаем конкретный палец
            joystickArea.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (activeTouchId !== null) return; // уже есть активный палец
                const t = e.changedTouches[0];
                activeTouchId = t.identifier;
                const rect = joystickArea.getBoundingClientRect();
                startX = rect.left + rect.width / 2;
                startY = rect.top + rect.height / 2;
                window.joystickActive = true;
                handleMove(t.clientX, t.clientY);
                unlockAudio();
            }, { passive: false });

            joystickArea.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (!window.joystickActive) return;
                for (const t of e.changedTouches) {
                    if (t.identifier === activeTouchId) {
                        handleMove(t.clientX, t.clientY);
                        break;
                    }
                }
            }, { passive: false });

            joystickArea.addEventListener('touchend', (e) => {
                e.preventDefault();
                for (const t of e.changedTouches) {
                    if (t.identifier === activeTouchId) {
                        activeTouchId = null;
                        window.joystickActive = false;
                        resetKnob();
                        break;
                    }
                }
            }, { passive: false });

            joystickArea.addEventListener('touchcancel', (e) => {
                activeTouchId = null;
                window.joystickActive = false;
                resetKnob();
            });

            joystickArea.addEventListener('mousedown', (e) => {
                e.preventDefault();
                const rect = joystickArea.getBoundingClientRect();
                startX = rect.left + rect.width / 2;
                startY = rect.top + rect.height / 2;
                window.joystickActive = true;
                unlockAudio();
            });
            window.addEventListener('mousemove', (e) => { if (!window.joystickActive) return; handleMove(e.clientX, e.clientY); });
            window.addEventListener('mouseup', () => { if (window.joystickActive) { window.joystickActive = false; resetKnob(); } });

            gasPedal.addEventListener('touchstart', (e) => { e.preventDefault(); throttle = 1.0; gasPedal.classList.add('active'); unlockAudio(); });
            gasPedal.addEventListener('touchend', (e) => { e.preventDefault(); throttle = 0; gasPedal.classList.remove('active'); });
            gasPedal.addEventListener('mousedown', (e) => { e.preventDefault(); throttle = 1.0; gasPedal.classList.add('active'); unlockAudio(); });
            window.addEventListener('mouseup', () => { throttle = 0; gasPedal.classList.remove('active'); });

            // Управление на ПК: A/D (или стрелки) = поворот, Space = газ
            window.addEventListener('keydown', (e) => {
                if (e.repeat) return;
                const k = e.key.toLowerCase();
                if (k === 'a' || k === 'arrowleft')  { window.keys.a = true; }
                if (k === 'd' || k === 'arrowright') { window.keys.d = true; }
                if (k === 'w' || k === 'arrowup')    { window.keys.w = true; }
                if (k === 's' || k === 'arrowdown')  { window.keys.s = true; }
                if (k === ' ' || e.code === 'Space') {
                    throttle = 1.0;
                    gasPedal.classList.add('active');
                    unlockAudio();
                    e.preventDefault();
                }
            });

            window.addEventListener('keyup', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'a' || k === 'arrowleft')  { window.keys.a = false; }
                if (k === 'd' || k === 'arrowright') { window.keys.d = false; }
                if (k === 'w' || k === 'arrowup')    { window.keys.w = false; }
                if (k === 's' || k === 'arrowdown')  { window.keys.s = false; }
                if (k === ' ' || e.code === 'Space') {
                    throttle = 0;
                    gasPedal.classList.remove('active');
                }
            });
        // ========== ГИРОСКОП ==========
            window.gyroEnabled = false;
            window.gyroGamma = 0; // наклон влево/вправо

            function startGyro() {
                // iOS 13+ требует явного разрешения
                if (typeof DeviceOrientationEvent !== 'undefined' &&
                    typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(state => {
                            if (state === 'granted') listenGyro();
                        }).catch(() => {});
                } else {
                    // Android и старые iOS — сразу слушаем
                    listenGyro();
                }
            }

            function listenGyro() {
                // iOS и Android дают противоположный знак gamma
                const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
                const gyroSign = isIOS ? -1 : 1; // iOS инвертирован
                window.addEventListener('deviceorientation', (e) => {
                    if (e.gamma === null) return;
                    window.gyroEnabled = true;
                    const raw = Math.max(-35, Math.min(35, e.gamma * gyroSign));
                    const dead = 6;
                    if (Math.abs(raw) < dead) {
                        window.gyroGamma = 0;
                    } else {
                        const norm = (raw - Math.sign(raw) * dead) / (35 - dead);
                        window.gyroGamma = Math.sign(norm) * Math.pow(Math.abs(norm), 1.4);
                    }
                }, true);
            }
            // Кнопка gyro теперь в header (HTML), просто вешаем listener
            const gyroBtn = document.getElementById('gyroBtn');
            gyroBtn.addEventListener('click', () => {
                startGyro();
                gyroBtn.innerText = '✅ Gyro ON';
                gyroBtn.style.background = 'rgba(0,230,118,0.3)';
            });

            // На Android пробуем автоматически
            if (!/iphone|ipad|ipod/i.test(navigator.userAgent)) {
                startGyro();
            }
        }

        // ========== ЛОГИКА ДВИЖЕНИЯ ==========
        function getClosestParam(pos, lastParam) {
            let bestT = lastParam || 0;
            let bestDist = Infinity;
            // Ищем только в окне ±0.15 вокруг lastParam чтобы не прыгать назад
            const window_ = 0.15;
            for (let i = 0; i < 60; i++) {
                const offset = (i / 60) * window_ * 2 - window_;
                const t = ((lastParam || 0) + offset + 1) % 1;
                const p = roadCurve.getPointAt(t);
                const dist = p.distanceTo(pos);
                if (dist < bestDist) {
                    bestDist = dist;
                    bestT = t;
                }
            }
            return bestT;
        }

        function updatePlayer() {
            if (!raceActive || gamePaused || countdownActive) return;

            // Гироскоп (приоритет если активен и джойстик не используется)
            if (window.gyroEnabled && !window.joystickActive) {
                steering = window.gyroGamma; // уже нормализован -1..1
            } else if (window.keys && !window.joystickActive) {
                if (window.keys.a) steering = 1;
                else if (window.keys.d) steering = -1;
                else steering = 0;
            }

            // Ускорение
            if (throttle > 0) speed = Math.min(maxSpeed, speed + acceleration);
            else speed = Math.max(0, speed - 0.1);

            // Поворот
            const speedFactor = Math.min(1.0, speed / 0.8);
            const turn = steering * turnSpeed * speedFactor;
            playerCar.rotation.y += turn;

            // Движение вперед
            const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(playerCar.quaternion);
            playerCar.position.addScaledVector(forward, speed * 0.1);

            // Ограничение (Трасса / Бездорожье)
            const param = getClosestParam(playerCar.position, lastCheckpointParam);
            const trackPoint = roadCurve.getPointAt(param);
            const distToCenter = playerCar.position.distanceTo(trackPoint);
            const maxTrackDist = 5.5; // половина ширины 7.0 + запас на столкновения

            if (distToCenter > maxTrackDist) {
                const toCar = new THREE.Vector3().subVectors(playerCar.position, trackPoint);
                toCar.y = 0;
                toCar.normalize().multiplyScalar(maxTrackDist);
                playerCar.position.copy(trackPoint.clone().add(toCar));
                speed *= 0.88;
            } else if (distToCenter > 2.8) {
                // Трава: ограничиваем скорость до 30% максимума
                const grassMax = maxSpeed * 0.30;
                if (speed > grassMax) speed = Math.max(grassMax, speed - 0.04);
                camera.position.y += (Math.random() - 0.5) * 0.06;
            }

            // Защита от езды назад: трекаем прогресс вперёд
            const paramDelta = param - lastCheckpointParam;
            // Нормализуем переход через 0/1
            const normalDelta = paramDelta > 0.5 ? paramDelta - 1 : (paramDelta < -0.5 ? paramDelta + 1 : paramDelta);
            if (normalDelta < 0) {
                // Едем назад — не считаем круги
            } else {
                // Круги — только если ехали вперёд
                if (param < 0.05 && lastCheckpointParam > 0.92) {
                    if (!finishLinePassed) {
                        finishLinePassed = true;
                        if (lap < maxLaps) {
                            lap++;
                            document.getElementById('lapDisplay').innerText = `${lap}/${maxLaps}`;
                        } else {
                            endRace("You");
                        }
                    }
                } else if (param > 0.15 && param < 0.85) {
                    finishLinePassed = false;
                }
            }
            lastCheckpointParam = param;
            playerCar.userData.lastParam = param;
            playerCar.userData.lap = lap;
        }

        function updateBots() {
            if (raceFinished || gamePaused || countdownActive) return;
            if (!raceActive && finishOrder.length === 0) return;

                        // ROAD_HALF должен точно соответствовать половине ширины дороги (roadWidth / 2 = 7.0 / 2)
            const ROAD_HALF = 3.5; // исправлено: соответствует roadWidth = 7.0 в generateTrack()

            botCars.forEach((bot, idx) => {
                let currentParam = getClosestParam(bot.position, bot.userData.lastParam);
                if (currentParam < 0.1 && bot.userData.lastParam > 0.9) {
                    bot.userData.lap++;
                    if (bot.userData.lap > maxLaps) endRace(`Bot ${idx + 1}`);
                }
                bot.userData.lastParam = currentParam;

                // === ТОЧНОЕ ЗНАНИЕ О ТРАССЕ ===
                const trackCenter = roadCurve.getPointAt(currentParam);
                const dirNow = roadCurve.getTangentAt(currentParam).normalize();
                const rightNow = new THREE.Vector3().crossVectors(dirNow, new THREE.Vector3(0,1,0)).normalize();
                const toBot = new THREE.Vector3().subVectors(bot.position, trackCenter);
                toBot.y = 0;
                const currentSideOffset = rightNow.dot(toBot); // реальное боковое смещение от центра
                const onGrass = Math.abs(currentSideOffset) > ROAD_HALF;

                /*
if (idx === 0) {
    console.log(
        'offset:', currentSideOffset.toFixed(2),
        'baseOffset:', (bot.userData.baseOffset || 0).toFixed(2),
        'onGrass:', onGrass,
        'rightNow:', rightNow.x.toFixed(2), rightNow.z.toFixed(2)
    );
}
*/

                // === ИНИЦИАЛИЗАЦИЯ ПОЛОСЫ ===
                if (bot.userData.offsetTarget === undefined) {
                    bot.userData.offsetTarget = bot.userData.baseOffset || 0;
                    bot.userData.offsetChangeTimer = 0;
                }

                // На траве — ВСЕГДА немедленно возвращаться на свою базовую полосу
                if (onGrass) {
                    bot.userData.offsetTarget = bot.userData.baseOffset || 0;
                    bot.userData.offsetChangeTimer = 0;
                } else {
                    // Небольшое случайное виляние внутри своей полосы раз в ~5 сек
                    bot.userData.offsetChangeTimer = (bot.userData.offsetChangeTimer || 0) + 1;
                    if (bot.userData.offsetChangeTimer > 300 + Math.random() * 100) {
                        bot.userData.offsetChangeTimer = 0;
                        const base = bot.userData.baseOffset || 0;
                        bot.userData.offsetTarget = base + (Math.random() * 0.8 - 0.4);
                        // ЖЁСТКИЙ clamp — никогда не выходить за пределы трассы
                        bot.userData.offsetTarget = Math.max(-(ROAD_HALF - 0.8), Math.min(ROAD_HALF - 0.8, bot.userData.offsetTarget));
                    }
                }

                // Желаемая полоса — всегда внутри трассы
                if (bot.userData.currentOffset === undefined) {
                    bot.userData.currentOffset = bot.userData.baseOffset || 0;
                }
                const clampedTarget = Math.max(-(ROAD_HALF - 0.8), Math.min(ROAD_HALF - 0.8, bot.userData.offsetTarget));
                const avoidAge = (performance.now() - (bot.userData._lastAvoidTime || 0));
const reactFactor = (avoidAge < 1200) ? 0.12 : 0.04; // быстрее реагировать первые ~1.2с после avoid
bot.userData.currentOffset += (clampedTarget - bot.userData.currentOffset) * reactFactor;
                bot.userData.currentOffset = Math.max(-(ROAD_HALF - 0.8), Math.min(ROAD_HALF - 0.8, bot.userData.currentOffset));
                const desiredOffset = bot.userData.currentOffset;

                // === STEERING ===
                const speedFactor = bot.userData.speed || 0;
                const lookAhead = (currentParam + 0.03 + speedFactor * 0.005) % 1.0;
                const targetPoint = roadCurve.getPointAt(lookAhead).clone();
                const dirAhead = roadCurve.getTangentAt(lookAhead).normalize();
                const rightAhead = new THREE.Vector3().crossVectors(dirAhead, new THREE.Vector3(0,1,0)).normalize();

                // offsetError считаем в той же системе координат что и targetPoint
                const toBot2 = new THREE.Vector3().subVectors(bot.position, targetPoint);
                toBot2.y = 0;
                const currentSideOffsetAhead = rightAhead.dot(toBot2);
                const offsetError = desiredOffset - currentSideOffsetAhead;

                const totalOffset = Math.max(-(ROAD_HALF - 0.5), Math.min(ROAD_HALF - 0.5,
                    desiredOffset + Math.sign(offsetError) * Math.min(1.5, Math.abs(offsetError) * 0.8)
                ));
                targetPoint.addScaledVector(rightAhead, totalOffset);

                const botForward = new THREE.Vector3(0,0,1).applyQuaternion(bot.quaternion);
                const toTarget = new THREE.Vector3().subVectors(targetPoint, bot.position);
                toTarget.y = 0;

                let angle = Math.atan2(toTarget.x, toTarget.z) - Math.atan2(botForward.x, botForward.z);
                while (angle > Math.PI) angle -= Math.PI * 2;
                while (angle < -Math.PI) angle += Math.PI * 2;

                // если бот на траве — резко возвращаем его к дороге
if (onGrass) {
    const recovery = -currentSideOffset * 0.25;
    bot.position.addScaledVector(rightNow, recovery);
}

const urgency = onGrass ? 0.25 : 0.08;
                const turnLimit = Math.min(0.18, urgency + Math.abs(offsetError) * 0.02);
                bot.rotation.y += Math.max(-turnLimit, Math.min(turnLimit, angle * 0.95));

                // === СКОРОСТЬ и ИЗБЕГАНИЕ СОСЕДЕЙ ===
                let botThrottle = 1.0;

                const allCars = [playerCar, ...botCars];
                for (const other of allCars) {
                    if (other === bot) continue;
                    const distToOther = bot.position.distanceTo(other.position);
                    if (distToOther < 4.0) {
                        const toOther = new THREE.Vector3().subVectors(other.position, bot.position).normalize();
                        const ahead = botForward.dot(toOther);
                        if (ahead > 0.65) {
                            // Плавное торможение — чем ближе тем сильнее
                            botThrottle = Math.min(botThrottle, 0.3 + (distToOther / 4.0) * 0.7);
                            // Уход на ПРОТИВОПОЛОЖНУЮ сторону от соседа, строго в пределах трассы
                            const toOtherVec = new THREE.Vector3().subVectors(other.position, bot.position);
                            const sideDot = rightNow.dot(toOtherVec);
                            // Решаем в какую сторону уходить на основе позиции соседа относительно правого вектора
// sideDot > 0 => сосед справа, значит уходим влево (-1). И наоборот.
let avoidDir = (sideDot >= 0) ? -1 : 1;

// Небольшая редкая инверсия (15%) чтобы добавить вариативности
if (Math.random() < 0.15) avoidDir *= -1;

// Джиттер на основе индекса бота, чтобы не синхронить всех одновременно
const jitter = (idx % 3) * 0.06 * (Math.random() - 0.5);

// Желаемый сдвиг — умеренный (0.6..1.2)
const shift = 0.6 + Math.random() * 0.6 + jitter;

// Предпочтительный новый таргет (относительно текущего смещения)
let newTarget = currentSideOffset + avoidDir * shift;

// Если newTarget слишком далеко от базовой полосы — лучше немного откатиться к baseOffset
const base = bot.userData.baseOffset || 0;
const distFromBase = Math.abs(newTarget - base);
if (distFromBase > 1.8) {
    // мягко вернуть к базовой полосе вместо экстремального ухода
    newTarget = base + Math.sign(newTarget - base) * 1.1;
}

// Жёсткий clamp, как и раньше
bot.userData.offsetTarget = Math.max(-(ROAD_HALF - 0.8), Math.min(ROAD_HALF - 0.8, newTarget));

// При агрессивном уходе увеличим скорость «реакции» (чтобы сглаживание не было слишком медленным)
bot.userData._lastAvoidTime = performance.now();
                        }
                    }
                }

                // На траве — почти полная остановка
                if (onGrass) {
                    bot.userData.speed = Math.max(bot.userData.maxSpeed * 0.05, bot.userData.speed - 0.12);
                } else {
                    // На трассе — разгон
                    bot.userData.speed = Math.min(
                        bot.userData.maxSpeed,
                        bot.userData.speed + acceleration * 0.9 * botThrottle
                    );
                    // Минимальная скорость на трассе
                    const botMinSpeed = bot.userData.maxSpeed * 0.55;
                    if (bot.userData.speed < botMinSpeed) bot.userData.speed = botMinSpeed;
                }

                // Импульс от столкновений — быстро затухает
                bot.userData.pushVelX = (bot.userData.pushVelX || 0) * 0.72;
                bot.userData.pushVelZ = (bot.userData.pushVelZ || 0) * 0.72;
                const maxPush = 0.12;
                bot.userData.pushVelX = Math.max(-maxPush, Math.min(maxPush, bot.userData.pushVelX));
                bot.userData.pushVelZ = Math.max(-maxPush, Math.min(maxPush, bot.userData.pushVelZ));
                bot.position.x += bot.userData.pushVelX;
                bot.position.z += bot.userData.pushVelZ;

                const forwardMove = new THREE.Vector3(0,0,1).applyQuaternion(bot.quaternion);
                if (raceActive) bot.position.addScaledVector(forwardMove, bot.userData.speed * 0.1);
            });
        }

        // Инициализация импульсов игрока (один раз)
        let playerVelX = 0, playerVelZ = 0;

        function checkCollisions() {
            if (countdownActive) return;
            const allCars = [playerCar, ...botCars];

            // Применяем и затухаем импульс игрока
            playerVelX *= 0.82;
            playerVelZ *= 0.82;
            playerCar.position.x += playerVelX;
            playerCar.position.z += playerVelZ;

            // Добавляем remote-машины в список для коллизий
            const remoteMeshes = Object.values(remotePlayers).map(rp => rp.mesh);
            const allCarsWithRemote = [...allCars, ...remoteMeshes];
            
            // Car vs Car physics
            for(let i=0; i<allCarsWithRemote.length; i++) {
                for(let j=i+1; j<allCars.length; j++) {
                    let car1 = allCars[i];
                    let car2 = allCars[j];
                    let dist = car1.position.distanceTo(car2.position);
                    if (dist < 1.6) {
                        let dir = new THREE.Vector3().subVectors(car1.position, car2.position).normalize();
                        let overlap = 1.6 - dist;

                        let spd1 = (car1 === playerCar) ? speed : (car1.userData.speed || car1.userData.remoteSpeed || 1.0);
                    let spd2 = (car2 === playerCar) ? speed : (car2.userData.speed || car2.userData.remoteSpeed || 1.0);
                        let relativeSpeed = Math.abs(spd1 - spd2) + (spd1 + spd2) * 0.3;
                        // Импульс — меньше чем раньше, применяется как скорость а не мгновенное смещение
                        let impulse = Math.min(0.18, overlap * 0.06 + relativeSpeed * 0.05);

                        // Вместо мгновенного сдвига — добавляем скорость (импульс)
                        if (car1 === playerCar) {
                            playerVelX += dir.x * impulse * (spd2 / (spd1 + spd2 + 0.01)) * 6;
                            playerVelZ += dir.z * impulse * (spd2 / (spd1 + spd2 + 0.01)) * 6;
                        } else {
                            car1.userData.pushVelX = (car1.userData.pushVelX || 0) + dir.x * impulse * (spd2 / (spd1 + spd2 + 0.01)) * 6;
                            car1.userData.pushVelZ = (car1.userData.pushVelZ || 0) + dir.z * impulse * (spd2 / (spd1 + spd2 + 0.01)) * 6;
                        }
                        if (car2 === playerCar) {
                            playerVelX -= dir.x * impulse * (spd1 / (spd1 + spd2 + 0.01)) * 6;
                            playerVelZ -= dir.z * impulse * (spd1 / (spd1 + spd2 + 0.01)) * 6;
                        } else {
                            car2.userData.pushVelX = (car2.userData.pushVelX || 0) - dir.x * impulse * (spd1 / (spd1 + spd2 + 0.01)) * 6;
                            car2.userData.pushVelZ = (car2.userData.pushVelZ || 0) - dir.z * impulse * (spd1 / (spd1 + spd2 + 0.01)) * 6;
                        }

                        // Разворот
                        let spinAmount = Math.min(0.25, relativeSpeed * 0.1);
                        if (car1 === playerCar) {
                            car1.rotation.y += (Math.random() - 0.5) * spinAmount;
                            speed *= Math.max(0.4, 1.0 - relativeSpeed * 0.18);
                        } else {
                            car1.rotation.y += (Math.random() - 0.5) * spinAmount * 0.5;
                            car1.userData.speed *= Math.max(0.5, 1.0 - relativeSpeed * 0.15);
                        }
                        if (car2 === playerCar) {
                            car2.rotation.y += (Math.random() - 0.5) * spinAmount;
                            speed *= Math.max(0.4, 1.0 - relativeSpeed * 0.18);
                        } else {
                            car2.rotation.y += (Math.random() - 0.5) * spinAmount * 0.5;
                            car2.userData.speed *= Math.max(0.5, 1.0 - relativeSpeed * 0.15);
                        }

                        if (car1 === playerCar || car2 === playerCar) {
                            let now = performance.now();
                            if (now - lastCrashTime > 800) {
                                playSound('crash');
                                lastCrashTime = now;
                            }
                        }
                    }
                }
            }

            // Coins
            coins.forEach(coin => {
                if (coin.userData.collected) return;
                // Вращение вокруг Y — монетка крутится
                coin.rotation.y += 0.04;
                const dist = playerCar.position.distanceTo(coin.position);
                if (dist < 1.4) {
                    coin.userData.collected = true;
                    scene.remove(coin);
                    playerCoins++;
                    document.getElementById('coinCount').innerText = playerCoins;
                    totalEarnedKSPT += safeGetOfflinePercent(0.4); 
                    playSound('coin', 880, 0.08);
                }
            });
        }

        // ========== ЛИДЕРБОРД И ПОЗИЦИИ ==========
        function updatePositions() {
            let racePositions = [];
            if (onlineMode) {
                // Онлайн: игрок + remote
                racePositions.push({ id: 'player', score: lap * 10 + (playerCar.userData.lastParam || 0) });
                Object.entries(remotePlayers).forEach(([uid, rp]) => {
                    const remLap = rp.remoteLap || 1;
                    const remParam = getClosestParam(rp.mesh.position, 0);
                    racePositions.push({ id: uid, score: remLap * 10 + remParam });
                });
            } else {
                const allCars = [playerCar, ...botCars];
                allCars.forEach((c, idx) => {
                    let score = c.userData.lap * 10 + c.userData.lastParam;
                    racePositions.push({ id: c.userData.isPlayer ? 'player' : `bot${idx}`, score });
                });
            }
            const total = racePositions.length;
            racePositions.sort((a,b) => b.score - a.score);
            let playerRank = racePositions.findIndex(p => p.id === 'player') + 1;
            const posDisplay = document.getElementById('posDisplay');
            if (posDisplay) posDisplay.innerText = `${playerRank}/${total}`;
            const posIndicator = document.getElementById('posIndicator');
            if (posIndicator) posIndicator.innerText = `${playerRank}/${total}`;
        }

        // ========== МИНИ-КАРТА ==========
        function initMinimap() {
            const mc = document.createElement('canvas');
            mc.width = 120; mc.height = 120;
            document.getElementById('miniMap').appendChild(mc);
            window.mmCtx = mc.getContext('2d');
        }

        function drawMinimap() {
            if (!window.mmCtx) return;
            const ctx = window.mmCtx;
            ctx.clearRect(0,0,120,120);
            ctx.save();
            ctx.translate(60,60);
            ctx.scale(0.29, 0.29);

            // Draw track
            ctx.beginPath();
            for(let i=0; i<=40; i++) {
                let p = roadCurve.getPointAt(i/40);
                if(i===0) ctx.moveTo(p.x, p.z);
                else ctx.lineTo(p.x, p.z);
            }
            ctx.strokeStyle = '#666'; ctx.lineWidth = 3; ctx.stroke();

            // Bots
            botCars.forEach(b => {
                ctx.fillStyle = '#' + b.userData.color.toString(16).padStart(6,'0');
                ctx.beginPath(); ctx.arc(b.position.x, b.position.z, 2, 0, Math.PI*2); ctx.fill();
            });

            // Player
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(playerCar.position.x, playerCar.position.z, 2.5, 0, Math.PI*2); ctx.fill();

            ctx.restore();
        }

        let finishOrder = []; // порядок финиша

        function endRace(winnerName) {
            if (raceFinished) return;

            const finishTime = (performance.now() - raceStartTime) / 1000;

            // ОНЛАЙН: отправляем свой финиш в Firebase и ждём остальных
            if (onlineMode) {
                if (!onlineFinishOrder.find(r => r.uid === myPlayerId)) {
                    onlineFinishOrder.push({ uid: myPlayerId, name: myPlayerName, time: finishTime, inactive: false });
                    // Публикуем финиш в Firebase
                    window._raceDB.ref('race_states/' + myRoomId + '/' + myPlayerId).update({
                        finished: true, finishTime: finishTime, name: myPlayerName
                    });
                    // Показываем сообщение ожидания
                    const cd = document.getElementById('countdownDisplay');
                    cd.style.display = 'block';
                    cd.style.fontSize = '22px';
                    cd.innerText = '🏁 Finished!\nWaiting for others...';
                    // Таймаут бездействия: 20 сек — принудительный финиш
                    onlineInactivityTimer = setTimeout(() => {
                        // Все кто не финишировал — inactive
                        Object.entries(remotePlayers).forEach(([uid, rp]) => {
                            if (!onlineFinishOrder.find(r => r.uid === uid)) {
                                onlineFinishOrder.push({ uid, name: rp.name || uid, time: null, inactive: true });
                            }
                        });
                        showOnlineResults();
                    }, 20000);
                    checkOnlineFinish();
                }
                return;
            }

            // БОТЫ: старая логика
            const allCars = [playerCar, ...botCars];
            const totalCars = allCars.length;

            if (!finishOrder.find(r => r.name === winnerName)) {
                finishOrder.push({ name: winnerName, time: finishTime });
            }

            if (finishOrder.length >= totalCars) {
                raceFinished = true;
                raceActive = false;
                raceResults = finishOrder.map(r => ({
                    name: r.name,
                    time: r.time,
                    coins: r.name === 'You' ? playerCoins : Math.floor(Math.random() * 10)
                }));
                displayGameOver();
                return;
            }

            // Если финишировал игрок — останавливаем его управление но продолжаем гонку
            if (winnerName === 'You') {
                raceActive = false; // игрок не двигается
                // Показываем промежуточное сообщение
                const cdElem = document.getElementById('countdownDisplay');
                cdElem.style.display = 'block';
                cdElem.style.fontSize = '24px';
                cdElem.innerText = `🏁 Finished! Waiting for others...`;
                playSound('finish');
            }
        }

        let raceStartTime;
        function startRace() {
            raceActive = true;
            raceStartTime = performance.now();
            countdownActive = false;
        }

        function displayGameOver() {
            const screen = document.getElementById('gameOverScreen');
            const leaderboardDiv = document.getElementById('finalLeaderboard');
            
            let html = '';
            raceResults.forEach((r, index) => {
                let place = index + 1;
                let medal = place === 1 ? '🥇' : place === 2 ? '🥈' : place === 3 ? '🥉' : `${place}.`;
                const timeStr = (r.time == null) ? '-' : r.time.toFixed(2) + 's';
                html += `<div class="leaderboard-entry">${medal} ${r.name} — ${timeStr} — ${r.coins} coins</div>`;
            });
            leaderboardDiv.innerHTML = html;
            document.getElementById('finalCoins').innerText = playerCoins;

            let ekReward = 0;
            let bonusPercent = 0;
            if (onlineMode) {
                const onlinePlayerCount = Object.keys(remotePlayers).length + 1; // +1 это сам игрок
                const ekEnabled = onlinePlayerCount >= 3;
                if (ekEnabled) {
                    if (raceResults[0]?.name === 'You') { ekReward = 1; totalEK = 1; }
                    else if (raceResults[1]?.name === 'You') { bonusPercent = 6; totalEK = 0; }
                }
            } else {
                // Боты: как раньше
                if (raceResults[0]?.name === 'You') { ekReward = 2; totalEK = 2; } 
                else if (raceResults[1]?.name === 'You') { ekReward = 1; totalEK = 1; } 
                else if (raceResults[2]?.name === 'You') { bonusPercent = 5; totalEK = 0; }
            }

            if (bonusPercent > 0) {
                totalEarnedKSPT += safeGetOfflinePercent(bonusPercent);
            }

            document.getElementById('earnedDisplay').innerText = `+${totalEarnedKSPT.toFixed(2)} KSPT`;
            document.getElementById('ekDisplay').innerText = `+${totalEK} EK`;

            if (totalEarnedKSPT > 0) safeAwardGameReward(totalEarnedKSPT);
            if (totalEK > 0) safeAwardGameEK(totalEK);

            screen.style.display = 'block';
        }

        function updateTimer() {
            if (gamePaused || countdownActive) return;
            // Таймер продолжает идти даже когда игрок финишировал (raceActive=false)
            // чтобы боты могли доехать. Но если гонка полностью завершена — стоп.
            if (raceFinished) return;
            if (!raceActive && finishOrder.length === 0) return; // не начата
            raceTime = (performance.now() - raceStartTime) / 1000;
            document.getElementById('timerDisplay').innerText = raceTime.toFixed(1) + 's';
        }

        function animate() {
            requestAnimationFrame(animate);

            // Обработка звука двигателя
            if (engineGain && engineOsc) {
                if (raceActive && !gamePaused) {
                    const targetFreq = 40 + speed * 50; // Адаптировано под новую скорость (макс 1.6 * 50 = 80 -> 120Hz)
                    const targetVol = (speed > 0.1) ? 0.03 + (speed / maxSpeed) * 0.07 : 0.01;
                    engineOsc.frequency.setTargetAtTime(targetFreq, audioContext.currentTime, 0.1);
                    engineGain.gain.setTargetAtTime(targetVol, audioContext.currentTime, 0.1);
                } else {
                    engineGain.gain.setTargetAtTime(0, audioContext.currentTime, 0.1);
                }
            }

            if (!gamePaused && !raceFinished) {
                updateTimer();
                updatePlayer();
                updateBots();
                checkCollisions();
                if (raceActive) updatePositions();
                
                // Сглаженное следование камеры
                const carPos = playerCar.position.clone();
                const offset = new THREE.Vector3(0, 3.5, -7.5).applyQuaternion(playerCar.quaternion);
                camera.position.lerp(carPos.clone().add(offset), 0.15);
                camera.lookAt(carPos.clone().add(new THREE.Vector3(0, 0, 3).applyQuaternion(playerCar.quaternion)));

                drawMinimap();
            updateRemotePlayers();
            // Медленное движение облаков
            if (window._clouds) {
                window._clouds.forEach((c, i) => {
                    c.position.x += 0.008 + i * 0.0008;
                    if (c.position.x > 200) c.position.x = -200;
                });
            }
        }
            renderer.render(scene, camera);
        }

        function initGame() {
            initOnlineSystem();
            initThree();
            generateTrack();
            initCars();
            spawnCoins();
            setupControls();
            initMinimap();

            raceActive = false;
            countdownActive = true;

            animate();

            // initGame вызывается только для ботов (и для онлайна — только после START)

            // Боты — запускаем отсчёт
            const cdElem = document.getElementById('countdownDisplay');
            cdElem.style.display = 'block';
            cdElem.innerText = '3';
            playSound('beep', 600, 0.2);
            setTimeout(() => { cdElem.innerText = '2'; playSound('beep', 600, 0.2); }, 1000);
            setTimeout(() => { cdElem.innerText = '1'; playSound('beep', 600, 0.2); }, 2000);
            setTimeout(() => {
                cdElem.innerText = 'GO!';
                playSound('beep', 1000, 0.4);
                startRace();
                setTimeout(() => cdElem.style.display = 'none', 1000);
            }, 3000);
        }

        document.getElementById('pauseBtn').addEventListener('click', () => {
            if (!raceActive && !gamePaused) return;
            gamePaused = !gamePaused;
            document.getElementById('pauseBtn').innerText = gamePaused ? 'Resume' : 'Pause';
        });

        document.getElementById('restartBtn').addEventListener('click', () => {
            if (!ensureHasTicketOrWarn()) return;
            try { (window.parent || window.top).postMessage({ type: 'kspt_new_round' }, '*'); } catch(e) {}
            location.reload();
        });

        document.getElementById('exitBtn').addEventListener('click', () => { cleanupOnline(); safeExitGame(); });
        document.getElementById('exitToMenuBtn').addEventListener('click', () => { cleanupOnline(); safeExitGame(); });
        document.getElementById('playAgainBtn').addEventListener('click', () => {
            if (!ensureHasTicketOrWarn()) return;
            try { (window.parent || window.top).postMessage({ type: 'kspt_new_round' }, '*'); } catch(e) {}
            location.reload();
        });

// ========================================================
// ========== ОНЛАЙН РЕЖИМ: ROOMS + SYNC ==================
// ========================================================

function initOnlineSystem() {
  const meta = getOnlinePlayerMeta();
  myPlayerId = meta.uid;
  myPlayerName = meta.name;
  myPlayerAvatar = meta.avatar;
}

// ----- ОТКРЫТЬ ЛОББИ -----
function openOnlineLobby() {
  document.getElementById('onlineLobby').style.display = 'block';
  document.getElementById('lobbyMain').style.display = 'block';
  document.getElementById('waitingRoom').style.display = 'none';
  loadRoomList();
}
function closeOnlineLobby() {
  document.getElementById('onlineLobby').style.display = 'none';
  if (roomsListener) {
    window._raceDB.ref('race_rooms').off('value', roomsListener);
    roomsListener = null;
  }
}

function closeOnlineLobbyAndCancel() {
  closeOnlineLobby();
  cleanupOnline();
  // Всегда просто выходим в меню — билет не потрачен
  safeExitGame();
}

// ----- СПИСОК КОМНАТ -----
function loadRoomList() {
  const listEl = document.getElementById('roomList');
  if (roomsListener) window._raceDB.ref('race_rooms').off('value', roomsListener);
  roomsListener = function(snap) {
    const rooms = snap.val();
    if (!rooms) { listEl.innerHTML = '<div style="color:#555;text-align:center;padding:20px;">No rooms yet. Create one!</div>'; return; }
    listEl.innerHTML = '';
    Object.entries(rooms).forEach(([rid, room]) => {
      if (!room || !room.players) return;
      const count = Object.keys(room.players).length;
      if (count >= 6 || room.started) return; // не показываем полные/начатые
      const card = document.createElement('div');
      card.className = 'room-card';
      card.innerHTML = `<div class="room-card-info">
        <div class="room-card-name">${escHtml(room.name || 'Room')}</div>
        <div class="room-card-count">${count}/6 players • Host: ${escHtml(room.hostName || '?')}</div>
      </div>
      <button class="room-join-btn" data-rid="${rid}">Join</button>`;
      card.querySelector('.room-join-btn').addEventListener('click', () => joinRoom(rid));
      listEl.appendChild(card);
    });
    if (!listEl.children.length) listEl.innerHTML = '<div style="color:#555;text-align:center;padding:20px;">No open rooms. Create one!</div>';
  };
  window._raceDB.ref('race_rooms').on('value', roomsListener);
}

function escHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ----- СОЗДАТЬ КОМНАТУ -----
function createRoom() {
  const name = document.getElementById('roomNameInput').value.trim() || 'Race Room';
  const rid = 'room_' + Date.now() + '_' + myPlayerId;
  myRoomId = rid;
  isHost = true;
  const myEntry = { uid: myPlayerId, name: myPlayerName, avatar: myPlayerAvatar, joinedAt: Date.now() };
  const roomData = {
    name: name,
    hostUid: myPlayerId,
    hostName: myPlayerName,
    started: false,
    createdAt: Date.now(),
    players: { [myPlayerId]: myEntry }
  };
  window._raceDB.ref('race_rooms/' + rid).set(roomData).then(() => {
    // Удаляем комнату при дисконнекте хоста
    window._raceDB.ref('race_rooms/' + rid).onDisconnect().remove();
    openWaitingRoom(rid);
  });
}

// ----- ПРИСОЕДИНИТЬСЯ К КОМНАТЕ -----
function joinRoom(rid) {
  myRoomId = rid;
  isHost = false;
  const myEntry = { uid: myPlayerId, name: myPlayerName, avatar: myPlayerAvatar, joinedAt: Date.now() };
  window._raceDB.ref('race_rooms/' + rid + '/players/' + myPlayerId).set(myEntry);
  // Удалить себя при дисконнекте
  window._raceDB.ref('race_rooms/' + rid + '/players/' + myPlayerId).onDisconnect().remove();
  openWaitingRoom(rid);
}

// ----- ПОКИНУТЬ КОМНАТУ -----
function leaveRoom() {
  if (!myRoomId) return;
  window._raceDB.ref('race_rooms/' + myRoomId + '/players/' + myPlayerId).remove();
  if (isHost) window._raceDB.ref('race_rooms/' + myRoomId).remove();
  if (roomListener) {
    window._raceDB.ref('race_rooms/' + myRoomId).off('value', roomListener);
    roomListener = null;
  }
  myRoomId = null;
  isHost = false;
  document.getElementById('waitingRoom').style.display = 'none';
  document.getElementById('lobbyMain').style.display = 'block';
  loadRoomList();
}

// ----- ВЫГНАТЬ ИГРОКА (только для хоста) -----
function kickPlayer(uid) {
  if (!isHost || !myRoomId) return;
  window._raceDB.ref('race_rooms/' + myRoomId + '/players/' + uid).remove();
}

// ----- ОЖИДАНИЕ В КОМНАТЕ -----
function openWaitingRoom(rid) {
  document.getElementById('lobbyMain').style.display = 'none';
  document.getElementById('waitingRoom').style.display = 'block';

  if (roomsListener) { window._raceDB.ref('race_rooms').off('value', roomsListener); roomsListener = null; }

  if (roomListener) window._raceDB.ref('race_rooms/' + rid).off('value', roomListener);

  roomListener = function(snap) {
    const room = snap.val();
    if (!room) { // комната удалена
      leaveRoom();
      closeOnlineLobby();
      return;
    }
    // Обновить имя
    document.getElementById('waitingRoomName').textContent = room.name || 'Room';
    const players = room.players ? Object.values(room.players) : [];
    document.getElementById('waitingCount').textContent = players.length;
    // Рендер слотов
    const slotList = document.getElementById('playerSlotList');
    slotList.innerHTML = '';
    players.forEach(p => {
      const isMe = p.uid === myPlayerId;
      const div = document.createElement('div');
      div.className = 'player-slot';
      div.innerHTML = `<img src="${escHtml(p.avatar || 'seri.png')}" onerror="this.src='seri.png'">
        <div><div class="player-slot-name">${escHtml(p.name || 'Player')}${isMe ? ' <span class="player-slot-you">(you)</span>' : ''}</div></div>`;
      if (isHost && !isMe) {
        const kb = document.createElement('button');
        kb.className = 'kick-btn';
        kb.textContent = '✕ Kick';
        kb.addEventListener('click', () => kickPlayer(p.uid));
        div.appendChild(kb);
      }
      slotList.appendChild(div);
    });
    // Показываем кнопку старта только хосту
    document.getElementById('startRaceOnlineBtn').style.display = isHost ? 'block' : 'none';
    document.getElementById('waitingStatusMsg').style.display = isHost ? 'none' : 'block';
    // Если kicked — меня нет в players
    const stillIn = players.some(p => p.uid === myPlayerId);
    if (!stillIn) {
      leaveRoom();
      closeOnlineLobby();
      alert('You have been kicked from the room.');
      safeExitGame();
    }
    // Стартовать гонку если хост нажал
    if (room.started && !onlineMode) startOnlineRace(room);
  };
  window._raceDB.ref('race_rooms/' + rid).on('value', roomListener);
}

// ----- ХОСТ НАЖИМАЕТ СТАРТ -----
function hostStartRace() {
  if (!isHost || !myRoomId) return;
  window._raceDB.ref('race_rooms/' + myRoomId + '/players').once('value', snap => {
    const count = snap.val() ? Object.keys(snap.val()).length : 0;
    if (count < 2) {
      const msg = document.getElementById('waitingStatusMsg');
      msg.style.display = 'block';
      msg.style.color = '#ff4081';
      msg.textContent = '⚠️ Need at least 2 players to start!';
      setTimeout(() => {
        msg.style.color = '#aaa';
        msg.textContent = 'Waiting for host to start...';
        msg.style.display = 'none';
      }, 2500);
      return;
    }
    window._raceDB.ref('race_rooms/' + myRoomId).update({ started: true, startedAt: Date.now(), playerCount: count });
  });
}

// ----- НАЧАТЬ ОНЛАЙН ГОНКУ (вызывается у всех) -----
function startOnlineRace(room) {
  onlineMode = true;
  closeOnlineLobby();

  if (!window.__gameInited) {
    window.__gameInited = true;
    // Списываем билет только сейчас
    safeConsumeTicket();
    initGame();
    raceActive = false;
    countdownActive = true;
  }
  document.getElementById('gameButtonsRow').style.display = 'none';

  // Запускаем отсчёт 3-2-1-GO для всех
  const cdElem = document.getElementById('countdownDisplay');
  cdElem.style.display = 'block';
  cdElem.innerText = '3'; playSound('beep', 600, 0.2);
  setTimeout(() => { cdElem.innerText = '2'; playSound('beep', 600, 0.2); }, 1000);
  setTimeout(() => { cdElem.innerText = '1'; playSound('beep', 600, 0.2); }, 2000);
  setTimeout(() => {
    cdElem.innerText = 'GO!'; playSound('beep', 1000, 0.4);
    startRace();
    setTimeout(() => cdElem.style.display = 'none', 1000);
  }, 3000);
  // Получить список игроков кроме себя
  const players = room.players ? Object.values(room.players) : [];
  onlineTotalPlayers = players.length;
  onlineFinishOrder = [];
  onlineFinishShown = false;
  // Убрать ботов — они больше не нужны
  botCars.forEach(c => scene.remove(c));
  botCars = [];
  // Создать remote-машины для других
  players.forEach((p, idx) => {
    if (p.uid === myPlayerId) return;
    const color = carColors[(idx + 1) % carColors.length];
    const startPos = roadCurve.getPointAt(0.01);
    const dir = roadCurve.getTangentAt(0.01);
    const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0,1,0)).normalize();
    const offset = (idx % 3) - 1;
    const mesh = createCar(color, startPos.clone().add(right.clone().multiplyScalar(offset * 1.4)), false);
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), dir);
    scene.add(mesh);
    // Создать HTML метку
    const label = document.createElement('div');
    label.className = 'remote-label';
    label.innerHTML = `<img src="${escHtml(p.avatar||'seri.png')}" onerror="this.src='seri.png'"><span>${escHtml(p.name||'Player')}</span>`;
    document.querySelector('.canvas-wrapper').appendChild(label);
    remotePlayers[p.uid] = {
      mesh,
      label,
      // Интерполяция
      targetX: startPos.x, targetZ: startPos.z, targetRot: 0,
      currentX: startPos.x, currentZ: startPos.z, currentRot: 0
    };
  });
  // Слушать состояния других игроков
  function applyRemoteState(uid, data) {
    if (!data || uid === myPlayerId) return;
    if (remotePlayers[uid]) {
      remotePlayers[uid].targetX = data.x;
      remotePlayers[uid].targetZ = data.z;
      remotePlayers[uid].targetRot = data.rotation;
      remotePlayers[uid].remoteSpeed = data.speed || 0;
      remotePlayers[uid].remoteLap = data.lap || 1;
      remotePlayers[uid].lastUpdateTime = Date.now();
      // Финиш онлайн-игрока
      if (data.finished && !remotePlayers[uid].finished) {
        remotePlayers[uid].finished = true;
        onlinePlayerFinished(uid, data.finishTime, data.name);
      }
    }
  }
  window._raceDB.ref('race_states/' + myRoomId).on('child_changed', snap => applyRemoteState(snap.key, snap.val()));
  window._raceDB.ref('race_states/' + myRoomId).on('child_added',   snap => applyRemoteState(snap.key, snap.val()));
  // Отправлять своё состояние ~5 раз в секунду
  onlineSendInterval = setInterval(sendMyState, 200);
}

// ----- ОТПРАВИТЬ СВОЁ СОСТОЯНИЕ -----
function sendMyState() {
  if (!onlineMode || !myRoomId) return;
  const state = {
    x: Math.round(playerCar.position.x * 100) / 100,
    z: Math.round(playerCar.position.z * 100) / 100,
    rotation: Math.round(playerCar.rotation.y * 1000) / 1000,
    speed: Math.round(speed * 100) / 100,
    lap: lap,
    coins: playerCoins,
    name: myPlayerName,
    t: Date.now()
  };
  window._raceDB.ref('race_states/' + myRoomId + '/' + myPlayerId).set(state);
}

// ----- ОНЛАЙН ФИНИШ -----
let onlineFinishOrder = []; // { uid, name, time, inactive }
let onlineTotalPlayers = 0;
let onlineInactivityTimer = null;
let onlineFinishShown = false;
let myLastMoveTime = Date.now();
let myLastPos = { x: 0, z: 0 };

function onlinePlayerFinished(uid, finishTime, name) {
  if (onlineFinishOrder.find(r => r.uid === uid)) return;
  onlineFinishOrder.push({ uid, name: name || uid, time: finishTime, inactive: false });
  checkOnlineFinish();
}

function checkOnlineFinish() {
  if (onlineFinishShown) return;
  const total = onlineTotalPlayers || Object.keys(remotePlayers).length + 1;
  if (onlineFinishOrder.length >= total) {
    showOnlineResults();
  }
}

function showOnlineResults() {
  if (onlineFinishShown) return;
  onlineFinishShown = true;
  raceFinished = true;
  raceActive = false;
  if (onlineInactivityTimer) { clearTimeout(onlineInactivityTimer); onlineInactivityTimer = null; }

  // Сортируем: inactive в конец, остальные по времени
  onlineFinishOrder.sort((a, b) => {
    if (a.inactive && !b.inactive) return 1;
    if (!a.inactive && b.inactive) return -1;
    return a.time - b.time;
  });

  // Формируем raceResults для displayGameOver
  raceResults = onlineFinishOrder.map((r, i) => ({
    name: r.name,
    time: r.inactive ? null : r.time,
    coins: r.uid === myPlayerId ? playerCoins : 0
  }));
  displayGameOver();
}

// ----- ИНТЕРПОЛЯЦИЯ REMOTE МАШИН (вызывается в animate) -----
function updateRemotePlayers() {
  if (!onlineMode) return;
  const canvas = document.getElementById('gameCanvas');
  const rect = canvas.getBoundingClientRect();
  const now = Date.now();

  Object.values(remotePlayers).forEach(rp => {
    // Экстраполяция: предсказываем позицию на основе скорости
    const dt = Math.min(0.3, (now - (rp.lastUpdateTime || now)) / 1000);
    if (rp.remoteSpeed && rp.remoteSpeed > 0.01) {
      const fwd = new THREE.Vector3(
        Math.sin(rp.targetRot),
        0,
        Math.cos(rp.targetRot)
      );
      rp.targetX += fwd.x * rp.remoteSpeed * 0.1 * dt * 60 * 0.5;
      rp.targetZ += fwd.z * rp.remoteSpeed * 0.1 * dt * 60 * 0.5;
    }

    // Быстрая интерполяция к предсказанной позиции
    const alpha = 0.35;
    rp.currentX += (rp.targetX - rp.currentX) * alpha;
    rp.currentZ += (rp.targetZ - rp.currentZ) * alpha;

    let dRot = rp.targetRot - rp.currentRot;
    while (dRot > Math.PI) dRot -= Math.PI * 2;
    while (dRot < -Math.PI) dRot += Math.PI * 2;
    rp.currentRot += dRot * 0.3;

    rp.mesh.position.x = rp.currentX;
    rp.mesh.position.z = rp.currentZ;
    rp.mesh.rotation.y = rp.currentRot;

    // Обновить позицию HTML-метки (проекция 3D→2D)
    const pos3d = new THREE.Vector3(rp.currentX, 1.5, rp.currentZ);
    pos3d.project(camera);
    if (pos3d.z > 1) { rp.label.style.display = 'none'; return; } // за камерой
    const px = (pos3d.x * 0.5 + 0.5) * rect.width + rect.left;
    const py = (-pos3d.y * 0.5 + 0.5) * rect.height + rect.top;
    rp.label.style.display = 'block';
    rp.label.style.left = px + 'px';
    rp.label.style.top = py + 'px';
  });
}

// ----- ОЧИСТИТЬ ОНЛАЙН при выходе -----
function cleanupOnline() {
  if (onlineSendInterval) { clearInterval(onlineSendInterval); onlineSendInterval = null; }
  if (myRoomId) {
    window._raceDB.ref('race_states/' + myRoomId).off();
    window._raceDB.ref('race_rooms/' + myRoomId + '/players/' + myPlayerId).remove();
    if (isHost) window._raceDB.ref('race_rooms/' + myRoomId).remove();
    window._raceDB.ref('race_states/' + myRoomId + '/' + myPlayerId).remove();
  }
  if (roomListener) { window._raceDB.ref('race_rooms/' + myRoomId).off('value', roomListener); roomListener = null; }
  Object.values(remotePlayers).forEach(rp => {
    scene.remove(rp.mesh);
    if (rp.label && rp.label.parentNode) rp.label.parentNode.removeChild(rp.label);
  });
  remotePlayers = {};
  onlineMode = false;
  myRoomId = null;
}

// ===== СОБЫТИЯ ЛОББИ =====
        document.getElementById('lobbyBackBtn').addEventListener('click', closeOnlineLobbyAndCancel);
        document.getElementById('createRoomBtn').addEventListener('click', createRoom);
        document.getElementById('leaveRoomBtn').addEventListener('click', () => { closeOnlineLobbyAndCancel(); });
        document.getElementById('startRaceOnlineBtn').addEventListener('click', hostStartRace);

        // НЕ запускаем initGame при load — ждём postMessage с режимом
        // Fallback: если открыт напрямую без iframe — запускаем ботов
        window.addEventListener('load', () => {
            setTimeout(() => {
                if (!window.__gameInited && window.__raceMode !== 'online') {
                    window.__gameInited = true;
                    window.__raceMode = 'bots';
                    initGame();
                }
            }, 2000);
        });

        // ========== АДАПТАЦИЯ ==========
        (function(){
            const BASE_W = 360;
            const BASE_H = 360;
            function fitGameUI() {
                const header = document.querySelector('.game-header');
                const headerH = header ? header.getBoundingClientRect().height : 0;
                const availW = window.innerWidth;
                const availH = window.innerHeight - headerH - 12;
                const scale = Math.min(availW / BASE_W, availH / (BASE_H + 200));
                const canvas = document.getElementById('gameCanvas');
                if (canvas) {
                    canvas.style.width = Math.round(BASE_W * scale) + 'px';
                    canvas.style.height = Math.round(BASE_H * scale) + 'px';
                }
                const joystick = document.getElementById('joystickArea');
                if (joystick) {
                    const size = Math.max(50, Math.round(120 * scale));
                    joystick.style.width = size + 'px';
                    joystick.style.height = size + 'px';
                }
                const gasPedal = document.getElementById('gasPedal');
                if (gasPedal) {
                    const size = Math.max(40, Math.round(80 * scale));
                    gasPedal.style.width = size + 'px';
                    gasPedal.style.height = size + 'px';
                    gasPedal.style.fontSize = (size*0.2) + 'px';
                }
            }
            window.addEventListener('resize', fitGameUI);
            window.addEventListener('orientationchange', () => setTimeout(fitGameUI, 120));
            window.addEventListener('load', fitGameUI);
        })();
    </script>
</body>
