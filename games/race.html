        html, body { padding: 0; margin: 0; background: #000; color: #fff; font-family: Arial, sans-serif; overflow: hidden; height: 100%; width: 100%; touch-action: manipulation; }
        .game-container { display: flex; flex-direction: column; align-items: center; height: 100vh; padding: 10px; background: linear-gradient(135deg, var(--panel) 0%, #1a1a1a 100%); position: relative; }
        .game-header { display: flex; justify-content: space-between; width: 100%; margin-bottom: 10px; padding: 10px; background: rgba(0,0,0,0.45); border-radius: 10px; border: 1px solid var(--accent); }

        .game-stats { display: flex; gap: 15px; font-size: 14px; flex-wrap: wrap; }
        .canvas-wrapper { position: relative; width: 100%; display: flex; justify-content: center; align-items: center; }
        #gameCanvas { width: min(100%, 360px); height: auto; aspect-ratio: 1/1; border: 2px solid var(--accent); border-radius: 10px; display: block; background: #000; }
        /* Мини-карта и overlay */
        .mini-map { position: absolute; bottom: 10px; left: 10px; width: 120px; height: 120px; background: rgba(0,0,0,0.5); border: 1px solid var(--accent); border-radius: 10px; overflow: hidden; }

        /* Отсчёт */
        #countdownDisplay { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 80px; font-weight: bold; color: var(--accent-2); text-shadow: 0 0 20px #000, 0 0 10px var(--accent-2); z-index: 50; pointer-events: none; }
        /* Джойстик и педаль */
        .controls-row { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 15px; width: 100%; }
        .joystick-container { position: relative; width: 120px; height: 120px; }
        .joystick-bg { width: 100%; height: 100%; background: rgba(0,188,212,0.08); border-radius: 50%; border: 2px solid var(--accent); }
        .joystick-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 40px; height: 40px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 10px rgba(0,188,212,0.5); transition: transform 0.05s; }
        .gas-pedal { width: 80px; height: 80px; background: linear-gradient(135deg, #00e5ff, #00bcd4); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000; border: 2px solid var(--accent-2); box-shadow: 0 0 15px var(--accent-2); touch-action: manipulation; cursor: pointer; user-select: none; }

    <script type="module">
        import * as THREE from 'three';

        // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========
        function getLocalTicketCount() {
            try {
                const raw = localStorage.getItem('kspt_tickets');
                if (!raw) return null;
                const data = JSON.parse(raw);
                if (data && typeof data.current === 'number') return data.current;
                if (data && data.current != null) return Number(data.current) || 0;
            } catch (e) { return null; }
            return null;
        }

        function ensureHasTicketOrWarn() {
            const c = getLocalTicketCount();
            if (c === null) return true;
            if (c <= 0) {
                try { (window.parent || window.top).postMessage({ type: 'kspt_no_tickets' }, '*'); } catch(e){}
                alert("Not enough tickets!");
                return false;
            }
            return true;
        }

        function isSameOrigin(win) { try { void win.location.href; return true; } catch (e) { return false; } }

        window.__kspt_hourly = window.__kspt_hourly || 0;

        window.addEventListener('message', (ev) => {
            const msg = ev.data;
            if (!msg || typeof msg !== 'object') return;
            if (msg.type === 'kspt_init') {
                window.__kspt_hourly = Number(msg.hourly) || 0;
                if (msg.tgUser) window.__tgUser = msg.tgUser;
                window.__raceMode = msg.raceMode || 'bots';
                if (window.__raceMode === 'online') {
                    // Только лобби — Three.js не запускается, билет не тратится
                    initOnlineSystem();
                    openOnlineLobby();
                } else {
                    if (!window.__gameInited) {
                        window.__gameInited = true;
                        initGame();
                    }
                }
            }
            if (msg.type === 'kspt_hourly_update') {
                window.__kspt_hourly = Number(msg.hourly) || 0;
            }
        });

        function safeGetOfflinePercent(percent) {
            try {
                if (typeof window.__kspt_hourly === 'number') {
                    return Math.round((window.__kspt_hourly * (percent/100)) * 100) / 100;
                }
            } catch(e) {}
            return 0;
        }

        function safeAwardGameReward(amount, x = 0, y = 0) {
            try {
                if (window.top && window.top !== window && isSameOrigin(window.top) && typeof window.top.awardGameReward === 'function') {
                    window.top.awardGameReward(Number(amount) || 0, x, y);
                    return;
                }
            } catch (e) {}
            try {
                (window.parent || window.top).postMessage({ type: 'kspt_award_reward', reward: Number(amount) || 0, x, y }, '*');
            } catch (e) {}
        }

        function safeAwardGameEK(amount, x = 0, y = 0) {
            try {
                if (window.top && window.top !== window && isSameOrigin(window.top) && typeof window.top.awardGameEK === 'function') {
                    window.top.awardGameEK(Number(amount) || 0, x, y); return;
                }
            } catch(e) {}
            try {
                (window.parent || window.top).postMessage({ type: 'ek_award', amount: Number(amount)||0, x, y }, '*');
            } catch(e) {}
        }

        function safeConsumeTicket() {
            try {
                if (window.top && window.top !== window && isSameOrigin(window.top) && typeof window.top.consumeTicketForCurrentGame === 'function') {
                    window.top.consumeTicketForCurrentGame(); return;
                }
            } catch (e) {}
            try { (window.parent || window.top).postMessage({ type: 'kspt_consume_ticket' }, '*'); } catch (e) {}
        }

        function safeExitGame() {
            try {
                if (window.top && window.top !== window && isSameOrigin(window.top) && typeof window.top.exitGame === 'function') {
                    window.top.exitGame(); return;
                }
            } catch (e) {}
            try { (window.parent || window.top).postMessage({ type: 'kspt_exit_game' }, '*'); } catch (e) {}
        }

// ========== ОНЛАЙН: ВСПОМОГАТЕЛЬНЫЕ ==========
function getOnlineUid() {
  return String(window.Telegram?.WebApp?.initDataUnsafe?.user?.id || localStorage.getItem('_kspt_uid') || 'local_' + Date.now());
}
function getOnlinePlayerMeta() {

        // ========== АУДИО ==========
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        let userInteracted = false;
        let engineOsc, engineGain;

        function unlockAudio() { 
            if (audioContext.state === 'suspended') audioContext.resume(); 
            userInteracted = true; 
            if (!engineOsc) {
                engineOsc = audioContext.createOscillator();
                engineGain = audioContext.createGain();
                engineOsc.type = 'sawtooth'; 
                engineOsc.connect(engineGain);
                engineGain.connect(audioContext.destination);
                engineOsc.frequency.value = 40;
                engineGain.gain.value = 0;
                engineOsc.start();
            }
        }
        document.addEventListener('touchstart', unlockAudio, { once: true });
        document.addEventListener('mousedown', unlockAudio, { once: true });
        document.addEventListener('keydown', unlockAudio, { once: true });

        function playSound(type, freq = 440, duration = 0.1) {
            if (!userInteracted || audioContext.state === 'suspended') return;
            try {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.type = 'sine';
                let vol = 0.1;
                
                if (type === 'coin') { freq = 880; duration = 0.08; vol = 0.08; }
                else if (type === 'crash') { 
                    duration = 0.3; 
                    osc.type = 'sine'; 
                    vol = 0.3; 
                    // Мягкий, басистый звук удара
                    osc.frequency.setValueAtTime(120, audioContext.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(30, audioContext.currentTime + duration);
                    freq = 120; // fallback
                }
                else if (type === 'beep') {
                    osc.type = 'sine';
                    vol = 0.15;
                    // freq is passed from the args
                }
                else if (type === 'finish') { freq = 523.25; duration = 0.5; vol = 0.15; }
                
                if (type !== 'crash') {
                    osc.frequency.value = freq;
                }
                
                gain.gain.setValueAtTime(vol, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);
                osc.start();
                osc.stop(audioContext.currentTime + duration);
            } catch (e) {}
        }

        // ========== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==========

let onlineMode = false;          // true когда играем онлайн

let myPlayerId = null;           // uid игрока

        // ========== ГЕНЕРАТОРЫ ТЕКСТУР (Canvas) ==========
        function createNoiseTexture(baseColor, noiseColor, width=256, height=256) {
            const c = document.createElement('canvas'); c.width = width; c.height = height;
            const ctx = c.getContext('2d');
            ctx.fillStyle = baseColor; ctx.fillRect(0,0,width,height);
            for(let i=0; i<width*height/8; i++) {
                ctx.fillStyle = noiseColor;
                ctx.globalAlpha = Math.random() * 0.4 + 0.1;
                ctx.fillRect(Math.random()*width, Math.random()*height, 2, 2);
            }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        // ========== ИНИЦИАЛИЗАЦИЯ THREE.JS ==========
        function initThree() {
            const canvas = document.getElementById('gameCanvas');
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
            renderer.setSize(360, 360);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0xaaccee, 60, 250);

            // ===== ОБЛАКА =====
            function createCloud(x, y, z) {
                const group = new THREE.Group();
                const mat = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0.82,
                    roughness: 1.0,
                    metalness: 0.0
                });
                const puffs = [
                    [0, 0, 0, 1.0],
                    [1.2, 0.2, 0, 0.8],
                    [-1.1, 0.1, 0, 0.75],
                    [0.4, 0.6, 0, 0.65],
                    [-0.3, 0.5, 0.3, 0.55],
                    [0.9, -0.1, 0.4, 0.6]
                ];
                puffs.forEach(([px, py, pz, r]) => {
                    const geo = new THREE.SphereGeometry(r, 7, 5);
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.position.set(px, py, pz);
                    group.add(mesh);
                });
                group.position.set(x, y, z);
                const s = 3.5 + Math.random() * 3;
                group.scale.set(s, s * 0.55, s * 0.7);
                scene.add(group);
                return group;
            }

            window._clouds = [];
            const cloudPositions = [
                [-60, 28, -80], [40, 32, -90], [100, 25, -60],
                [-100, 30, 20], [80, 35, 60], [-40, 27, 90],
                [0, 33, -120], [130, 28, -20], [-120, 31, -50],
                [60, 30, 120], [-80, 26, 110], [20, 36, -150],
                [-150, 29, 30], [150, 27, 70], [-30, 34, -180]
            ];
            cloudPositions.forEach(([x, y, z]) => {
                window._clouds.push(createCloud(x, y, z));
            });

            camera = new THREE.PerspectiveCamera(65, 1, 0.1, 1000);
            camera.position.set(0, 5, -10);

            const ambientLight = new THREE.AmbientLight(0x505070);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfff5d1, 1.2);
            sunLight.position.set(20, 40, 10);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 1024;
            sunLight.shadow.mapSize.height = 1024;
            sunLight.shadow.camera.left = -120;
            sunLight.shadow.camera.right = 120;
            sunLight.shadow.camera.top = 120;
            sunLight.shadow.camera.bottom = -120;
            sunLight.shadow.camera.near = 1;
            sunLight.shadow.camera.far = 100;
            scene.add(sunLight);

            const sunSphere = new THREE.Mesh(
                new THREE.SphereGeometry(2, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0xffddaa })
            );

            scene.add(sunSphere);
