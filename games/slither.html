.radar{

.radar::before{
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;

    rgba(0,188,212,0.05),
    rgba(0,230,118,0.12),
    rgba(0,188,212,0.05)
  );

@keyframes radar-scan{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}

<script>
/* ===== helper: проверка билетов (localStorage) ===== */
function getLocalTicketCount() {
  try {
    const raw = localStorage.getItem('kspt_tickets');
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (data && typeof data.current === 'number') return data.current;
    // иногда структура была { current: N } или { current: "N" }
    if (data && data.current != null) return Number(data.current) || 0;
  } catch (e) {
    // если iframe cross-origin — не можем прочитать, вернём null (не мешаем)
    return null;
  }
  return null;
}

function ensureHasTicketOrWarn() {
  const c = getLocalTicketCount();
  if (c === null) {
    // не можем проверить — разрешаем рестарт (родитель может контролировать)
    return true;
  }
  if (c <= 0) {
    // если есть postMessage handler — сообщим родителю
    try { (window.parent || window.top).postMessage({ type: 'kspt_no_tickets' }, '*'); } catch(e){}
    // локальное сообщение / тост
    try { showToast && showToast("Not enough tickets!"); } catch(e){ alert("Not enough tickets!"); }
    return false;
  }
  return true;
}

/* ========== SAFE HOST HELPERS ========== */
function isSameOrigin(win) {
  try { void win.location.href; return true; } catch (e) { return false; }
}

// Внутри игры
window.__kspt_hourly = window.__kspt_hourly || 0;

window.addEventListener('message', (ev) => {
  const msg = ev.data;
  if (!msg || typeof msg !== 'object') return;

  if (msg.type === 'kspt_init' || msg.type === 'kspt_hourly_update') {
    const h = Number(msg.hourly) || 0;
    window.__kspt_hourly = h;
  }

  if (msg.type === 'kspt_no_tickets') {
  gameRunning = false;
  gamePaused = true;

  // показываем Game Over экран
  const gos = document.getElementById('gameOverScreen');
  if (gos) gos.style.display = 'block';

  alert("Not enough tickets!");
}

  if (msg.type === 'kspt_parent_set_game_over' && msg.blockButtons) {
    document.getElementById('pauseBtn')?.setAttribute('disabled','true');
    document.getElementById('restartBtn')?.setAttribute('disabled','true');
    document.getElementById('exitBtn')?.setAttribute('disabled','true');
  }
});

function safeGetOfflinePercent(percent) {
  try {
    if (typeof HOST !== 'undefined' && HOST !== window && typeof HOST.getOfflinePercent === 'function') {
      return Number(HOST.getOfflinePercent(percent)) || 0;
    }
  } catch (e) { /* ignore */ }

  if (typeof window.__kspt_hourly === 'number') {
    return Math.round((window.__kspt_hourly * (percent/100)) * 100) / 100;
  }

  try {
    const raw = localStorage.getItem('kspt_data') || localStorage.getItem('d') || null;
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed.offlineHourly === 'number') {
        return Math.round((parsed.offlineHourly * (percent/100)) * 100) / 100;
      }
    }
  } catch(e) {}

  return 0;
}

function safeAwardGameReward(amount, x = 0, y = 0) {
  try {
    if (window.top && window.top !== window && isSameOrigin(window.top) && typeof window.top.awardGameReward === 'function') {
      window.top.awardGameReward(Number(amount) || 0, x, y);
      return;
    }
  } catch (e) { console.warn('safeAwardGameReward direct call failed', e); }

  try {
    (window.parent || window.top).postMessage({ type: 'kspt_award_reward', reward: Number(amount) || 0, x, y }, '*');
    return;
  } catch (e) { console.warn('safeAwardGameReward postMessage failed', e); }

  console.log('Local reward fallback', amount, x, y);
}

function safeAwardGameEK(amount, x = 0, y = 0) {
  try {
    if (window.top && window.top !== window && isSameOrigin(window.top) && typeof window.top.awardGameEK === 'function') {
      window.top.awardGameEK(Number(amount) || 0, x, y); return;
    }
  } catch(e) {}
  try {
    (window.parent || window.top).postMessage({ type: 'ek_award', amount: Number(amount)||0, x, y }, '*'); return;
  } catch(e){}
  console.log('Local EK fallback', amount, x, y);
}

function safeConsumeTicket() {
  try {
    if (window.top && window.top !== window && isSameOrigin(window.top) && typeof window.top.consumeTicketForCurrentGame === 'function') {
      window.top.consumeTicketForCurrentGame();
      return;
    }
  } catch (e) { console.warn('safeConsumeTicket direct call failed', e); }

  console.log('consumeTicket fallback (no parent handler)');
}

function safeExitGame() {

}

// Аудио система
const audioContext = new (window.AudioContext || window.webkitAudioContext)();
let userInteracted = false;

function markUserInteracted() {
  userInteracted = true;
  if (audioContext.state === 'suspended') audioContext.resume();
}

function playSound(type, frequency = 440, duration = 0.1) {
  if (!userInteracted || audioContext.state === 'suspended') return;
  
  try {
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();
    
    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);
    
    let freq = frequency;
    let dur = duration;
    let vol = 0.1;
    
    switch(type) {
      case 'orb': freq = 523.25; dur = 0.05; vol = 0.08; break;
      case 'boost': freq = 659.25; dur = 0.15; vol = 0.12; break;
      case 'crash': freq = 220; dur = 0.3; vol = 0.15; break;
      case 'kill': freq = 880; dur = 0.2; vol = 0.12; break;
      case 'grow': freq = 349.23; dur = 0.1; vol = 0.08; break;
    }
    
    oscillator.frequency.value = freq;
    oscillator.type = 'sine';
    
    gainNode.gain.setValueAtTime(vol, audioContext.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + dur);
    
    oscillator.start(audioContext.currentTime);
    oscillator.stop(audioContext.currentTime + dur);
  } catch (e) {
    console.warn('Sound error:', e);
  }
}

function gameVibrate(pattern) {
  if (!userInteracted || !('vibrate' in navigator)) return;
  try {
    navigator.vibrate(pattern);
  } catch (e) {
    console.warn('Vibration failed:', e);
  }
}

function generatePlayerSegments() {
    player.segments = [];

/* ========== ДЖОЙСТИК ========== */
function setupJoystick() {
    const joystick = document.getElementById('joystickArea');
    const knob = joystick.querySelector('.joystick-center');
    const maxRadius = 45;
    let isActive = false;
    let startX = 0;
    let startY = 0;

    function resetKnob() {
        knob.style.transition = 'transform 0.15s ease';
        knob.style.transform = 'translate(-50%, -50%)';
        setTimeout(() => knob.style.transition = '', 150);
        joystickActive = false;
        joystickPower = 0;
    }

    function processMove(clientX, clientY) {
        moveKnob(clientX, clientY, startX, startY, knob, maxRadius);
        handleJoystickMove(clientX, clientY, startX, startY);
    }

    function moveKnob(clientX, clientY, startX, startY, knob, maxRadius) {
        let dx = clientX - startX;
        let dy = clientY - startY;

        const dist = Math.hypot(dx, dy);
        if (dist > maxRadius) {
            dx = (dx / dist) * maxRadius;
            dy = (dy / dist) * maxRadius;
        }

        knob.style.transform = `translate(-50%, -50%) translate(${dx}px, ${dy}px)`;

        joystickPower = Math.min(1, dist / maxRadius);
        joystickAngle = Math.atan2(dy, dx);
        joystickActive = joystickPower > 0.1;
    }

    function handleJoystickMove(clientX, clientY, startX, startY) {
        if (!gameRunning || gamePaused || player.isDead) return;
        
        const dx = clientX - startX;
        const dy = clientY - startY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        if (dist > 10) {
            joystickAngle = Math.atan2(dy, dx);
            joystickActive = true;
        }
    }

    // Touch events
    joystick.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const t = e.touches[0];
        startX = t.clientX;
        startY = t.clientY;
        isActive = true;
        joystickActive = true;
        markUserInteracted();
    });

    joystick.addEventListener('touchmove', (e) => {
        if (!isActive) return;
        const t = e.touches[0];
        processMove(t.clientX, t.clientY);
    });

    joystick.addEventListener('touchend', () => {
        isActive = false;
        resetKnob();
    });

// Управление пальцем по canvas
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const t = e.changedTouches[0];
        canvas._touchStartX = t.clientX;
        canvas._touchStartY = t.clientY;
        canvas._touchActive = t.identifier;
        markUserInteracted();
    }, {passive: false});

    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        for(const t of e.changedTouches) {
            if(t.identifier !== canvas._touchActive) continue;
            const dx = t.clientX - canvas._touchStartX;
            const dy = t.clientY - canvas._touchStartY;
            const dist = Math.sqrt(dx*dx+dy*dy);
            if(dist > 8 && gameRunning && !gamePaused && !player.isDead) {
                joystickAngle = Math.atan2(dy, dx);
                joystickPower = Math.min(1, dist / 60);
                joystickActive = true;
            }
        }
    }, {passive: false});

    canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        for(const t of e.changedTouches) {
            if(t.identifier === canvas._touchActive) {
                canvas._touchActive = null;
                joystickActive = false;
                joystickPower = 0;
            }
        }
    }, {passive: false});

    // Mouse events
    joystick.addEventListener('mousedown', (e) => {
        e.preventDefault();
        startX = e.clientX;
        startY = e.clientY;
        isActive = true;
        joystickActive = true;
        markUserInteracted();
    });

    window.addEventListener('mousemove', (e) => {
        if (!isActive) return;
        processMove(e.clientX, e.clientY);
    });

    window.addEventListener('mouseup', () => {
        if (!isActive) return;
        isActive = false;
        resetKnob();
    });
}

/* ========== ОБНОВЛЕНИЕ ИГРЫ ========== */
function updateGame(dt = 16.6667) {
    if (!gameRunning || gamePaused) return;

    // нормализация по времени: база = 16.6667 ms (60 FPS)
    const frameScale = (typeof dt === 'number' && dt > 0) ? Math.min(dt, 100) / 16.6667 : 1;

    // Плавное обновление камеры (оставляем как было)
    const targetCameraX = player.x - VIEW_WIDTH / 2;
    const targetCameraY = player.y - VIEW_HEIGHT / 2;

    const camLerp = 1 - Math.pow(1 - 0.1, frameScale);
    cameraX += (targetCameraX - cameraX) * camLerp;
    cameraY += (targetCameraY - cameraY) * camLerp;

    cameraX = Math.max(0, Math.min(cameraX, GAME_WIDTH - VIEW_WIDTH));
    cameraY = Math.max(0, Math.min(cameraY, GAME_HEIGHT - VIEW_HEIGHT));
    
    // Управление игроком через джойстик
    // Управление игроком через джойстик (с ограничением резких поворотов)
    if (joystickActive) {
        // Ограничиваем максимальный поворот за кадр (защита от разворота на 180°)
        let angleDiff = joystickAngle - player.angle;
        
        // Нормализуем разницу углов (-PI до PI)
        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
        
        // Максимальный поворот за кадр: 0.15 радиан (~8.5 градусов)
        const maxTurn = 0.15 * frameScale;
        angleDiff = Math.max(-maxTurn, Math.min(maxTurn, angleDiff));
        
        player.angle += angleDiff;
        
        // Нормализуем итоговый угол
        while (player.angle > Math.PI) player.angle -= Math.PI * 2;
        while (player.angle < -Math.PI) player.angle += Math.PI * 2;
    }
    
    // Ускорение (буст)
    if (player.isBoosting && player.boostEnergy > 0 && player.length > 20) {
        player.speed = BOOST_SPEED;
        player.boostEnergy = Math.max(0, player.boostEnergy - BOOST_COST * frameScale);
        player.length = Math.max(20, player.length - 0.1 * frameScale);
    } else {
        player.speed = PLAYER_SPEED;
        player.isBoosting = false;
        player.boostEnergy = Math.min(100, player.boostEnergy + BOOST_RECOVERY * frameScale);
    }
    
    // Обновление позиции игрока
    player.x += Math.cos(player.angle) * player.speed * frameScale;
    player.y += Math.sin(player.angle) * player.speed * frameScale;
    
    player.x = Math.max(50, Math.min(player.x, GAME_WIDTH - 50));
    player.y = Math.max(50, Math.min(player.y, GAME_HEIGHT - 50));
    
    // Обновление сегментов игрока с учетом роста в ширину
    if (player.segments.length > 0) {
        const targetBaseSize = 10 + (player.length - 100) * 0.02;
        player.baseSize = Math.min(20, targetBaseSize);
        
        player.segments.unshift({ 
            x: player.x, 
            y: player.y, 
            size: player.baseSize 
        });
        if (player.segments.length > player.length) {
            player.segments.pop();
        }
        
        for (let i = 0; i < player.segments.length; i++) {
            player.segments[i].size = Math.max(6, player.baseSize - i * 0.02);
        }
    }
    
    // Обновление ИИ червей с улучшенной логикой
    updateAI(frameScale);
    
    // Удаление старых орбов от смерти (через 30 секунд)
    const now = Date.now();
    const ORB_LIFETIME = 30000; // 30 секунд
    for (let i = orbs.length - 1; i >= 0; i--) {
        const orb = orbs[i];
        if (orb.fromDeath && orb.spawnTime && (now - orb.spawnTime > ORB_LIFETIME)) {
            // Плавное исчезновение (уменьшаем размер)
            orb.glow -= 0.02;
            if (orb.glow <= 0) {
                orbs.splice(i, 1);
            }
        }
    }
    
    // Проверка столкновений с орбами
    checkOrbCollisions();
    
    // Проверка столкновений между червями
    if (player.isInitialized && !player.isDead) {
        checkWormCollisions();
    }
    
    // Проверка столкновений с астероидами
    checkAsteroidCollisions();
    
    // Обновление частиц
    updateParticles();
    
    // Обновление всплывающего текста
    updateFloatingTexts();
    
    // Обновление UI
    updateUI();
    updateLeaderboard();
    updateRadar();
}

function updateAI(frameScale = 1) {
    const now = Date.now();
    const ORB_SEARCH_RADIUS = 400;
    const PREY_SEARCH_RADIUS = 300;
    const EDGE_PADDING = 150;
    const LOOKAHEAD_DIST = 40;
    const AVOID_DIST = 50;
    const AI_AVOID_DIST = 80;
    
    function findNearestOrb(ai, maxDist) {
        let best = null, bestD = maxDist;
        for (let o of orbs) {
            const d = distance(ai.x, ai.y, o.x, o.y);
            // Приоритет орбам от смерти (в 1.5 раза привлекательнее)
            const priority = o.fromDeath ? d / 1.5 : d;
            if (priority < bestD) { 
                bestD = priority; 
                best = o; 
            }
        }
        return { orb: best, dist: bestD };
    }
    
    function findNearestPrey(ai, maxDist) {
        let best = null, bestD = maxDist;
        // Проверяем других ИИ как добычу
        for (let other of aiWorms) {
            if (other.id === ai.id || other.isDead) continue;
            // Учитываем агрессивность: более агрессивные атакуют более крупных целей
            const aggressionFactor = ai.aggression > 0.7 ? 1.3 : 0.7;
            if (other.length < ai.length * aggressionFactor) {
                const d = distance(ai.x, ai.y, other.x, other.y);
                if (d < bestD && d < ai.visionRange) {
                    bestD = d;
                    best = other;
                }
            }
        }
        
        // Проверяем игрока как добычу (только если ИИ достаточно агрессивный)
        if (ai.aggression > 0.5 && !player.isDead && player.length < ai.length * 1.2) {
            const d = distance(ai.x, ai.y, player.x, player.y);
            if (d < bestD && d < ai.visionRange) {
                bestD = d;
                best = player;
            }
        }
        return { prey: best, dist: bestD };
    }
    
    function findNearestThreat(ai, maxDist) {
        let best = null, bestD = maxDist;
        // Проверяем других ИИ как угрозу
        for (let other of aiWorms) {
            if (other.id === ai.id || other.isDead) continue;
            if (other.length > ai.length * 1.3) {
                const d = distance(ai.x, ai.y, other.x, other.y);
                if (d < bestD) { 
                    bestD = d; 
                    best = other; 
                }
            }
        }
        // Проверяем игрока как угрозу (только если он НАМНОГО больше)
        if (!player.isDead && player.length > ai.length * 2.0) {
            const d = distance(ai.x, ai.y, player.x, player.y);
            // Убегают только если игрок очень близко
            if (d < bestD && d < 150) { 
                bestD = d; 
                best = player; 
            }
        }
        return { threat: best, dist: bestD };
    }
    
    function normAngle(a) {
        while (a > Math.PI) a -= Math.PI * 2;
        while (a < -Math.PI) a += Math.PI * 2;
        return a;
    }
    
    for (let ai of aiWorms) {
        if (ai.isDead) continue;
        
        // Уменьшаем таймер состояния
        if (ai.stateTimer > 0) ai.stateTimer--;
        
        // Обновляем счетчик застревания
        ai._lastX = ai._lastX || ai.x;
        ai._lastY = ai._lastY || ai.y;
        const moved = distance(ai.x, ai.y, ai._lastX, ai._lastY);
        if (moved < 1.0) {
            ai.stuckCounter++;
        } else {
            ai.stuckCounter = 0;
        }
        ai._lastX = ai.x;
        ai._lastY = ai.y;
        
        // Если застрял, меняем состояние
        if (ai.stuckCounter > 60) {
            ai.state = 'wandering';
            ai.stateTimer = 60 + Math.random() * 60;
            ai.targetX = ai.x + (Math.random() - 0.5) * 400;
            ai.targetY = ai.y + (Math.random() - 0.5) * 400;
            ai.stuckCounter = 0;
        }
        
        // Если таймер состояния истек, выбираем новое состояние
        if (ai.stateTimer <= 0) {
            // Случайный выбор состояния с разными вероятностями
            const rand = Math.random();
            
            if (rand < 0.4) { // 40% chance - блуждание
                ai.state = 'wandering';
                ai.stateTimer = 60 + Math.random() * 120;
                // Разные радиусы для разных ИИ
                const wanderRadius = 200 + Math.random() * 300;
                ai.targetX = ai.x + (Math.random() - 0.5) * wanderRadius;
                ai.targetY = ai.y + (Math.random() - 0.5) * wanderRadius;
            } else if (rand < 0.7) { // 30% chance - охота
                ai.state = 'hunting';
                ai.stateTimer = 40 + Math.random() * 80;
            } else { // 30% chance - бегство
                ai.state = 'fleeing';
                ai.stateTimer = 30 + Math.random() * 60;
            }
        }
        
        // Обновляем цель в зависимости от состояния
        if (ai.state === 'hunting') {
            const preyInfo = findNearestPrey(ai, 400);
            if (preyInfo.prey) {
                ai.targetX = preyInfo.prey.x;
                ai.targetY = preyInfo.prey.y;
                // Включаем буст при погоне
                if (preyInfo.dist > 100 && ai.boostEnergy > 30) {
                    ai.isBoosting = true;
                }
            } else {
                // Если добыча исчезла, переходим в режим блуждания
                ai.state = 'wandering';
                ai.stateTimer = 60 + Math.random() * 60;
            }
        } else if (ai.state === 'fleeing') {
            const threatInfo = findNearestThreat(ai, 400);
            if (threatInfo.threat) {
                const angleToThreat = Math.atan2(threatInfo.threat.y - ai.y, threatInfo.threat.x - ai.x);
                ai.targetX = ai.x - Math.cos(angleToThreat) * 200;
                ai.targetY = ai.y - Math.sin(angleToThreat) * 200;
                // Включаем буст при бегстве
                if (threatInfo.dist < 200 && ai.boostEnergy > 20) {
                    ai.isBoosting = true;
                }
            }
        } else if (ai.state === 'wandering') {
            // Проверяем, достигли ли цели
            const distToTarget = distance(ai.x, ai.y, ai.targetX, ai.targetY);
            if (distToTarget < 50 || Math.random() < 0.02) {
                // Ищем ближайший орб
                const orbInfo = findNearestOrb(ai, ORB_SEARCH_RADIUS);
                if (orbInfo.orb && orbInfo.dist < 300) {
                    ai.targetX = orbInfo.orb.x;
                    ai.targetY = orbInfo.orb.y;
                } else {
                    // Новая случайная цель
                    ai.targetX = ai.x + (Math.random() - 0.5) * 400;
                    ai.targetY = ai.y + (Math.random() - 0.5) * 400;
                }
            }
        }
        
        // Проверка и избегание краев карты (более плавное)
        let edgeAvoidX = 0, edgeAvoidY = 0;
        const edgePadding = 150;
        
        if (ai.x < edgePadding) {
            edgeAvoidX = (edgePadding - ai.x) / edgePadding;
        } else if (ai.x > GAME_WIDTH - edgePadding) {
            edgeAvoidX = -(ai.x - (GAME_WIDTH - edgePadding)) / edgePadding;
        }
        
        if (ai.y < edgePadding) {
            edgeAvoidY = (edgePadding - ai.y) / edgePadding;
        } else if (ai.y > GAME_HEIGHT - edgePadding) {
            edgeAvoidY = -(ai.y - (GAME_HEIGHT - edgePadding)) / edgePadding;
        }
        
        // Избегание астероидов (добавлен страх астероидов)
        let asteroidAvoidX = 0, asteroidAvoidY = 0;
        const ASTEROID_AVOID_RANGE = 300;
        
        for (let asteroid of asteroids) {
            const dist = distance(ai.x, ai.y, asteroid.x, asteroid.y);
            if (dist < ASTEROID_AVOID_RANGE) {
                // Чем ближе астероид, тем сильнее избегание
                const avoidAngle = Math.atan2(ai.y - asteroid.y, ai.x - asteroid.x);
                const force = (ASTEROID_AVOID_RANGE - dist) / ASTEROID_AVOID_RANGE;
                // Умножаем на страх астероидов (0.7-1.0)
                asteroidAvoidX += Math.cos(avoidAngle) * force * 150 * ai.asteroidFear;
                asteroidAvoidY += Math.sin(avoidAngle) * force * 150 * ai.asteroidFear;
            }
        }
        
        // Избегание собственного хвоста
        // Избегание собственного хвоста (с защитой от спиралей)
        let tailAvoidX = 0, tailAvoidY = 0;
        const lookX = ai.x + Math.cos(ai.angle) * LOOKAHEAD_DIST;
        const lookY = ai.y + Math.sin(ai.angle) * LOOKAHEAD_DIST;
        
        // Проверяем только если не в спирали (счётчик поворотов)
        ai.turnCounter = ai.turnCounter || 0;
        const lastAngle = ai.lastAngle || ai.angle;
        const angleDelta = Math.abs(normAngle(ai.angle - lastAngle));
        
        // Если постоянно поворачивает в одну сторону - игнорируем хвост
        if (angleDelta > 0.05) {
            ai.turnCounter++;
        } else {
            ai.turnCounter = Math.max(0, ai.turnCounter - 1);
        }
        ai.lastAngle = ai.angle;
        
        // Избегаем хвост только если не закручиваемся
        if (ai.turnCounter < 30) {
            for (let i = 20; i < ai.segments.length && i < 50; i += 8) {
                const seg = ai.segments[i];
                const d = distance(lookX, lookY, seg.x, seg.y);
                if (d < AVOID_DIST) {
                    const avoidAngle = Math.atan2(lookY - seg.y, lookX - seg.x);
                    tailAvoidX += Math.cos(avoidAngle) * (AVOID_DIST - d) / AVOID_DIST;
                    tailAvoidY += Math.sin(avoidAngle) * (AVOID_DIST - d) / AVOID_DIST;
                }
            }
        } else {
            // Если закручиваемся - едем прямо вперёд
            ai.turnCounter = 0;
            ai.targetX = ai.x + Math.cos(ai.angle) * 300;
            ai.targetY = ai.y + Math.sin(ai.angle) * 300;
        }
        
        // Избегание других ИИ червей (улучшенная логика)
        let aiAvoidX = 0, aiAvoidY = 0;
        
        for (let other of aiWorms) {
            if (other.id === ai.id || other.isDead) continue;
            
            // Проверяем расстояние до головы
            const headDist = distance(ai.x, ai.y, other.x, other.y);
            if (headDist < AI_AVOID_DIST) {
                const avoidAngle = Math.atan2(ai.y - other.y, ai.x - other.x);
                const force = (AI_AVOID_DIST - headDist) / AI_AVOID_DIST;
                aiAvoidX += Math.cos(avoidAngle) * force * 80;
                aiAvoidY += Math.sin(avoidAngle) * force * 80;
            }
            
            // Проверяем расстояние до тела (каждый 5й сегмент)
            for (let k = 5; k < other.segments.length; k += 5) {
                const seg = other.segments[k];
                const segDist = distance(lookX, lookY, seg.x, seg.y);
                if (segDist < 60) {
                    const avoidAngle = Math.atan2(lookY - seg.y, lookX - seg.x);
                    const force = (60 - segDist) / 60;
                    aiAvoidX += Math.cos(avoidAngle) * force * 120;
                    aiAvoidY += Math.sin(avoidAngle) * force * 120;
                }
            }
        }
        
        // Избегание ИГРОКА (его тела)
        if (!player.isDead) {
            // Проверяем расстояние до головы игрока
            const playerHeadDist = distance(ai.x, ai.y, player.x, player.y);
            if (playerHeadDist < AI_AVOID_DIST) {
                const avoidAngle = Math.atan2(ai.y - player.y, ai.x - player.x);
                const force = (AI_AVOID_DIST - playerHeadDist) / AI_AVOID_DIST;
                aiAvoidX += Math.cos(avoidAngle) * force * 80;
                aiAvoidY += Math.sin(avoidAngle) * force * 80;
            }
            
            // Проверяем расстояние до тела игрока (каждый 5й сегмент)
            for (let k = 5; k < player.segments.length; k += 5) {
                const seg = player.segments[k];
                const segDist = distance(lookX, lookY, seg.x, seg.y);
                if (segDist < 60) {
                    const avoidAngle = Math.atan2(lookY - seg.y, lookX - seg.x);
                    const force = (60 - segDist) / 60;
                    aiAvoidX += Math.cos(avoidAngle) * force * 120;
                    aiAvoidY += Math.sin(avoidAngle) * force * 120;
                }
            }
        }
        
        // Вычисляем желаемый угол
        let desiredAngle = Math.atan2(
            ai.targetY - ai.y + edgeAvoidY * 100 + tailAvoidY * 50 + aiAvoidY + asteroidAvoidY,
            ai.targetX - ai.x + edgeAvoidX * 100 + tailAvoidX * 50 + aiAvoidX + asteroidAvoidX
        );
        
        // Плавный поворот с индивидуальной скоростью
        let angleDiff = normAngle(desiredAngle - ai.angle);
        const maxTurn = ai.turnSpeed;
        angleDiff = Math.max(-maxTurn, Math.min(maxTurn, angleDiff));
        ai.angle = normAngle(ai.angle + angleDiff);
        
        // Управление скоростью и бустом
        if (ai.isBoosting && ai.boostEnergy > 0 && ai.length > 20) {
            ai.speed = BOOST_SPEED * (0.9 + Math.random() * 0.2);
            ai.boostEnergy = Math.max(0, ai.boostEnergy - BOOST_COST * 0.7);
            ai.length = Math.max(20, ai.length - 0.05);
        } else {
            ai.speed = PLAYER_SPEED * (0.8 + Math.random() * 0.4);
            ai.isBoosting = false;
            ai.boostEnergy = Math.min(100, ai.boostEnergy + BOOST_RECOVERY * 0.5);
        }
        
        // Движение
        ai.x += Math.cos(ai.angle) * ai.speed * frameScale;
        ai.y += Math.sin(ai.angle) * ai.speed * frameScale;
        
        // Границы
        ai.x = Math.max(50, Math.min(ai.x, GAME_WIDTH - 50));
        ai.y = Math.max(50, Math.min(ai.y, GAME_HEIGHT - 50));
        
        // Обновление сегментов
        if (ai.segments.length > 0) {
            const aiTargetBaseSize = 8 + (ai.length - 50) * 0.015;
            ai.baseSize = Math.min(16, aiTargetBaseSize);
            ai.segments.unshift({
                x: ai.x,
                y: ai.y,
                size: ai.baseSize
            });
            if (ai.segments.length > ai.length) ai.segments.pop();
            for (let i = 0; i < ai.segments.length; i++) {
                ai.segments[i].size = Math.max(5, ai.baseSize - i * 0.02);
            }
        }
    }
}

function checkOrbCollisions() {
    for (let i = orbs.length - 1; i >= 0; i--) {
        const orb = orbs[i];
        const dist = distance(player.x, player.y, orb.x, orb.y);
        
        if (dist < 15) {
            player.length += 0.004 * player.maxLength;
            player.maxLength = Math.max(player.maxLength, player.length);
            player.orbsCollected++;
            player.currentCombo++;
            player.bestCombo = Math.max(player.bestCombo, player.currentCombo);
            
            // EK логика: каждые 130 орбов → 1 EK, максимум 3/сеанс
            if (player.orbsCollected % EK_ORBS_REQUIRED === 0 && sessionEK < EK_SESSION_LIMIT) {
              sessionEK++;
              safeAwardGameEK(1, player.x, player.y);
              spawnFloatingText('+1 EK', player.x, player.y - 16, '#ffd54f');
            }
            
            // Награда каждые 30 орбов
            if (player.orbsCollected % ORBS_PER_REWARD === 0) {
                earnedRewards++;
                const reward = safeGetOfflinePercent(3);
                totalEarnedKSPT += reward;
                
                spawnFloatingText(`+${reward.toFixed(2)} KSPT`, player.x, player.y, '#00e5ff');
                safeAwardGameReward(reward, player.x, player.y);
                
                createParticles(player.x, player.y, '#00e5ff', 15);
                playSound('grow');
                gameVibrate([100, 50, 100]);
            } else {
                playSound('orb');
                gameVibrate(30);
            }
            
            orbs.splice(i, 1);
            orbs.push({
                x: Math.random() * GAME_WIDTH,
                y: Math.random() * GAME_HEIGHT,
                size: ORB_SIZE,
                color: `hsl(${Math.random() * 360}, 100%, 70%)`,
                glow: Math.random() * 0.5 + 0.5
            });
            
            createParticles(orb.x, orb.y, orb.color, 8);
            break;
        }
        
        for (let ai of aiWorms) {
            if (ai.isDead) continue;
            const aiDist = distance(ai.x, ai.y, orb.x, orb.y);
            if (aiDist < 15) {
                ai.length += 0.004 * ai.maxLength;
                ai.maxLength = Math.max(ai.maxLength, ai.length);
                
                orbs.splice(i, 1);
                orbs.push({
                    x: Math.random() * GAME_WIDTH,
                    y: Math.random() * GAME_HEIGHT,
                    size: ORB_SIZE,
                    color: `hsl(${Math.random() * 360}, 100%, 70%)`,
                    glow: Math.random() * 0.5 + 0.5
                });
                break;
            }
        }
    }
}

function checkAsteroidCollisions() {
    // Проверка столкновения игрока с астероидами
    for (let asteroid of asteroids) {
        const dist = distance(player.x, player.y, asteroid.x, asteroid.y);
        if (dist < player.baseSize + asteroid.size) {
            playerDie();
            return;
        }
    }
    
    // Проверка столкновения ИИ с астероидами
    for (let ai of aiWorms) {
        if (ai.isDead) continue;
        
        for (let asteroid of asteroids) {
            const dist = distance(ai.x, ai.y, asteroid.x, asteroid.y);
            if (dist < ai.baseSize + asteroid.size) {
                killWorm(ai, null); // Убиваем ИИ астероидом
                break;
            }
        }
    }
}

function checkWormCollisions() {
    for (let i = 15; i < player.segments.length; i += 3) {
        const seg = player.segments[i];
        const dist = distance(player.x, player.y, seg.x, seg.y);
        if (dist < 12) {
            playerDie();
            return;
        }
    }
    
    if (player.isDead) return;
    
    for (let ai of aiWorms) {
        if (ai.isDead) continue;
        
        // Проверка столкновения головы игрока с телом ИИ
        for (let j = 10; j < ai.segments.length; j += 3) {
            const seg = ai.segments[j];
            const dist = distance(player.x, player.y, seg.x, seg.y);
            if (dist < 12) {
                playerDie();
                return;
            }
        }
        
        // Проверка столкновения головы ИИ с телом игрока
        for (let j = 10; j < player.segments.length; j += 3) {
            const seg = player.segments[j];
            const dist = distance(ai.x, ai.y, seg.x, seg.y);
            if (dist < 12) {
                killWorm(ai, player);
                break;
            }
        }
        
        const headDist = distance(player.x, player.y, ai.x, ai.y);
        if (headDist < 20) {
            if (player.length < ai.length) {
                playerDie();
                return;
            } else if (player.length > ai.length) {
                killWorm(ai, player);
            }
        }
    }
    
    // Проверка столкновений между ИИ червями
    for (let i = 0; i < aiWorms.length; i++) {
        const ai1 = aiWorms[i];
        if (ai1.isDead) continue;
        
        for (let j = i + 1; j < aiWorms.length; j++) {
            const ai2 = aiWorms[j];
            if (ai2.isDead) continue;
            
            // Проверка головы ai1 с телом ai2
            for (let k = 10; k < ai2.segments.length; k += 3) {
                const seg = ai2.segments[k];
                const dist = distance(ai1.x, ai1.y, seg.x, seg.y);
                if (dist < 12) {
                    killWorm(ai1, ai2);
                    break;
                }
            }
            
            if (ai1.isDead) continue;
            
            // Проверка головы ai2 с телом ai1
            for (let k = 10; k < ai1.segments.length; k += 3) {
                const seg = ai1.segments[k];
                const dist = distance(ai2.x, ai2.y, seg.x, seg.y);
                if (dist < 12) {
                    killWorm(ai2, ai1);
                    break;
                }
            }
            
            // Проверка столкновения голов
            const headDist = distance(ai1.x, ai1.y, ai2.x, ai2.y);
            if (headDist < 20) {
                if (ai1.length < ai2.length) {
                    killWorm(ai1, ai2);
                } else if (ai1.length > ai2.length) {
                    killWorm(ai2, ai1);
                }
            }
        }
    }
}

function checkOnlineCollisions() {
    if (!_slOnline || player.isDead) return;
    for (const rp of Object.values(_slRemotePlayers)) {
        if (!rp.alive || !rp.currentSegs || rp.currentSegs.length === 0) continue;
        // Голова игрока врезается в тело онлайн-игрока
        for (const seg of rp.currentSegs) {
            const dist = distance(player.x, player.y, seg.x, seg.y);
            if (dist < (seg.size || 10) + player.baseSize) {
                _slSendDeath();
                playerDie();
                return;
            }
        }
    }
}

function killWorm(worm, killer) {
    if (worm.isDead) return;
    
    worm.isDead = true;
    
    if (killer === player) {
        player.kills++;
        player.currentCombo += 5;
        player.bestCombo = Math.max(player.bestCombo, player.currentCombo);
        
        const reward = safeGetOfflinePercent(1);
        totalEarnedKSPT += reward;
        
        spawnFloatingText(`+${reward.toFixed(2)} KSPT`, worm.x, worm.y, '#ff9800');
        safeAwardGameReward(reward, worm.x, worm.y);
        
        playSound('kill');
        gameVibrate([100, 50, 100]);
    }
    
    // Ограничиваем максимум орбов до 100 (было worm.length / 3)
    const maxOrbs = Math.min(100, worm.length / 3);
    const now = Date.now();
    for (let i = 0; i < maxOrbs; i++) {
        const segIndex = Math.floor((i / maxOrbs) * worm.segments.length);
        if (segIndex < worm.segments.length) {
            const seg = worm.segments[segIndex];
            orbs.push({
                x: seg.x + (Math.random() - 0.5) * 20,
                y: seg.y + (Math.random() - 0.5) * 20,
                size: ORB_SIZE * 1.5,
                color: worm.color,
                glow: 1,
                spawnTime: now,  // Время создания
                fromDeath: true  // Маркер что орб от смерти
            });
        }
    }
    
    createParticles(worm.x, worm.y, worm.color, 15);
    playSound('crash');
    
    setTimeout(() => {
        if (!gameRunning) return;
        
        worm.isDead = false;
        let newX, newY;
        let attempts = 0;
        do {
            newX = Math.random() * GAME_WIDTH;
            newY = Math.random() * GAME_HEIGHT;
            attempts++;
        } while (distance(player.x, player.y, newX, newY) < 400 && attempts < 20);
        
        worm.x = newX;
        worm.y = newY;
        worm.length = 150 + Math.random() * 200;
        worm.maxLength = worm.length;
        worm.boostEnergy = 50 + Math.random() * 50;
        worm.lastTurnTime = 0;
        worm.stuckCounter = 0;
        
        worm.segments = [];
        for (let j = 0; j < worm.length; j++) {
            worm.segments.push({
                x: worm.x - Math.cos(worm.angle) * j * 1.5,
                y: worm.y - Math.sin(worm.angle) * j * 1.5,
                size: Math.max(5, worm.baseSize - j * 0.02)
            });
        }
    }, 5000);
}

function playerDie() {
    if (player.isDead) return;
    
    player.isDead = true;
    if (_slOnline) _slSendDeath();
    player.currentCombo = 0;
    
    const maxPlayerOrbs = Math.min(100, Math.floor(player.length / 3));
    for (let i = 0; i < maxPlayerOrbs; i++) {
        const segIndex = Math.floor((i / maxPlayerOrbs) * player.segments.length);
        if (segIndex < player.segments.length) {
            const seg = player.segments[segIndex];
            orbs.push({
                x: seg.x + (Math.random() - 0.5) * 20,
                y: seg.y + (Math.random() - 0.5) * 20,
                size: ORB_SIZE * 1.5,
                color: player.color,
                glow: 1
            });
        }
    }
    
    createParticles(player.x, player.y, player.color, 40);
    playSound('crash');
    gameVibrate([200, 100, 200]);
    
    setTimeout(() => {
        endGame();
    }, 1000);
}

function endGame() {
    gameRunning = false;
    
    const timeSurvived = Math.floor((Date.now() - startTime) / 1000);
    try { (window.parent||window.top).postMessage({ type:'kspt_game_record', game:'slither', value: timeSurvived }, '*'); } catch(e){}
    
    finalLengthEl.textContent = Math.floor(player.maxLength);
    finalOrbsEl.textContent = player.orbsCollected;
    finalComboEl.textContent = player.bestCombo;
    finalTimeEl.textContent = `${timeSurvived}s`;
    finalKillsEl.textContent = player.kills;
    earnedKSPTEl.textContent = totalEarnedKSPT.toFixed(2);
    earnedEKElem.textContent = sessionEK; // Показываем EK
    
    gameOverScreen.style.display = 'block';
    
    if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
    }
}

/* ========== ЭФФЕКТЫ ========== */
function createParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3;
        const size = 2 + Math.random() * 4;
        const life = 0.5 + Math.random() * 0.5;
        
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: life,
            maxLife: life,
            color: color,
            size: size,
            rotation: 0,
            rotationSpeed: (Math.random() - 0.5) * 0.1
        });
    }
}

function spawnFloatingText(text, x, y, color = '#00e676') {
    floatingTexts.push({
        text, x, y,
        color,
        alpha: 1,
        vy: -1,
        life: 1
    });
}

function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.05;
        p.life -= 0.015;
        p.rotation += p.rotationSpeed;
        
        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }
}

function updateFloatingTexts() {
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const text = floatingTexts[i];
        text.y += text.vy;
        text.alpha -= 0.015;
        text.vy *= 0.95;
        
        if (text.alpha <= 0) {
            floatingTexts.splice(i, 1);
        }
    }
}

/* ========== UI ========== */
function updateUI() {
    lengthEl.textContent = Math.floor(player.length);
    orbsEl.textContent = player.orbsCollected;
    
    boostBar.style.width = player.boostEnergy + '%';
    
    if (player.boostEnergy < 20) {
        boostBar.style.background = '#ff4081';
    } else if (player.boostEnergy < 50) {
        boostBar.style.background = '#ff9800';
    } else {
        boostBar.style.background = 'linear-gradient(90deg, var(--accent), var(--accent-2))';
    }
}

function updateLeaderboard() {
    const allPlayers = [
        { ...player,
          name: _slOnline ? _slMyName : 'Player 1 (You)',
          score: Math.floor(player.length) * 10 + player.kills * 100 }
    ];
    
    for (let ai of aiWorms) {
        if (!ai.isDead) {
            allPlayers.push({
                ...ai,
                score: Math.floor(ai.length) * 10
            });
        }
    }

    // Добавляем онлайн-игроков
    if (_slOnline) {
      for (const rp of Object.values(_slRemotePlayers)) {
        if (rp.alive) {
          allPlayers.push({
            id: rp.uid,
            name: rp.name,
            color: rp.color,
            score: Math.floor(rp.length || 100) * 10
          });
        }
      }
    }
    
    allPlayers.sort((a, b) => b.score - a.score);
    
    const playerRank = allPlayers.findIndex(p => p.id === 0) + 1;
    rankEl.textContent = `#${playerRank}`;
    
    let html = '';
    for (let i = 0; i < Math.min(allPlayers.length, 5); i++) {
        const p = allPlayers[i];
        const isYou = p.id === 0;
        const rank = i + 1;
        
        html += `
            <div class="leaderboard-entry ${isYou ? 'you' : ''}">
                <div class="rank">#${rank}</div>
                <div class="name">${p.name}</div>
                <div class="score">${p.score}</div>
            </div>
        `;
    }
    
    leaderboardEntries.innerHTML = html;
}

function updateRadar() {
    const radar = document.getElementById('radar');
    radar.innerHTML = '<div class="radar-center"></div>';

    const RADAR_SIZE = 110;
    const radarScale = RADAR_SIZE / 600;
    const center = RADAR_SIZE / 2;

    // === ORBS ===
    for (let orb of orbs) {
        const dx = orb.x - player.x;
        const dy = orb.y - player.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < 300) {
            const angle = Math.atan2(dy, dx);
            const radarDist = dist * radarScale;

            const x = center + Math.cos(angle) * radarDist;
            const y = center + Math.sin(angle) * radarDist;

            if (x >= 0 && x <= RADAR_SIZE && y >= 0 && y <= RADAR_SIZE) {
                const dot = document.createElement('div');
                dot.className = 'radar-dot';
                dot.style.left = x + 'px';
                dot.style.top = y + 'px';
                dot.style.background = orb.color;
                dot.style.opacity = 0.7;
                radar.appendChild(dot);
            }
        }
    }

    // === AI WORMS ===
    for (let ai of aiWorms) {
        if (ai.isDead) continue;

        const dx = ai.x - player.x;
        const dy = ai.y - player.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < 400) {
            const angle = Math.atan2(dy, dx);
            const radarDist = dist * radarScale;

            const x = center + Math.cos(angle) * radarDist;
            const y = center + Math.sin(angle) * radarDist;

            if (x >= 0 && x <= RADAR_SIZE && y >= 0 && y <= RADAR_SIZE) {
                const dot = document.createElement('div');
                dot.className = 'radar-dot';
                dot.style.left = x + 'px';
                dot.style.top = y + 'px';
                dot.style.background = ai.color;
                dot.style.width = '8px';
                dot.style.height = '8px';
                dot.style.opacity = 0.9;
                radar.appendChild(dot);
            }
        }
    }
}

/* ========== ОТРИСОВКА ========== */
function draw() {
    // Очистка холста
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);
    
    // Рисование звездного фона
    drawStars();
    
    // Перевод координат для камеры
    ctx.save();
    ctx.translate(-cameraX, -cameraY);
    
    // Рисование астероидов
    drawAsteroids();
    
    // Рисование орбов
    drawOrbs();
    
    // Кэшируем самого большого червя один раз
    const largestWorm = getLargestWorm();
    
    // Рисование ИИ червей
    for (let ai of aiWorms) {
        if (!ai.isDead) {
            drawWorm(ai, ai === largestWorm);
        }
    }

    // Рисование онлайн-игроков с интерполяцией
    if (_slOnline) {
      const nowMs = Date.now();
      for (const rp of Object.values(_slRemotePlayers)) {
        if (!rp.alive) continue;
        const elapsed = nowMs - (rp.lastUpdateTime || nowMs);
        const alpha = Math.min(1.0, elapsed / SLITHER_SEND_INTERVAL);

        // Интерполируем позицию
        rp.currentX = (rp.prevX || rp.targetX) + (rp.targetX - (rp.prevX || rp.targetX)) * alpha;
        rp.currentY = (rp.prevY || rp.targetY) + (rp.targetY - (rp.prevY || rp.targetY)) * alpha;

        // Интерполируем угол (кратчайший путь)
        let dA = (rp.targetAngle || 0) - (rp.prevAngle || 0);
        while (dA > Math.PI) dA -= Math.PI * 2;
        while (dA < -Math.PI) dA += Math.PI * 2;
        rp.currentAngle = (rp.prevAngle || 0) + dA * alpha;

        // Интерполируем сегменты
        const prevSegs = rp.prevSegs || [];
        const targSegs = rp.targetSegs || [];
        rp.currentSegs = targSegs.map((ts, i) => {
          const ps = prevSegs[i];
          if (!ps) return { x: ts[0], y: ts[1], size: ts[2] };
          return {
            x: ps[0] + (ts[0] - ps[0]) * alpha,
            y: ps[1] + (ts[1] - ps[1]) * alpha,
            size: ts[2]
          };
        });

        // Строим фиктивный объект червя для drawWorm
        const fakeWorm = {
          x: rp.currentX,
          y: rp.currentY,
          angle: rp.currentAngle,
          color: rp.color,
          name: rp.name,
          length: rp.length || 100,
          segments: rp.currentSegs.length > 0
            ? rp.currentSegs
            : [{ x: rp.currentX, y: rp.currentY, size: 10 }],
          isDead: false,
          isInitialized: true,
          id: -1 // не игрок
        };
        drawWorm(fakeWorm, false);

        // Рисуем имя над головой
        const sx = rp.currentX - cameraX;
        const sy = rp.currentY - cameraY;
        if (sx > -50 && sx < VIEW_WIDTH+50 && sy > -50 && sy < VIEW_HEIGHT+50) {
          ctx.save();
          ctx.font = 'bold 11px Arial';
          ctx.fillStyle = '#fff';
          ctx.textAlign = 'center';
          ctx.shadowColor = 'rgba(0,0,0,0.8)';
          ctx.shadowBlur = 4;
          ctx.fillText(rp.name, sx, sy - 18);
          ctx.restore();
        }
      }
    }
    
    // Рисование игрока
    if (!player.isDead && player.isInitialized) {
        drawWorm(player, player === largestWorm);
    }
    
    // Рисование частиц
    drawParticles();
    
    // Рисование всплывающего текста
    drawFloatingTexts();
    
    ctx.restore();
}

function drawStars() {
    const time = Date.now() * 0.001;
    
    // Рисуем только звезды в видимой области
    const startX = Math.max(0, Math.floor(cameraX / 10) * 10);
    const startY = Math.max(0, Math.floor(cameraY / 10) * 10);
    const endX = Math.min(GAME_WIDTH, cameraX + VIEW_WIDTH + 100);
    const endY = Math.min(GAME_HEIGHT, cameraY + VIEW_HEIGHT + 100);
    
    for (let star of stars) {
        // Проверяем, находится ли звезда в видимой области
        if (star.x < startX || star.x > endX || star.y < startY || star.y > endY) {
            continue;
        }
        
        const screenX = star.x - cameraX;
        const screenY = star.y - cameraY;
        
        // Мерцание звезд
        const twinkle = Math.sin(time * star.twinkleSpeed * 0.5) * 0.3 + 0.7;
        
        ctx.globalAlpha = star.brightness * twinkle;
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(screenX, screenY, star.size, 0, Math.PI * 2);
        ctx.fill();
        
        // Большие звезды имеют свечение
        if (star.size > 1.5) {
            ctx.globalAlpha = star.brightness * twinkle * 0.3;
            ctx.beginPath();
            ctx.arc(screenX, screenY, star.size * 2, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    ctx.globalAlpha = 1;
}

function drawAsteroids() {
    for (let asteroid of asteroids) {
        if (asteroid.x < cameraX - 50 || asteroid.x > cameraX + VIEW_WIDTH + 50 ||
            asteroid.y < cameraY - 50 || asteroid.y > cameraY + VIEW_HEIGHT + 50) {
            continue;
        }
        
        const screenX = asteroid.x;
        const screenY = asteroid.y;
        
        ctx.fillStyle = asteroid.color;
        ctx.beginPath();
        ctx.arc(screenX, screenY, asteroid.size, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.globalAlpha = 0.3;
        ctx.beginPath();
        ctx.arc(screenX, screenY, asteroid.size + 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.beginPath();
        ctx.arc(screenX - asteroid.size * 0.3, screenY - asteroid.size * 0.3, asteroid.size * 0.4, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawOrbs() {
    for (let orb of orbs) {
        if (orb.x < cameraX - 50 || orb.x > cameraX + VIEW_WIDTH + 50 ||
            orb.y < cameraY - 50 || orb.y > cameraY + VIEW_HEIGHT + 50) {
            continue;
        }
        
        const screenX = orb.x;
        const screenY = orb.y;
        
        ctx.shadowColor = orb.color;
        ctx.shadowBlur = 15 * orb.glow;
        ctx.fillStyle = orb.color;
        ctx.beginPath();
        ctx.arc(screenX, screenY, orb.size, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(screenX, screenY, orb.size * 0.5, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.globalAlpha = 0.3 + Math.sin(Date.now() * 0.005 + orb.x) * 0.2;
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(screenX - orb.size * 0.3, screenY - orb.size * 0.3, orb.size * 0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

function drawWorm(worm, isLargest) {
    if (worm.segments.length === 0) return;
    
    for (let i = worm.segments.length - 1; i >= 0; i--) {
        const seg = worm.segments[i];
        const progress = i / worm.segments.length;
        const size = seg.size * (0.8 + progress * 0.2);
        
        if (seg.x < cameraX - 100 || seg.x > cameraX + VIEW_WIDTH + 100 ||
            seg.y < cameraY - 100 || seg.y > cameraY + VIEW_HEIGHT + 100) {
            continue;
        }
        
        if (!isFinite(seg.x) || !isFinite(seg.y) || !isFinite(size) || size <= 0) continue;
        const gradient = ctx.createRadialGradient(seg.x, seg.y, 0, seg.x, seg.y, size);
        const color = worm.color;
        gradient.addColorStop(0, color);
        gradient.addColorStop(0.7, color);
        gradient.addColorStop(1, `rgba(${parseInt(color.slice(1,3),16)}, ${parseInt(color.slice(3,5),16)}, ${parseInt(color.slice(5,7),16)}, 0.3)`);
        
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(seg.x, seg.y, size, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(seg.x, seg.y, size, 0, Math.PI * 2);
        ctx.stroke();
        
        if (i % 5 === 0 && size > 5) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(seg.x, seg.y, size * 0.8, 0, Math.PI * 2);
            ctx.stroke();
        }
    }
    
    const head = worm.segments[0];
    if (!head) return;
    
    ctx.shadowColor = worm.color;
    ctx.shadowBlur = 20;
    ctx.fillStyle = worm.color;
    ctx.beginPath();
    ctx.arc(head.x, head.y, head.size, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.shadowBlur = 0;
    
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(head.x, head.y, head.size * 0.5, 0, Math.PI * 2);
    ctx.fill();
    
    const eyeOffset = head.size * 0.3;
    const eyeSize = head.size * 0.2;
    
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(head.x - eyeOffset, head.y - eyeOffset * 0.5, eyeSize, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.beginPath();
    ctx.arc(head.x + eyeOffset, head.y - eyeOffset * 0.5, eyeSize, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(head.x - eyeOffset - eyeSize * 0.3, head.y - eyeOffset * 0.5 - eyeSize * 0.3, eyeSize * 0.3, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.beginPath();
    ctx.arc(head.x + eyeOffset - eyeSize * 0.3, head.y - eyeOffset * 0.5 - eyeSize * 0.3, eyeSize * 0.3, 0, Math.PI * 2);
    ctx.fill();
    
    // Корона для самого большого червя
    // Корона для самого большого червя
    if (isLargest) {
        ctx.save();
        ctx.translate(head.x, head.y - head.size - 10);
        
        // Основание короны
        ctx.fillStyle = 'gold';
        ctx.fillRect(-12, 0, 24, 8);
        
        // Зубцы короны (3 штуки)
        ctx.beginPath();
        // Левый зубец
        ctx.moveTo(-10, 0);
        ctx.lineTo(-8, -8);
        ctx.lineTo(-6, 0);
        // Центральный зубец
        ctx.lineTo(-2, 0);
        ctx.lineTo(0, -10);
        ctx.lineTo(2, 0);
        // Правый зубец
        ctx.lineTo(6, 0);
        ctx.lineTo(8, -8);
        ctx.lineTo(10, 0);
        ctx.closePath();
        ctx.fill();
        
        // Обводка короны
        ctx.strokeStyle = '#FFD700';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        
        // Драгоценные камни на зубцах
        ctx.fillStyle = '#ff4081';
        ctx.beginPath();
        ctx.arc(0, -10, 2, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = '#00bcd4';
        ctx.beginPath();
        ctx.arc(-8, -8, 1.5, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.beginPath();
        ctx.arc(8, -8, 1.5, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.restore();
    }

    if (worm.isBoosting) {
        for (let i = 0; i < 3; i++) {
            const trailX = head.x - Math.cos(worm.angle) * (10 + i * 5);
            const trailY = head.y - Math.sin(worm.angle) * (10 + i * 5);
            const trailSize = head.size * (0.5 - i * 0.1);
            
            const trailGradient = ctx.createRadialGradient(trailX, trailY, 0, trailX, trailY, trailSize);
            trailGradient.addColorStop(0, '#ff9800');
            trailGradient.addColorStop(1, 'rgba(255, 152, 0, 0)');
            
            ctx.fillStyle = trailGradient;
            ctx.beginPath();
            ctx.arc(trailX, trailY, trailSize, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

function drawParticles() {
    for (let p of particles) {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function drawFloatingTexts() {
    for (let text of floatingTexts) {
        ctx.globalAlpha = text.alpha;
        ctx.fillStyle = text.color;
        ctx.font = 'bold 14px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text.text, text.x, text.y);
    }
    ctx.globalAlpha = 1;
}

function getLargestWorm() {
    let largest = player;
    let maxLength = player.length;
    
    for (let ai of aiWorms) {
        if (!ai.isDead && ai.length > maxLength) {
            maxLength = ai.length;
            largest = ai;
        }
    }
    
    return largest;
}

/* ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ========== */
function distance(x1, y1, x2, y2) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    return Math.sqrt(dx * dx + dy * dy);
}

function gameLoop(ts) {

    if (!__lastFrameTS) __lastFrameTS = ts || performance.now();

    let dt = (ts || performance.now()) - __lastFrameTS;

    if (dt > 100) dt = 100;

    __lastFrameTS = ts || performance.now();

    updateGame(dt);
    draw();
    animationId = requestAnimationFrame(gameLoop);
}

// ===== ОНЛАЙН: найти или создать комнату =====
async function _slFindOrCreateRoom() {
  if (!window._slitherDB) return null;
  const db = window._slitherDB;
  const roomsRef = db.ref('slither_rooms');

  // Ищем комнату с местом (< MAX_PLAYERS игроков)
  const snap = await roomsRef.orderByChild('playerCount').endAt(SLITHER_MAX_PLAYERS - 1).limitToFirst(5).once('value');
  const rooms = snap.val() || {};

  for (const [roomId, room] of Object.entries(rooms)) {
    const count = Object.keys(room.players || {}).length;
    if (count < SLITHER_MAX_PLAYERS) {
      return roomId;
    }
  }

  // Создаём новую комнату
  const newRef = roomsRef.push();
  await newRef.set({ playerCount: 0, createdAt: Date.now(), players: {} });
  return newRef.key;
}

// ===== ОНЛАЙН: присоединиться к комнате =====
async function _slJoinOnline() {
  if (!window._slitherDB || !_slMyUid) return;

  try {
    _slRoomId = await _slFindOrCreateRoom();
    if (!_slRoomId) return;

    _slOnline = true;
    _slRoomRef = window._slitherDB.ref(`slither_rooms/${_slRoomId}/players/${_slMyUid}`);

    // При отключении — удалить себя
    _slDisconnectCleanup = _slRoomRef.onDisconnect();
    _slDisconnectCleanup.remove();

    // Записываем себя
    await _slRoomRef.set({
      uid: _slMyUid,
      name: _slMyName,
      color: player.color,
      x: player.x,
      y: player.y,
      angle: player.angle,
      length: player.length,
      alive: true,
      t: Date.now()
    });

    // Обновляем счётчик
    window._slitherDB.ref(`slither_rooms/${_slRoomId}/playerCount`).transaction(c => (c || 0) + 1);

    // Слушаем других игроков
    window._slitherDB.ref(`slither_rooms/${_slRoomId}/players`).on('child_added', _slOnPlayerAdded);
    window._slitherDB.ref(`slither_rooms/${_slRoomId}/players`).on('child_changed', _slOnPlayerChanged);
    window._slitherDB.ref(`slither_rooms/${_slRoomId}/players`).on('child_removed', _slOnPlayerRemoved);

    // Слушаем орбы от умерших онлайн-игроков
    window._slitherDB.ref(`slither_rooms/${_slRoomId}/death_orbs`).on('child_added', _slOnDeathOrbs);

    // Запускаем отправку своего состояния
    _slSendTimer = setInterval(_slSendState, SLITHER_SEND_INTERVAL);

    console.log('[Slither Online] Joined room', _slRoomId);
  } catch(e) {
    console.warn('[Slither Online] Join failed', e);
    _slOnline = false;
  }
}

// ===== ОНЛАЙН: выйти из комнаты =====
function _slLeaveOnline() {
  if (!_slOnline || !_slRoomId) return;
  try {
    if (_slSendTimer) { clearInterval(_slSendTimer); _slSendTimer = null; }
    if (_slRoomRef) { _slRoomRef.remove(); _slRoomRef = null; }
    window._slitherDB.ref(`slither_rooms/${_slRoomId}/players`).off();
    window._slitherDB.ref(`slither_rooms/${_slRoomId}/death_orbs`).off();
    window._slitherDB.ref(`slither_rooms/${_slRoomId}/playerCount`).transaction(c => Math.max(0, (c||1)-1));
    _slOnline = false;
    _slRoomId = null;
    _slRemotePlayers = {};
  } catch(e) {}
}

function _slSendState() {
  if (!_slOnline || !_slRoomRef || player.isDead) return;
  // Упрощённые сегменты — каждый 4-й для экономии трафика
  const segs = [];
  for (let i = 0; i < player.segments.length; i += 4) {
    const s = player.segments[i];
    segs.push([Math.round(s.x), Math.round(s.y), Math.round(s.size)]);
  }
  _slRoomRef.set({
    uid: _slMyUid,
    name: _slMyName,
    color: player.color,
    x: Math.round(player.x * 10) / 10,
    y: Math.round(player.y * 10) / 10,
    angle: Math.round(player.angle * 1000) / 1000,
    length: Math.round(player.length),
    alive: true,
    segs,
    t: Date.now()
  });
}

// Вызвать при смерти игрока — оставить орбы в Firebase
function _slSendDeath() {
  if (!_slOnline || !_slRoomId) return;
  // Публикуем орбы от смерти
  const deathOrbs = player.segments
    .filter((_, i) => i % 3 === 0)
    .slice(0, 80)
    .map(s => ({ x: Math.round(s.x), y: Math.round(s.y), color: player.color }));
  window._slitherDB.ref(`slither_rooms/${_slRoomId}/death_orbs`).push({
    orbs: deathOrbs,
    t: Date.now()
  });
  _slRoomRef.update({ alive: false });
}

function _slOnPlayerAdded(snap) {
  const uid = snap.key;
  const data = snap.val();
  if (!data || uid === _slMyUid) return;
  if (_slRemotePlayers[uid]) return; // уже есть
  _slRemotePlayers[uid] = {
    uid, name: data.name, color: data.color,
    x: data.x, y: data.y, angle: data.angle, length: data.length,
    prevX: data.x, prevY: data.y, prevAngle: data.angle,
    targetX: data.x, targetY: data.y, targetAngle: data.angle,
    segs: data.segs || [],
    prevSegs: [],
    targetSegs: [],
    lastUpdateTime: Date.now(),
    alive: data.alive !== false
  };
}

function _slOnPlayerChanged(snap) {
  const uid = snap.key;
  const data = snap.val();
  if (!data || uid === _slMyUid) return;
  if (!_slRemotePlayers[uid]) { _slOnPlayerAdded(snap); return; }
  const rp = _slRemotePlayers[uid];
  // Сохраняем предыдущие позиции для интерполяции
  rp.prevX = rp.currentX ?? rp.x;
  rp.prevY = rp.currentY ?? rp.y;
  rp.prevAngle = rp.currentAngle ?? rp.angle;
  rp.prevSegs = rp.currentSegs || rp.segs || [];
  rp.targetX = data.x;
  rp.targetY = data.y;
  rp.targetAngle = data.angle;
  rp.targetSegs = data.segs || [];
  rp.length = data.length;
  rp.color = data.color;
  rp.name = data.name;
  rp.alive = data.alive !== false;
  rp.lastUpdateTime = Date.now();
}

function _slOnPlayerRemoved(snap) {
  delete _slRemotePlayers[snap.key];
}

function _slOnDeathOrbs(snap) {
  const data = snap.val();
  if (!data || !data.orbs) return;
  const now = Date.now();
  // Добавляем орбы от умершего онлайн-игрока локально
  for (const o of data.orbs) {
    orbs.push({
      x: o.x + (Math.random()-0.5)*20,
      y: o.y + (Math.random()-0.5)*20,
      size: ORB_SIZE * 1.5,
      color: o.color || '#ff9800',
      glow: 1,
      spawnTime: now,
      fromDeath: true
    });
  }
  // Удаляем запись чтобы не накапливалась
  snap.ref.remove();
}

/* ========== ЗАПУСК ИГРЫ ========== */
function startGame() {
    setupJoystick();
    initGame();
}

window.addEventListener('load', startGame);

    }
  }

  // listen parent message to force recalculation (parent посылает размеры)
  window.addEventListener('message', (ev) => {
    const d = ev.data || {};
    if (d && d.type === 'kspt_parent_viewport') {
      // для точности — делаем fit через 50ms (после отрисовки)
      setTimeout(fitGameUI, 50);
    }
  });

  // resize on orientation / window resize
  window.addEventListener('resize', fitGameUI);
  window.addEventListener('orientationchange', () => setTimeout(fitGameUI, 120));
  window.addEventListener('load', () => setTimeout(fitGameUI, 80));

  // additionally: prevent overscroll inside iframe (iOS)
  document.addEventListener('touchmove', function(e){
    // allow touch for game controls (they are inside this iframe) — не отменяем,
    // но предотвращаем внутреннюю "резину" страницы, если цель — не элемент управления.
    // Если нужно сделать более тонко — можно разрешить touchmove для .joystick-bg:
    const el = e.target;
    if (el.closest && (el.closest('.joystick-bg') || el.closest('.game-buttons') || el.closest('canvas'))) {
      // allow normal game interaction
      return;
    }
    // otherwise prevent page overscroll
    e.preventDefault();
  }, { passive: false });
})();
</script>
