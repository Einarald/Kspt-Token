<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Ghost Train 3D — KSPT</title>
<!-- Подключаем библиотеку Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* ===== SAFE AREA FIX ===== */
html, body {
  padding-bottom: env(safe-area-inset-bottom, 0);
  padding-top: env(safe-area-inset-top, 0);
  box-sizing: border-box;
}

.kspt-safe-bottom {
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
}

:root {
  --accent: #00bcd4;
  --accent-2: #00e676;
  --bg: #0a0f0f;
  --panel: #0b0b0b;
  --neon-glow: 0 0 10px #00e676, 0 0 20px #00bcd4;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 0;
  background: #000;
  color: #fff;
  font-family: 'Arial', sans-serif;
  overflow: hidden;
}

.game-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100vh;
  padding: 10px;
  background: linear-gradient(135deg, #0b1a1a 0%, #0a0f0f 100%);
  position: relative;
}

.game-header {
  display: flex;
  justify-content: space-between;
  width: 100%;
  margin-bottom: 10px;
  padding: 10px 16px;
  background: rgba(0, 20, 20, 0.7);
  border-radius: 30px;
  border: 1px solid var(--accent-2);
  backdrop-filter: blur(4px);
  box-shadow: 0 0 15px rgba(0,230,118,0.3);
  z-index: 10;
}

.game-title {
  color: var(--accent-2);
  font-weight: bold;
  font-size: 18px;
  text-shadow: 0 0 6px #00e676;
}

.game-stats {
  display: flex;
  gap: 20px;
  font-size: 15px;
  color: #ccffdd;
}

/* Three.js холст */
canvas {
  background: #051010;
  border: 2px solid var(--accent-2);
  border-radius: 24px;
  box-shadow: 0 0 40px rgba(0,230,118,0.4), inset 0 0 20px rgba(0,255,200,0.1);
  display: block;
  width: 100%;
  height: auto;
  max-width: 400px;
  touch-action: none;
}

.arrow-panel {
  display: flex;
  justify-content: center;
  gap: 30px;
  margin: 16px 0 10px;
  width: 100%;
  z-index: 10;
}

.arrow-btn {
  background: rgba(0, 40, 40, 0.8);
  border: 2px solid var(--accent-2);
  border-radius: 60px;
  width: 80px;
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  font-weight: bold;
  color: var(--accent-2);
  box-shadow: 0 0 20px #00e676, inset 0 0 10px #aaffaa;
  cursor: pointer;
  user-select: none;
  transition: all 0.08s ease;
  touch-action: manipulation;
}

.arrow-btn:active {
  transform: scale(0.92);
  background: #00e67622;
  box-shadow: 0 0 30px #00ffaa;
}

.game-buttons {
  display: flex;
  gap: 12px;
  margin-top: 6px;
  margin-bottom: 8px;
  width: 100%;
  justify-content: center;
  flex-wrap: wrap;
  z-index: 10;
}

.game-buttons button {
  padding: 12px 22px;
  background: linear-gradient(145deg, #002020, #003333);
  color: #d0ffd0;
  border: 1px solid var(--accent-2);
  border-radius: 40px;
  cursor: pointer;
  font-weight: bold;
  font-size: 16px;
  letter-spacing: 0.5px;
  box-shadow: 0 0 12px #00b8b0, inset 0 1px 4px #aaffaa;
  transition: transform 0.08s ease, box-shadow 0.12s ease;
}

.game-buttons button:active {
  transform: scale(0.94);
  box-shadow: 0 0 6px #00e676, inset 0 0 8px #004d4d;
}

.game-over {
  display: none;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0, 15, 15, 0.95);
  backdrop-filter: blur(10px);
  padding: 30px;
  border-radius: 40px;
  border: 2px solid var(--accent-2);
  text-align: center;
  z-index: 200;
  width: 80%;
  max-width: 340px;
  box-shadow: 0 0 60px #00e676;
}

.game-over h2 {
  color: #ff8888;
  margin-top: 0;
  font-size: 32px;
  text-shadow: 0 0 12px #ff6666;
}

.earned {
  color: var(--accent-2);
  font-weight: bold;
  font-size: 26px;
  margin: 12px 0;
  text-shadow: 0 0 12px #00e676;
}
</style>
</head>
<body>
<div class="game-container">
  <div class="game-header">
    <div class="game-title">👻 GHOST TRAIN 3D</div>
    <div class="game-stats">
      <div>🚆 <span id="score">0</span></div>
      <div>📦 <span id="collected">0</span></div>
      <div>⚡ <span id="speed">100%</span></div>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div class="arrow-panel">
    <!-- Идентификаторы сохранены для совместимости с внешними скриптами -->
    <div class="arrow-btn" id="arrowUp">◀</div>
    <div class="arrow-btn" id="arrowDown">▶</div>
  </div>

  <div class="game-buttons">
    <button id="pauseBtn">⏸️ Pause</button>
    <button id="restartBtn">🔄 Restart (-1)</button>
    <button id="exitBtn">🚪 Exit</button>
  </div>
</div>

<div class="game-over" id="gameOverScreen">
  <h2>💀 GAME OVER</h2>
  <div>✨ Score: <span id="finalScore">0</span></div>
  <div>🧩 Collected: <span id="finalCollected">0</span></div>
  <div class="earned">+<span id="earnedKSPT">0.00</span> KSPT</div>
  <div class="earned">+<span id="earnedEK">0</span> EK</div>
  <button id="playAgainBtn" style="background:#007755; color:white; margin-bottom:10px; border:none; padding:14px; border-radius:50px; width:100%; font-weight:bold;">▶ Play Again</button>
  <button id="exitToMenuBtn" style="background:#774444; color:white; border:none; padding:14px; border-radius:50px; width:100%; font-weight:bold;">🏁 Exit to Menu</button>
</div>

<script>
// ========== ГЛОБАЛЬНЫЕ ХЕЛПЕРЫ (Оригинальные) ==========
function getLocalTicketCount() {
  try {
    const raw = localStorage.getItem('kspt_tickets');
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (data && typeof data.current === 'number') return data.current;
    if (data && data.current != null) return Number(data.current) || 0;
  } catch (e) { return null; }
  return null;
}

function ensureHasTicketOrWarn() {
  const c = getLocalTicketCount();
  if (c === null) return true; 
  if (c <= 0) {
    try { (window.parent || window.top).postMessage({ type: 'kspt_no_tickets' }, '*'); } catch(e){}
    try { showToast && showToast("Not enough tickets!"); } catch(e){ alert("Not enough tickets!"); }
    return false;
  }
  return true;
}

function isSameOrigin(win) {
  try { void win.location.href; return true; } catch (e) { return false; }
}

window.__kspt_hourly = window.__kspt_hourly || 0;

window.addEventListener('message', (ev) => {
  const msg = ev.data;
  if (!msg || typeof msg !== 'object') return;

  if (msg.type === 'kspt_init' || msg.type === 'kspt_hourly_update') {
    const h = Number(msg.hourly) || 0;
    window.__kspt_hourly = h;
  }

  if (msg.type === 'kspt_no_tickets') {
    gameRunning = false;
    gamePaused = true;
    document.getElementById('gameOverScreen').style.display = 'block';
    alert("Not enough tickets!");
  }

  if (msg.type === 'kspt_parent_set_game_over' && msg.blockButtons) {
    const pauseBtn = document.getElementById('pauseBtn');
    if (pauseBtn) pauseBtn.setAttribute('disabled','true');
    const restartBtn = document.getElementById('restartBtn');
    if (restartBtn) restartBtn.setAttribute('disabled','true');
    const exitBtn = document.getElementById('exitBtn');
    if (exitBtn) exitBtn.setAttribute('disabled','true');
    const arrowUp = document.getElementById('arrowUp');
    if (arrowUp) arrowUp.style.pointerEvents = 'none';
    const arrowDown = document.getElementById('arrowDown');
    if (arrowDown) arrowDown.style.pointerEvents = 'none';
  }
});

function safeGetOfflinePercent(percent) {
  try {
    if (typeof HOST !== 'undefined' && HOST !== window && typeof HOST.getOfflinePercent === 'function') {
      return Number(HOST.getOfflinePercent(percent)) || 0;
    }
  } catch (e) { }

  if (typeof window.__kspt_hourly === 'number') {
    return Math.round((window.__kspt_hourly * (percent/100)) * 100) / 100;
  }

  try {
    const raw = localStorage.getItem('kspt_data') || localStorage.getItem('d') || null;
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed.offlineHourly === 'number') {
        return Math.round((parsed.offlineHourly * (percent/100)) * 100) / 100;
      }
    }
  } catch(e) {}
  return 0;
}

function safeAwardGameReward(amount, x = 0, y = 0) {
  try {
    if (window.top && window.top !== window && isSameOrigin(window.top) && typeof window.top.awardGameReward === 'function') {
      window.top.awardGameReward(Number(amount) || 0, x || 0, y || 0);
      return;
    }
  } catch (e) { }
  try {
    (window.parent || window.top).postMessage({ type: 'kspt_award_reward', reward: Number(amount) || 0, x: x || 0, y: y || 0 }, '*');
    return;
  } catch (e) { }
}

function safeAwardGameEK(amount, x = 0, y = 0) {
  try {
    if (window.top && window.top !== window && isSameOrigin(window.top) && typeof window.top.awardGameEK === 'function') {
      window.top.awardGameEK(Number(amount) || 0, x, y);
      return;
    }
  } catch(e) {}
  try {
    (window.parent || window.top).postMessage({ type: 'ek_award', amount: Number(amount)||0, x, y }, '*');
    return;
  } catch(e){}
}

function safePlaySound(name) {
  try {
    if (window.top && window.top !== window && isSameOrigin(window.top) && typeof window.top.playSound === 'function') {
      window.top.playSound(name);
      return;
    }
  } catch (e) { }

  try {
    if (!window._localAudioCtx) {
      window._localAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    const ctx = window._localAudioCtx;
    if (ctx.state === 'suspended' && typeof ctx.resume === 'function') {
      ctx.resume().catch(()=>{});
    }
    const now = ctx.currentTime;

    if (name === 'apple') { 
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(900, now);
      o.frequency.exponentialRampToValueAtTime(520, now + 0.12);
      g.gain.setValueAtTime(0.0, now);
      g.gain.linearRampToValueAtTime(0.18, now + 0.008);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
      o.connect(g); g.connect(ctx.destination);
      o.start(now); o.stop(now + 0.26);
      return;
    }
    if (name === 'lose') { 
      const o1 = ctx.createOscillator();
      const g1 = ctx.createGain();
      o1.type = 'sawtooth';
      o1.frequency.setValueAtTime(200, now);
      o1.frequency.exponentialRampToValueAtTime(80, now + 0.3);
      g1.gain.setValueAtTime(0.2, now);
      g1.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      o1.connect(g1); g1.connect(ctx.destination);
      o1.start(now); o1.stop(now + 0.4);
      return;
    }
    {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(1200, now);
      g.gain.setValueAtTime(0, now);
      g.gain.linearRampToValueAtTime(0.16, now + 0.005);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      o.connect(g); g.connect(ctx.destination);
      o.start(now); o.stop(now + 0.18);
      return;
    }
  } catch (e) {}
}

function safeVibrate(pattern){
  if (navigator.vibrate) navigator.vibrate(pattern);
}

// ========== 3D GAME VARIABLES ==========
// UI Elements
const scoreEl = document.getElementById('score');
const collectedEl = document.getElementById('collected');
const speedEl = document.getElementById('speed');
const gameOverScreen = document.getElementById('gameOverScreen');
const finalScoreEl = document.getElementById('finalScore');
const finalCollectedEl = document.getElementById('finalCollected');
const earnedKSPTEl = document.getElementById('earnedKSPT');
const earnedEKElem = document.getElementById('earnedEK');

// Game State
let score = 0;
let collectedCount = 0;
let sessionEK = 0;
let earnedKSPT = 0;

let baseSpeed = 0.011;    // 3D units per ms (Уменьшена начальная скорость)
let currentSpeed = baseSpeed;
// Уменьшено в 4 раза по запросу
let accel = 0.000000525;   // Speed increase 30% slower
let spawnInterval = 800;  // ms
const MIN_SPAWN_INTERVAL = 300;
let lastSpawnTime = 0;
let gameRunning = true;
let gamePaused = false;
let animationId = null;
let lastFrameTime = performance.now();

// 3D Engine Variables
let scene, camera, renderer;
let trainGroup;
let objects = []; // { z, lane, type, mesh }
let ties = [];    // moving track ties
let particles;
let wheels = [];  // Для анимации крутящихся колес

// ТРИ ПОЛОСЫ: Left (0) = -1.5, Center (1) = 0, Right (2) = 1.5
let currentLane = 1; 
const LANE_X = [-1.5, 0, 1.5];

// Магия: Функция, закругляющая трассу вниз вдали (эффект горизонта)
function getCurveY(z) {
  if (z > 0) return 0; // Прямо перед камерой не гнем
  return -0.002 * Math.pow(z, 2); // Парабола уходит вниз
}

// ========== THREE.JS SETUP ==========
function initThree() {
  const canvas = document.getElementById('gameCanvas');
  
  // Scene & Camera
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x051010, 0.025); // Призрачный туман
  
  camera = new THREE.PerspectiveCamera(70, 360 / 480, 0.1, 150);
  camera.position.set(0, 3.5, 7.5); // Камера немного выше и дальше из-за 3 полос
  camera.lookAt(0, 0, -10);

  renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setClearColor(0x051010);
  
  // Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
  scene.add(ambientLight);
  
  const directionalLight = new THREE.DirectionalLight(0x00ffaa, 0.6);
  directionalLight.position.set(5, 10, 5);
  scene.add(directionalLight);

  // УЛУЧШЕННЫЙ ПОЕЗД (Новая модель)
  trainGroup = new THREE.Group();
  wheels = [];

  // Измененные цвета: более светлая и отчетливая "сталь" для поезда
  const mainMat = new THREE.MeshStandardMaterial({ color: 0x335566, roughness: 0.3, metalness: 0.6 });
  const darkMat = new THREE.MeshStandardMaterial({ color: 0x1a2229, roughness: 0.8 });
  const neonMat = new THREE.MeshStandardMaterial({ color: 0x00e676, emissive: 0x005522 });

  // 1. Шасси (Основа)
  const chassisGeo = new THREE.BoxGeometry(1.6, 0.3, 3.2);
  const chassis = new THREE.Mesh(chassisGeo, mainMat);
  chassis.position.y = 0.4;
  trainGroup.add(chassis);

  // 2. Котел (Цилиндр спереди)
  const boilerGeo = new THREE.CylinderGeometry(0.55, 0.55, 1.8, 16);
  boilerGeo.rotateX(Math.PI / 2);
  const boiler = new THREE.Mesh(boilerGeo, mainMat);
  boiler.position.set(0, 0.95, -0.6);
  trainGroup.add(boiler);

  // 3. Кабина (Квадратная будка сзади)
  const cabinGeo = new THREE.BoxGeometry(1.5, 1.2, 1.2);
  const cabin = new THREE.Mesh(cabinGeo, mainMat);
  cabin.position.set(0, 1.15, 0.9);
  trainGroup.add(cabin);

  // 4. Крыша (Шире кабины)
  const roofGeo = new THREE.BoxGeometry(1.7, 0.15, 1.4);
  const roof = new THREE.Mesh(roofGeo, darkMat);
  roof.position.set(0, 1.8, 0.9);
  trainGroup.add(roof);

  // 5. Труба (Дымоход)
  const stackGeo = new THREE.CylinderGeometry(0.25, 0.15, 0.6, 16);
  const stack = new THREE.Mesh(stackGeo, mainMat);
  stack.position.set(0, 1.5, -1.1);
  trainGroup.add(stack);

  // 6. Отбойник / Метельник (Спереди)
  const cowGeo = new THREE.ConeGeometry(0.8, 0.6, 4);
  cowGeo.rotateY(Math.PI / 4);
  cowGeo.rotateX(Math.PI / 2);
  const cowMat = new THREE.MeshStandardMaterial({ color: 0x002222, wireframe: true });
  const cow = new THREE.Mesh(cowGeo, cowMat);
  cow.position.set(0, 0.5, -1.9);
  trainGroup.add(cow);

  // 7. Светящиеся Колеса
  const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.15, 16);
  wheelGeo.rotateZ(Math.PI / 2);
  const wheelPositionsZ = [-1.0, 0.1, 1.1]; // 3 пары колес
  wheelPositionsZ.forEach(z => {
    const wLeft = new THREE.Mesh(wheelGeo, neonMat);
    wLeft.position.set(-0.85, 0.35, z);
    trainGroup.add(wLeft);
    wheels.push(wLeft);

    const wRight = new THREE.Mesh(wheelGeo, neonMat);
    wRight.position.set(0.85, 0.35, z);
    trainGroup.add(wRight);
    wheels.push(wRight);
  });

  // 8. Фара (На котле спереди)
  const hlGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.1, 16);
  hlGeo.rotateX(Math.PI / 2);
  const hlMat = new THREE.MeshBasicMaterial({ color: 0xeeff88 });
  const hl = new THREE.Mesh(hlGeo, hlMat);
  hl.position.set(0, 0.95, -1.55);
  trainGroup.add(hl);

  // 9. Золотой Хомяк в кабине (Заменяем текстуру на красивую сферу/фигуру)
  const hamsterGeo = new THREE.SphereGeometry(0.35, 16, 16);
  const hamsterMat = new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.2 }); // Золотой
  const hamster = new THREE.Mesh(hamsterGeo, hamsterMat);
  hamster.position.set(0, 1.25, 0.9);
  trainGroup.add(hamster);

  // Свет поезда
  const pointLight = new THREE.PointLight(0x00e676, 2, 10);
  pointLight.position.set(0, 1.5, 0);
  trainGroup.add(pointLight);

  // Устанавливаем поезд на путь (Средняя полоса)
  trainGroup.position.x = LANE_X[currentLane];
  trainGroup.position.z = 0;
  scene.add(trainGroup);

  // Track Lines (Статичные направляющие для 3 полос = 4 линии)
  createRail(-2.25);
  createRail(-0.75);
  createRail(0.75);
  createRail(2.25);

  // Moving Ties (Шпалы на все 3 полосы)
  const tieGeo = new THREE.BoxGeometry(4.8, 0.1, 0.3);
  const tieMat = new THREE.MeshStandardMaterial({ color: 0x113322 });
  for (let i = 0; i < 30; i++) {
    const tie = new THREE.Mesh(tieGeo, tieMat);
    tie.position.z = 5 - i * 3;
    scene.add(tie);
    ties.push(tie);
  }

  // Ghost Particles
  const partGeo = new THREE.BufferGeometry();
  const partCount = 200;
  const positions = new Float32Array(partCount * 3);
  for(let i=0; i<partCount; i++) {
    positions[i*3] = (Math.random() - 0.5) * 20;
    positions[i*3+1] = Math.random() * 10;
    positions[i*3+2] = (Math.random() - 1.0) * 100;
  }
  partGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const partMat = new THREE.PointsMaterial({ color: 0xaaffaa, size: 0.2, transparent: true, opacity: 0.5 });
  particles = new THREE.Points(partGeo, partMat);
  scene.add(particles);

  fitGameUI();
}

function createRail(xOffset) {
  const points = [];
  for (let z = 5; z >= -120; z -= 2) {
    points.push(new THREE.Vector3(xOffset, getCurveY(z), z));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  const mat = new THREE.LineBasicMaterial({ color: 0x00e676, transparent: true, opacity: 0.3 });
  scene.add(new THREE.Line(geo, mat));
}

function cleanUpObjects() {
  objects.forEach(obj => {
    scene.remove(obj.mesh);
    if(obj.mesh.geometry) obj.mesh.geometry.dispose();
    if(obj.mesh.material) obj.mesh.material.dispose();
  });
  objects = [];
}

// ========== GAMEPLAY ==========
function safeToggleDir(dir) {
  const now = Date.now();
  if (now - lastTapTime < 150) return;
  lastTapTime = now;
  
  // Управление 3 полосами (0, 1, 2)
  if (dir < 0 && currentLane > 0) {
    currentLane--;
  } else if (dir > 0 && currentLane < 2) {
    currentLane++;
  }
}

let lastTapTime = 0;

function spawnObject() {
  const lane = Math.floor(Math.random() * 3); // 0, 1 или 2
  const r = Math.random();
  let type;
  
  if (r < 0.70) {
  type = 'coin';        // 70%
} 
else if (r < 0.704 && sessionEK < 2) {
  type = 'ek';          // максимум 2 EK за сессию
} 
else {
  type = 'obstacle';    // остальное
}

  let mesh;
  if (type === 'coin') {
    mesh = new THREE.Mesh(
      new THREE.TorusGeometry(0.4, 0.15, 8, 16),
      new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0x443300 })
    );
    mesh.position.y = 0.8;
  } else if (type === 'ek') {
    mesh = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.5),
      new THREE.MeshStandardMaterial({ color: 0x00e676, emissive: 0x005522 })
    );
    mesh.position.y = 0.8;
  } else {
    // Препятствие - красный барьер (Сделан темнее для атмосферы)
    mesh = new THREE.Mesh(
      new THREE.BoxGeometry(1.2, 1.2, 1.2),
      new THREE.MeshStandardMaterial({ color: 0xaa1111, emissive: 0x330000 })
    );
    mesh.position.y = 0.6;
  }

  const startZ = -100;
  mesh.position.x = LANE_X[lane];
  mesh.position.z = startZ;
  
  scene.add(mesh);
  objects.push({ z: startZ, lane: lane, type: type, mesh: mesh });
}

function updateGame(dt) {
  if (!gameRunning || gamePaused) return;

  // Ускорение со временем (Теперь плавнее)
  currentSpeed += accel * dt;
  if (currentSpeed > 0.06) currentSpeed = 0.06;

  if (spawnInterval > MIN_SPAWN_INTERVAL) {
    spawnInterval -= 0.05 * dt;
    if (spawnInterval < MIN_SPAWN_INTERVAL) spawnInterval = MIN_SPAWN_INTERVAL;
  }

  // Плавное перемещение поезда (Lerp) и наклоны
  const targetX = LANE_X[currentLane];
  trainGroup.position.x += (targetX - trainGroup.position.x) * 0.15;
  // Поезд наклоняется при повороте
  trainGroup.rotation.z = (trainGroup.position.x - targetX) * -0.15;
  // Легкая тряска
  trainGroup.position.y = Math.sin(performance.now() * 0.02) * 0.05;

  // Анимация крутящихся колес поезда
  wheels.forEach(w => {
    w.rotation.x -= currentSpeed * dt * 20;
  });

  // Движение шпал
  ties.forEach(tie => {
    tie.position.z += currentSpeed * dt;
    if (tie.position.z > 5) {
      tie.position.z -= 90; // Возвращаем назад
    }
    tie.position.y = getCurveY(tie.position.z) - 0.1;
  });

  // Движение партиклов тумана
  particles.rotation.z -= 0.0001 * dt;

  // Движение объектов
  for (let i = objects.length - 1; i >= 0; i--) {
    const obj = objects[i];
    obj.z += currentSpeed * dt;
    
    // Анимация вращения
    if (obj.type === 'coin') {
      obj.mesh.rotation.y += 0.05;
    } else if (obj.type === 'ek') {
      obj.mesh.rotation.y += 0.03;
      obj.mesh.rotation.x += 0.02;
    }

    // Применяем кривизну
    obj.mesh.position.z = obj.z;
    obj.mesh.position.y = getCurveY(obj.z) + (obj.type === 'obstacle' ? 0.6 : 0.8);

    // Удаление, если ушел за камеру
    if (obj.z > 5) {
      scene.remove(obj.mesh);
      objects.splice(i, 1);
      continue;
    }

    // Коллизия (Z близко к 0, и полоса совпадает)
    if (Math.abs(obj.z - 0) < 1.4 && obj.lane === currentLane) {
      if (obj.type === 'obstacle') {
        gameOver();
        return;
      } else {
        // Собрали предмет
        if (obj.type === 'coin') {
          score++;
          collectedCount++;
          const reward = safeGetOfflinePercent(0.24) || 0;
          earnedKSPT += reward;
          safeAwardGameReward(reward, window.innerWidth/2, window.innerHeight/2);
          safePlaySound('apple');
          safeVibrate(20);
        } else if (obj.type === 'ek') {
          sessionEK++;
          safeAwardGameEK(1, window.innerWidth/2, window.innerHeight/2);
          safePlaySound('apple');
          safeVibrate(20);
        }
        
        // Визуальный эффект сбора (увеличиваем перед удалением)
        scene.remove(obj.mesh);
        objects.splice(i, 1);
      }
    }
  }

  // Спавн новых
  const now = performance.now();
  if (now - lastSpawnTime > spawnInterval) {
    spawnObject();
    lastSpawnTime = now;
  }

  updateUI();
}

function updateUI() {
  scoreEl.textContent = score;
  collectedEl.textContent = collectedCount;
  const speedPercent = Math.min(100, Math.round(((currentSpeed - baseSpeed) / 0.04) * 100));
  speedEl.textContent = (100 + speedPercent) + '%';
}

function gameOver() {
  if (!gameRunning) return;
  gameRunning = false;
  try { window.parent.postMessage({ type: 'kspt_set_game_over', value: true }, '*'); } catch(e){}
  
  safePlaySound('lose');
  safeVibrate([50, 50, 100]);

  finalScoreEl.textContent = score;
  finalCollectedEl.textContent = collectedCount;
  earnedKSPTEl.textContent = earnedKSPT.toFixed(2);
  earnedEKElem.textContent = sessionEK;
  gameOverScreen.style.display = 'block';
}

function restartGame() {
  try { window.parent.postMessage({ type: 'kspt_set_game_over', value: false }, '*'); } catch(e){}

  cleanUpObjects();
  currentLane = 1; // Возвращаем в центр
  trainGroup.position.x = LANE_X[1];
  trainGroup.rotation.z = 0;
  
  score = 0;
  collectedCount = 0;
  sessionEK = 0;
  earnedKSPT = 0;
  currentSpeed = baseSpeed;
  spawnInterval = 800;
  
  lastSpawnTime = performance.now();
  lastFrameTime = performance.now();
  gameRunning = true;
  gamePaused = false;
  document.getElementById('pauseBtn').textContent = '⏸️ Pause';
  gameOverScreen.style.display = 'none';

  const pauseBtn = document.getElementById('pauseBtn');
  if (pauseBtn) pauseBtn.removeAttribute('disabled');
  const restartBtn = document.getElementById('restartBtn');
  if (restartBtn) restartBtn.removeAttribute('disabled');
  const exitBtn = document.getElementById('exitBtn');
  if (exitBtn) exitBtn.removeAttribute('disabled');
  const arrowUp = document.getElementById('arrowUp');
  if (arrowUp) arrowUp.style.pointerEvents = '';
  const arrowDown = document.getElementById('arrowDown');
  if (arrowDown) arrowDown.style.pointerEvents = '';

  updateUI();
  if (!animationId) animationId = requestAnimationFrame(gameLoop);
}

function exitGame() {
  try {
    if (typeof HOST !== 'undefined' && HOST && typeof HOST.exitGame === 'function') {
      HOST.exitGame(); return;
    }
  } catch (e) {}
  try { (window.top || window.parent || window).postMessage({ type: 'kspt_exit_game' }, '*'); } catch(e){}
}

function togglePause() {
  if (!gameRunning) return;
  gamePaused = !gamePaused;
  document.getElementById('pauseBtn').textContent = gamePaused ? '▶ Resume' : '⏸️ Pause';
}

function gameLoop(now) {
  try {
    if (!lastFrameTime) lastFrameTime = now;
    const dt = Math.min(50, now - lastFrameTime);
    lastFrameTime = now;

    if (!gamePaused && gameRunning) {
      updateGame(dt);
    }

    if (renderer && scene && camera) {
      renderer.render(scene, camera);
    }
  } catch (e) {
    console.error('❌ Ошибка в gameLoop:', e);
  }
  animationId = requestAnimationFrame(gameLoop);
}

// ========== CONTROLS ==========
function setupControls() {
  // Кнопки интерфейса
  document.getElementById('arrowUp').addEventListener('click', () => safeToggleDir(-1)); // Налево
  document.getElementById('arrowDown').addEventListener('click', () => safeToggleDir(1)); // Направо

  const canvasEl = document.getElementById('gameCanvas');
  
  // Тап по левой или правой половине холста
  canvasEl.addEventListener('click', (e) => {
    const rect = canvasEl.getBoundingClientRect();
    const x = e.clientX - rect.left;
    safeToggleDir(x < rect.width / 2 ? -1 : 1);
  });
  
  // Свайп / Тап для мобилок
  canvasEl.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const rect = canvasEl.getBoundingClientRect();
    const x = e.touches[0].clientX - rect.left;
    safeToggleDir(x < rect.width / 2 ? -1 : 1);
  }, { passive: false });

  // Клавиатура
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
      safeToggleDir(-1); e.preventDefault();
    } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      safeToggleDir(1); e.preventDefault();
    } else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
      safeToggleDir(-1); e.preventDefault(); // Для обратной совместимости
    } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
      safeToggleDir(1); e.preventDefault(); // Для обратной совместимости
    } else if (e.key === ' ') {
      togglePause(); e.preventDefault();
    }
  });

  document.getElementById('pauseBtn').addEventListener('click', togglePause);
  document.getElementById('restartBtn').addEventListener('click', () => {
    if (!ensureHasTicketOrWarn()) return;
    try { (window.parent || window.top).postMessage({ type: 'kspt_new_round' }, '*'); } catch(e){}
    restartGame();
  });
  document.getElementById('exitBtn').addEventListener('click', exitGame);
  document.getElementById('exitToMenuBtn').addEventListener('click', exitGame);
  document.getElementById('playAgainBtn').addEventListener('click', () => {
    try { (window.parent || window.top).postMessage({ type: 'kspt_new_round' }, '*'); } catch(e){}
    restartGame();
  });
}

function fitGameUI() {
  const header = document.querySelector('.game-header');
  const headerH = header ? header.getBoundingClientRect().height : 0;
  const availW = window.innerWidth;
  const availH = window.innerHeight - headerH - 120; // запас
  const BASE_W = 360, BASE_H = 480;
  const scale = Math.min(availW / BASE_W, availH / BASE_H, 1.0);

  const w = Math.round(BASE_W * scale);
  const h = Math.round(BASE_H * scale);
  
  if (renderer && camera) {
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }

  const arrowPanel = document.querySelector('.arrow-panel');
  if (arrowPanel) {
    arrowPanel.style.transform = `scale(${scale})`;
    arrowPanel.style.margin = '8px auto';
  }
}

function initGame() {
  initThree();
  setupControls();
  lastSpawnTime = performance.now();
  lastFrameTime = performance.now();
  if (animationId) cancelAnimationFrame(animationId);
  animationId = requestAnimationFrame(gameLoop);

  window.addEventListener('resize', fitGameUI);
  window.addEventListener('orientationchange', () => setTimeout(fitGameUI, 100));
}

window.addEventListener('load', initGame);
</script>
